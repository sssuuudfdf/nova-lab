*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.65 'DM Sans','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}.shell{max-width:1440px;margin:auto;padding:0 34px}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:14px;font-weight:700;letter-spacing:-.035em}.brand-mark{display:inline-grid;place-items:center;width:25px;height:25px;margin-right:9px;border-radius:7px;background:var(--accent);color:#fff;font-size:13px}.top-actions{display:flex;gap:8px;align-items:center}.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;padding:26px 0 56px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}.form-panel{padding:22px;position:sticky;top:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}.panel-head h1,.output-top h2{font-size:16px;font-weight:700;letter-spacing:-.03em;margin:0}.step{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:5px;letter-spacing:.02em}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:600;color:#343b46;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-strong);background:#fff;padding:10px 11px;font:12px/1.6 'Noto Sans KR',sans-serif;border-radius:7px;color:var(--ink);outline:none;transition:border-color .16s,box-shadow .16s}.field input::placeholder,.field textarea::placeholder{color:#a0a6b0}.field input:focus,.field textarea:focus,.field select:focus{border-color:#7296e8;box-shadow:0 0 0 3px #3568d414}.field textarea{min-height:78px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:10px;color:var(--muted);margin-top:5px}.btn{border:1px solid var(--line-strong);background:#fff;color:var(--body);padding:9px 12px;font:600 11px 'DM Sans','Noto Sans KR',sans-serif;cursor:pointer;border-radius:7px;transition:all .16s}.btn:hover{background:#f7f9fc;border-color:#b8c1cf;color:var(--ink)}.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn-primary:hover{background:#2858bc;border-color:#2858bc;color:#fff}.btn-example{width:100%;margin-bottom:8px;background:#fff;color:var(--accent);border-color:#b9cafa}.btn-generate{width:100%;padding:11px 14px;font-size:12px}.form-actions{margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.toast{font-size:11px;color:var(--green);min-height:18px;margin-top:8px}.output-panel{min-width:0}.output-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.output-title{display:flex;align-items:center;gap:10px}.output-label{font-size:10px;font-weight:600;color:var(--muted);background:#f4f6f9;padding:4px 7px;border-radius:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.preview{padding:34px;background:#fff;border:1px solid var(--line);border-radius:12px;min-height:660px;box-shadow:0 2px 8px #20242b04}.empty{min-height:570px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);flex-direction:column}.empty .symbol{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;color:var(--accent);background:#f8faff;font-size:21px;margin-bottom:14px}.empty h3{color:var(--ink);font-size:15px;font-weight:600;margin:0 0 5px}.empty p{max-width:300px;font-size:12px;margin:0}.doc-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:18px;margin-bottom:18px;border-bottom:2px solid var(--ink)}.doc-heading h2{font-size:22px;line-height:1.35;letter-spacing:-.045em;margin:0 0 5px;font-weight:700}.doc-heading p{font-size:12px;color:var(--muted);margin:0}.doc-tag{font-size:10px;font-weight:700;white-space:nowrap;border:1px solid var(--line-strong);border-radius:5px;padding:5px 8px;color:var(--body)}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-strong);border-left:1px solid var(--line-strong);margin-bottom:20px}.meta-item{padding:9px 11px;min-height:55px;border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);min-width:0}.meta-item label{display:block;font-size:9px;color:var(--muted);font-weight:600;margin-bottom:3px}.meta-item span{display:block;font-size:11px;line-height:1.55;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}.meta-item.wide{grid-column:1/-1}.section-title{font-size:12px;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:8px}.section-title:before{content:'';width:3px;height:13px;background:var(--accent);border-radius:2px}.overview{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px}.overview th,.overview td{border:1px solid var(--line-strong);padding:8px;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}.overview th{background:var(--head);text-align:left;font-weight:700;color:#3b4350}.overview td{line-height:1.65}.overview .label-col{width:17%;font-weight:600;background:#fbfcfe}.lesson-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9.5px}.lesson-table th,.lesson-table td{border:1px solid #c7cdd6;padding:8px 7px;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.lesson-table th{background:#f2f5fa;text-align:center;font-weight:700;color:#343c48}.lesson-table .stage{width:8%;text-align:center;font-weight:700}.lesson-table .content{width:14%}.lesson-table .activity{width:27%}.lesson-table .student{width:25%}.lesson-table .materials{width:12%}.lesson-table .assessment{width:14%}.stage-label{display:inline-block;color:var(--accent);background:var(--accent-soft);padding:2px 5px;font-size:9px;border-radius:4px;margin-bottom:4px}.lesson-table p{margin:0 0 5px}.lesson-table p:last-child{margin-bottom:0}.assessment-box{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}.assessment-box h4{font-size:11px;margin:0;padding:9px 11px;background:var(--head);border-bottom:1px solid var(--line)}.assessment-box p{font-size:10px;padding:9px 11px;margin:0;white-space:pre-wrap}.footnote{font-size:10px;color:var(--muted);margin-top:13px}.footer{border-top:1px solid var(--line);padding:18px 0 24px;color:#9299a4;font-size:10px;display:flex;justify-content:space-between}

<header class="shell topbar"><div class="brand"><span class="brand-mark">L</span>LessonPlan</div><div class="top-actions"><button class="btn" onclick="loadExample()">예시 불러오기</button></div></header>
<main class="shell"><section class="workspace"><aside class="panel form-panel"><div class="panel-head"><h1>수업 조건 입력</h1><span class="step">LESSON PLAN</span></div>
<div class="field"><label for="subject">교과 / 단원</label><input id="subject" placeholder="예: 과학 / 열의 이동"></div>
<div class="field"><label for="topic">수업 주제</label><input id="topic" placeholder="예: 얼음을 지켜라 — 단열 챌린지"></div>
<div class="field"><label for="audience">대상 학습자</label><input id="audience" placeholder="예: 중학교 1학년"></div>
<div class="two"><div class="field"><label for="duration">수업 시간(분)</label><input id="duration" type="number" min="15" max="180" value="45"></div><div class="field"><label for="session">차시</label><input id="session" placeholder="예: 1/2차시" value="1/1차시"></div></div>
<div class="field"><label for="date">일시 / 장소</label><input id="date" placeholder="예: 2026. 10. 20. / 과학실"></div>
<div class="field"><label for="form">교수·학습 형태</label><select id="form"><option>탐구 학습</option><option>문제 해결 학습</option><option>의사소통 중심 학습</option><option>협동 학습</option><option>강의 및 개별 활동</option><option>프로젝트 기반 학습</option></select></div>
<div class="field"><label for="objectives">학습 목표</label><textarea id="objectives" placeholder="학습자가 수업 후 할 수 있는 행동으로 작성"></textarea><div class="hint">관찰하거나 확인할 수 있는 행동으로 작성하세요.</div></div>
<div class="field"><label for="materials">활용 자료</label><input id="materials" placeholder="예: 얼음, 컵, 단열재, 온도계"></div>
<div class="field"><label for="sequence">핵심 활동 / 수업 아이디어</label><textarea id="sequence" style="min-height:100px" placeholder="활동 흐름을 단계별로 입력"></textarea></div>
<div class="field"><label for="notes">추가 조건</label><textarea id="notes" placeholder="예: 모둠별 실험, 안전 유의, 수준 차 고려"></textarea></div>
<div class="form-actions"><button class="btn btn-example" onclick="loadExample()">↳ 수업 예시 자동 입력</button><button class="btn btn-primary btn-generate" onclick="generatePlan()">약안 초안 만들기 <span aria-hidden="true">→</span></button><div class="toast" id="toast" aria-live="polite"></div></div></aside>
<section class="output-panel"><div class="output-top"><div class="output-title"><h2>수업 지도안 약안</h2><span class="output-label">PREVIEW</span></div><div class="actions"><button class="btn btn-primary" onclick="downloadPDF()">PDF 다운로드 ↓</button></div></div>
<div class="preview" id="preview"><div class="empty"><div class="symbol">＋</div><h3>수업 예시를 불러와 시작해 보세요.</h3><p>예시를 불러온 뒤 ‘약안 초안 만들기’를 누르면 구체적인 교수·학습 과정안이 생성됩니다.</p></div></div></section></section></main>
<footer class="shell footer"><span>LessonPlan · 수업 지도안 작성</span><span>Editable preview · Print ready</span></footer>
<script>
let current=null;
const val=id=>document.getElementById(id).value.trim();
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function splitItems(s){return s.split(/\n|[.;。]/).map(x=>x.trim()).filter(Boolean)}
function loadExample(){
 const sample={subject:'과학 / 열의 이동과 단열',topic:'얼음을 지켜라 — 단열 챌린지',audience:'초등학교 5~6학년',duration:'45',session:'1/1차시',date:'미정 / 과학실 또는 교실',form:'탐구 학습',objectives:'열은 온도가 높은 곳에서 낮은 곳으로 이동함을 설명할 수 있다.\n여러 단열 재료의 특성을 비교하고 얼음이 녹는 정도를 근거로 효과적인 단열 방법을 제안할 수 있다.\n실험에서 변인을 통제하고 관찰 결과를 표와 문장으로 정리할 수 있다.',materials:'얼음(크기·개수 동일), 종이컵 또는 동일한 용기, 면솜, 신문지, 알루미늄 포일, 천, 고무줄, 타이머, 온도계, 관찰 기록지',sequence:'실험 설계 및 예측하기\n단열 실험을 진행하고 관찰 결과 기록하기\n모둠별 결과 비교·해석 및 근거를 들어 발표하기',notes:'모둠별 얼음의 크기, 용기, 관찰 시간, 얼음의 초기 상태를 같게 유지한다. 가위 사용 시 안전에 유의하고 실험 결과가 예상과 달라도 관찰한 사실을 바탕으로 설명한다. 알루미늄 포일은 날카로운 가장자리에 주의한다.'};
 Object.entries(sample).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v});
 document.getElementById('toast').textContent='예시 입력 완료 · 내용을 확인한 뒤 약안 초안을 만들어 주세요.';
}
function generatePlan(){
 const subject=val('subject')||'과학 / 열의 이동과 단열',topic=val('topic')||'얼음을 지켜라 — 단열 챌린지',audience=val('audience')||'초등학교 5~6학년';
 const duration=Math.max(15,Math.min(180,parseInt(val('duration')||'45',10))),session=val('session')||'1차시',date=val('date')||'미정',form=val('form'),materials=val('materials')||'실험 도구, 활동지',objectives=splitItems(val('objectives')),enteredIdeas=splitItems(val('sequence')),notes=val('notes');
 const obj=objectives.length?objectives:['열은 온도가 높은 곳에서 낮은 곳으로 이동함을 설명할 수 있다.','실험 결과를 비교해 단열 방법을 근거와 함께 제안할 수 있다.','관찰 결과를 기록하고 모둠원과 협력해 결론을 도출할 수 있다.'];
 const ideas=enteredIdeas.length?enteredIdeas:['문제 상황을 살펴보고 예측하기','실험 방법을 설계하고 단열 실험하기','결과를 비교하고 근거를 들어 설명하기'];
 let intro=Math.max(5,Math.round(duration*.18)),wrap=Math.max(5,Math.round(duration*.16)),dev=duration-intro-wrap;if(dev<10){intro=5;wrap=5;dev=duration-10}
 const chunks=[intro,dev,wrap], rows=[];
 rows.push({stage:'도입',mins:chunks[0],content:'문제 상황 제시\n선개념 확인\n학습 목표 공유',teacher:'• 보온 가방에서 얼음이 오래 유지되는 사진 또는 실제 얼음을 제시하고 “얼음이 천천히 녹게 하려면 어떻게 해야 할까요?”라고 질문한다.\n• 학생의 예측을 듣고 열은 온도가 높은 곳에서 낮은 곳으로 이동한다는 선개념을 확인한다.\n• 오늘의 과제와 성공 기준(공정한 비교, 관찰 기록, 근거를 든 설명)을 안내한다.',student:'• 생활 경험을 떠올려 얼음이 녹는 조건을 말한다.\n• 단열에 효과적일 것 같은 재료와 그 이유를 개인별로 예측한다.\n• 학습 목표와 실험 시 지켜야 할 조건을 확인한다.',mat:'얼음, 보온 가방 사진 또는 실물, 예측 기록지',assessment:'진단 질문에 대한 응답\n예측과 이유가 제시되는지 관찰',caution:'정답을 먼저 알려주지 않고 다양한 예측을 수용한다. 학생의 경험을 실험 문제와 연결한다.'});
 const n=ideas.length,weights=n===1?[chunks[1]]:Array.from({length:n},(_,i)=>Math.floor(chunks[1]/n)+(i<chunks[1]%n?1:0));
 const activityData=[
  {content:'활동 1. 실험 설계',teacher:'• 모둠별로 사용할 재료를 정하고 비교할 조건과 바꿀 조건을 구분하도록 안내한다.\n• 얼음 크기, 용기, 관찰 시간 등 같게 유지할 조건을 확인한다.\n• 실험 전 예상 결과와 근거를 기록하게 한다.',student:'• 단열 재료를 선택하고 선택 이유를 설명한다.\n• 바꾸는 조건과 같게 유지할 조건을 기록한다.\n• 모둠 역할(재료 준비, 시간 확인, 관찰·기록)을 나눈다.',mat:'단열 재료, 용기, 실험 설계 기록지',assessment:'변인 통제 계획과 예측의 타당성 확인',caution:'비교 실험에서 한 번에 여러 조건을 바꾸지 않도록 돕는다.'},
  {content:'활동 2. 단열 실험 및 관찰',teacher:'• 동일한 용기와 얼음을 사용해 재료별 실험을 시작하게 한다.\n• 정해진 간격으로 녹은 정도나 온도를 관찰·기록하도록 안내한다.\n• 결과가 예상과 다를 경우 관찰 사실과 추측을 구분하게 한다.',student:'• 안전 수칙을 지키며 용기를 감싸고 실험을 진행한다.\n• 같은 시간 간격으로 상태를 관찰하고 표에 기록한다.\n• 모둠원과 관찰 결과를 대조해 누락된 기록을 보완한다.',mat:'얼음, 용기, 타이머, 온도계, 관찰표',assessment:'기록의 정확성·일관성, 협력 과정 관찰',caution:'실험 시간과 얼음의 초기 조건을 통일한다. 결과가 뚜렷하지 않더라도 데이터를 임의로 바꾸지 않는다.'},
  {content:'활동 3. 결과 해석 및 공유',teacher:'• 모둠별 결과를 비교하고 차이가 나타난 이유를 질문한다.\n• “어떤 자료가 그 주장을 뒷받침하나요?”라고 물어 근거 중심 설명을 촉진한다.\n• 단열은 열의 이동을 줄이는 것이며 열 이동을 완전히 없애는 것은 아님을 정리한다.',student:'• 관찰표에서 핵심 결과를 찾아 모둠의 결론을 작성한다.\n• 효과적이라고 판단한 재료와 근거 데이터를 발표한다.\n• 다른 모둠의 결과와 비교하고 실험의 한계나 개선점을 제안한다.',mat:'관찰 기록지, 칠판 또는 발표 카드',assessment:'결론이 관찰 자료와 연결되는지 확인',caution:'재료의 우열만 발표하기보다 결과를 뒷받침하는 구체적 관찰을 말하도록 한다.'}
 ];
 ideas.forEach((idea,i)=>{const d=activityData[Math.min(i,activityData.length-1)];rows.push({stage:'전개',mins:weights[i],content:`${idea.includes('활동')?'':`활동 ${i+1}. `}${idea}`,teacher:d.teacher,student:d.student,mat:d.mat,assessment:d.assessment,caution:notes||d.caution})});
 rows.push({stage:'정리',mins:chunks[2],content:'개념 정리\n학습 목표 점검\n성찰 및 확장',teacher:'• “열은 어느 방향으로 이동하나요?”, “단열 재료는 어떤 역할을 하나요?”를 질문한다.\n• 모둠의 결론을 학습 목표와 연결해 정리하고, 실험에서 통제한 조건의 중요성을 확인한다.\n• 보온병, 옷, 건축 단열 등 생활 속 적용 사례를 연결한다.',student:'• 열의 이동 방향과 단열의 의미를 자신의 말로 설명한다.\n• 출구 티켓에 오늘의 결론과 이를 뒷받침한 관찰 근거를 작성한다.\n• 실험을 다시 한다면 바꾸고 싶은 점을 한 가지 적는다.',mat:'정리 질문, 출구 티켓',assessment:'출구 티켓: 개념 설명 + 관찰 근거 + 개선점',caution:'개념을 정확히 설명했는지뿐 아니라 근거를 사용했는지도 함께 확인한다.'});
 current={subject,topic,audience,duration,session,date,form,materials,objectives:obj,notes,rows};render();document.getElementById('toast').textContent=`약안 생성 완료 · 총 ${rows.reduce((s,r)=>s+r.mins,0)}분으로 구성했습니다.`;
}
function render(){const p=current;let html=`<div class="doc-heading"><div><h2>${escapeHtml(p.topic)}</h2><p>교수·학습 과정안</p></div><span class="doc-tag">약안</span></div><div class="meta">
 <div class="meta-item"><label>교과 / 단원</label><span contenteditable="true">${escapeHtml(p.subject)}</span></div><div class="meta-item"><label>대상 학습자</label><span contenteditable="true">${escapeHtml(p.audience)}</span></div><div class="meta-item"><label>교수·학습 형태</label><span contenteditable="true">${escapeHtml(p.form)}</span></div>
 <div class="meta-item"><label>차시 / 시간</label><span contenteditable="true">${escapeHtml(p.session)} / ${p.duration}분</span></div><div class="meta-item"><label>일시 / 장소</label><span contenteditable="true">${escapeHtml(p.date)}</span></div><div class="meta-item"><label>준비 자료</label><span contenteditable="true">${escapeHtml(p.materials)}</span></div>
 <div class="meta-item wide"><label>학습 목표</label><span contenteditable="true">${p.objectives.map((o,i)=>`${i+1}. ${escapeHtml(o)}`).join('\n')}</span></div></div>
 <div class="section-title">교수·학습 과정</div><table class="lesson-table"><thead><tr><th class="stage">단계·시간</th><th class="content">학습 내용</th><th class="activity">교수자 활동</th><th class="student">학생 활동</th><th class="materials">자료</th><th class="assessment">평가 및 유의점</th></tr></thead><tbody>`;
 p.rows.forEach(r=>{html+=`<tr><td class="stage"><span class="stage-label">${escapeHtml(r.stage)}</span><br>${r.mins}분</td><td>${escapeHtml(r.content)}</td><td>${escapeHtml(r.teacher)}</td><td>${escapeHtml(r.student)}</td><td contenteditable="true">${escapeHtml(r.mat)}</td><td><p><strong>평가</strong><br>${escapeHtml(r.assessment)}</p><p><strong>유의점</strong><br>${escapeHtml(r.caution)}</p></td></tr>`});
 html+=`</tbody></table><div class="section-title">평가 계획</div><div class="assessment-box"><h4>평가 관점 및 기준</h4><p contenteditable="true">• 개념 이해: 열의 이동 방향과 단열의 역할을 정확하게 설명하는가?\n• 탐구 과정: 비교 조건을 통제하고 관찰 결과를 빠짐없이 기록하는가?\n• 근거 기반 의사소통: 실험 자료를 근거로 결론을 설명하고 다른 의견을 경청하는가?\n• 피드백: 개념 오개념은 질문과 재설명으로 보완하고, 탐구 과정은 관찰 기록과 모둠 피드백으로 지원한다.</p></div><p class="footnote">표 안의 텍스트를 클릭해 수정할 수 있습니다. 시간 배분과 활동 내용은 실제 학급 환경 및 교육과정에 맞게 조정하세요.</p>`;
 document.getElementById('preview').innerHTML=html;
}
function downloadPDF(){
 if(!current){document.getElementById('toast').textContent='먼저 예시를 불러오거나 수업 조건을 입력해 주세요.';return}
 if(typeof html2pdf==='undefined'){document.getElementById('toast').textContent='PDF 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.';return}
 const target=document.getElementById('preview');
 const topic=(current.topic||'수업_지도안_약안').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_');
 const options={
  margin:[9,8,9,8],
  filename:`${topic}_수업지도안.pdf`,
  image:{type:'jpeg',quality:0.98},
  html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollY:0},
  jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},
  pagebreak:{mode:['css','legacy'],avoid:['.meta','.assessment-box','tr']}
 };
 document.getElementById('toast').textContent='PDF 파일을 만들고 있습니다…';
 html2pdf().set(options).from(target).save().then(()=>{
  document.getElementById('toast').textContent='PDF 다운로드가 완료되었습니다.';
 }).catch(()=>{
  document.getElementById('toast').textContent='PDF 생성에 실패했습니다. 다시 시도해 주세요.';
 });
}
</script></body></html>
