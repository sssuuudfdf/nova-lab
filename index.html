At: new Date().toISOString() }); });\n    toast(`${name} 학생 계정이 등록되었습니다.`);\n  });\n  el.querySelectorAll('.entity-card').forEach(card => {\n    card.addEventListener('click', (e) => {\n      if (e.target.closest('.program-select') || e.target.closest('.rename-btn')) return;\n      currentAdminStudent = card.dataset.id; render();\n    });\n  });\n  el.querySelectorAll('.rename-btn').forEach(btn => {\n    btn.addEventListener('click', e => {\n      e.stopPropagation();\n      const s = students.find(x=>x.id===btn.dataset.id);\n      const newName = prompt('새 이름을 입력하세요', s.name);\n      if (newName && newName.trim()){\n        saveState(d => { d.accounts.find(a=>a.id===btn.dataset.id).name = newName.trim(); });\n        toast('이름이 수정되었습니다.');\n      }\n    });\n  });\n  el.querySelectorAll('.program-select').forEach(sel => {\n    sel.addEventListener('click', e => e.stopPropagation());\n    sel.addEventListener('change', e => {\n      const studentId = sel.dataset.id;\n      const programId = sel.value || null;\n      saveState(d => { d.accounts.find(a=>a.id===studentId).programId = programId; });\n      toast('프로그램 배정이 변경되었습니다.');\n    });\n  });\n}\n\nfunction renderAdminStudentDetail(el, studentId){\n  const s = STATE.accounts.find(a=>a.id===studentId);\n  if (!s) { currentAdminStudent = null; return renderAdminStudents(el); }\n  el.innerHTML = `<button class=\"btn btn-ghost\" id=\"back-btn\" style=\"margin-bottom:14px;\">${icon('back')} 목록으로</button><div id=\"detail-slot\"></div>`;\n  document.getElementById('back-btn').addEventListener('click', () => { currentAdminStudent = null; render(); });\n  renderStudentDetailPanel(document.getElementById('detail-slot'), s, { canAddMentorNote:false, canChat:false, canViewChatReadOnly:true, viewerAccount: currentAccount() });\n}\n\nfunction renderAdminMentors(el){\n  const mentors = STATE.accounts.filter(a=>a.role==='mentor');\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">REGISTER</span><h2>멘토(청년 강사) 등록</h2></div></div>\n      <div id=\"admin-mentor-error\"></div>\n      <div class=\"inline-form\">\n        <div class=\"field\"><label>이름</label><input id=\"new-mentor-name\" placeholder=\"예: 이지훈\" /></div>\n        <div class=\"field\"><label>전문 분야</label><input id=\"new-mentor-field\" placeholder=\"예: 로봇·코딩\" /></div>\n        <div class=\"field\"><label>로그인 아이디</label><input id=\"new-mentor-id\" placeholder=\"예: mentor01\" /></div>\n        <div class=\"field\"><label>비밀번호</label><input id=\"new-mentor-pw\" placeholder=\"아이디와 다른 값으로\" /></div>\n        <button class=\"btn btn-primary\" id=\"add-mentor-btn\">등록</button>\n      </div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">MENTORS</span><h2>멘토 목록 (${mentors.length}명)</h2></div></div>\n      ${mentors.length===0 ? `<div class=\"empty-state\">등록된 멘토가 없습니다.</div>` : `\n      <div class=\"list-cards\">\n        ${mentors.map(m=>{\n          const cnt = STATE.accounts.filter(a=>a.role==='student' && studentMentorId(a.id)===m.id).length;\n          return `<div class=\"entity-card\" style=\"cursor:default;\" data-id=\"${m.id}\">\n            <div class=\"head\"><div class=\"avatar\" style=\"background:var(--s-collab-soft); color:var(--s-collab);\">${esc(m.name[0])}</div><div><div class=\"id\">${esc(m.name)}</div><div class=\"grade\">${esc(m.field||'')}</div></div>\n              <button class=\"btn btn-ghost rename-mentor-btn\" data-id=\"${m.id}\" style=\"margin-left:auto;padding:4px 8px;font-size:12px;\">이름 수정</button>\n            </div>\n            <div class=\"chip-row\"><span class=\"tag\">담당 학생 ${cnt}명</span></div>\n          </div>`;\n        }).join('')}\n      </div>`}\n    </div>`;\n  document.getElementById('add-mentor-btn').addEventListener('click', () => {\n    const name = document.getElementById('new-mentor-name').value.trim();\n    const field = document.getElementById('new-mentor-field').value.trim();\n    const id = document.getElementById('new-mentor-id').value.trim();\n    const pw = document.getElementById('new-mentor-pw').value;\n    const err = document.getElementById('admin-mentor-error');\n    if (!name || !id || !pw) { err.innerHTML = `<div class=\"login-error\">이름·아이디·비밀번호를 입력해주세요.</div>`; return; }\n    if (id === pw) { err.innerHTML = `<div class=\"login-error\">아이디와 비밀번호를 다르게 설정해주세요.</div>`; return; }\n    if (STATE.accounts.some(a=>a.id===id)) { err.innerHTML = `<div class=\"login-error\">이미 사용 중인 아이디입니다.</div>`; return; }\n    saveState(d => { d.accounts.push({ id, pw, role:'mentor', name, field, createdAt: new Date().toISOString() }); });\n    toast(`${name} 멘토 계정이 등록되었습니다.`);\n  });\n  el.querySelectorAll('.rename-mentor-btn').forEach(btn => {\n    btn.addEventListener('click', e => {\n      e.stopPropagation();\n      const m = mentors.find(x=>x.id===btn.dataset.id);\n      const newName = prompt('새 이름을 입력하세요', m.name);\n      if (newName && newName.trim()){\n        saveState(d => { d.accounts.find(a=>a.id===btn.dataset.id).name = newName.trim(); });\n        toast('이름이 수정되었습니다.');\n      }\n    });\n  });\n}\n\nfunction renderAdminPrograms(el){\n  if (currentAdminProgram) return renderAdminProgramDetail(el, currentAdminProgram);\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">NEW PROGRAM</span><h2>프로그램(학교·회차) 등록</h2></div></div>\n      <div id=\"admin-program-error\"></div>\n      <div class=\"inline-form\">\n        <div class=\"field\"><label>학교</label><input id=\"new-program-school\" placeholder=\"예: 해운초등학교\" /></div>\n        <div class=\"field\"><label>프로그램/회차명</label><input id=\"new-program-name\" placeholder=\"예: AI 메이커 캠프 1기\" /></div>\n        <button class=\"btn btn-primary\" id=\"add-program-btn\">등록</button>\n      </div>\n      <div class=\"hint\" style=\"margin-top:10px;\">등록 후 목록에서 프로그램을 눌러 담당 멘토를 지정하세요. 실제 수업 지도안(주제·학습목표·수강 학생 등)은 담당 멘토가 '지도안 작성'에서 제출하고, 관리자가 '지도안 승인'에서 검토합니다.</div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">PROGRAMS</span><h2>등록된 프로그램 (${STATE.programs.length}개)</h2></div><div class=\"hint\">이름을 누르면 상세 현황으로 이동합니다</div></div>\n      ${STATE.programs.length===0 ? `<div class=\"empty-state\">등록된 프로그램이 없습니다. 학교별로 수업 회차를 등록해보세요.</div>` : `\n      <div class=\"table-wrap\"><table>\n        <thead><tr><th>학교</th><th>프로그램/회차명</th><th>담당 멘토</th><th>지도안 승인</th><th>등록일</th><th>정식 등록 학생</th></tr></thead>\n        <tbody>\n          ${STATE.programs.map(p => {\n            const cnt = STATE.accounts.filter(a=>a.role==='student' && a.programId===p.id).length;\n            const m = p.mentorId ? STATE.accounts.find(a=>a.id===p.mentorId) : null;\n            const plans = programLessonPlans(p.id);\n            const approvedN = plans.filter(lp=>lp.status==='approved').length;\n            const pendingN = plans.filter(lp=>lp.status==='pending').length;\n            return `<tr class=\"row-link\" data-id=\"${p.id}\" style=\"cursor:pointer;\">\n              <td>${esc(p.school)}</td><td>${esc(p.name)}</td>\n              <td>${m ? esc(m.name) : '<span class=\"pill pill-muted\">미배정</span>'}</td>\n              <td>${approvedN ? `<span class=\"pill pill-good\">승인 ${approvedN}건</span>` : '<span class=\"pill pill-muted\">없음</span>'}${pendingN ? ` <span class=\"pill pill-warn\">대기 ${pendingN}건</span>` : ''}</td>\n              <td>${fmtDate(p.createdAt)}</td><td>${cnt}명</td></tr>`;\n          }).join('')}\n        </tbody>\n      </table></div>`}\n    </div>`;\n  document.getElementById('add-program-btn').addEventListener('click', () => {\n    const school = document.getElementById('new-program-school').value.trim();\n    const name = document.getElementById('new-program-name').value.trim();\n    const err = document.getElementById('admin-program-error');\n    if (!school || !name) { err.innerHTML = `<div class=\"login-error\">학교와 프로그램명을 입력해주세요.</div>`; return; }\n    saveState(d => { d.programs.push({ id:'prog_'+Date.now(), school, name, mentorId:null, createdAt: new Date().toISOString() }); });\n    toast(`${school} · ${name} 프로그램이 등록되었습니다.`);\n  });\n  el.querySelectorAll('.row-link').forEach(row => row.addEventListener('click', () => { currentAdminProgram = row.dataset.id; render(); }));\n}\n// Per-program status screen — admin only sets who teaches the class here.\n// The actual lesson plan (주제·학습목표·준비물·도입-전개-정리 등) and the\n// proposed student roster are authored by that mentor in '지도안 작성' and\n// only become official once approved in '지도안 승인'.\nfunction renderAdminProgramDetail(el, programId){\n  const p = program(programId);\n  if (!p) { currentAdminProgram = null; return renderAdminPrograms(el); }\n  const mentors = STATE.accounts.filter(a=>a.role==='mentor');\n  const plans = programLessonPlans(p.id);\n  const approvedCount = plans.filter(lp=>lp.status==='approved').length;\n  const pendingCount = plans.filter(lp=>lp.status==='pending').length;\n  const enrolledCount = STATE.accounts.filter(a=>a.role==='student' && a.programId===p.id).length;\n  el.innerHTML = `\n    <button class=\"btn btn-ghost\" id=\"back-btn\" style=\"margin-bottom:14px;\">${icon('back')} 목록으로</button>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">PROGRAM</span><h2>${esc(p.school)} · ${esc(p.name)}</h2></div><div class=\"hint\">등록일 ${fmtDate(p.createdAt)}</div></div>\n      <div class=\"field\" style=\"max-width:420px;\"><label>담당 멘토</label>\n        <select id=\"program-mentor-select\" style=\"${selectFieldStyle}\">\n          <option value=\"\">미배정</option>\n          ${mentors.map(m=>`<option value=\"${m.id}\" ${p.mentorId===m.id?'selected':''}>${esc(m.name)}${m.field?' ('+esc(m.field)+')':''}</option>`).join('')}\n        </select>\n      </div>\n      <div class=\"hint\" style=\"margin-top:10px;\">담당 멘토로 지정되면 그 멘토가 '지도안 작성' 메뉴에서 이 프로그램의 수업 지도안과 수강 학생 명단을 제출할 수 있습니다.</div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">STATUS</span><h2>지도안 현황</h2></div><div class=\"hint\">승인 ${approvedCount}건 · 대기 ${pendingCount}건</div></div>\n      <div class=\"chip-row\"><span class=\"tag\">현재 정식 등록 학생 ${enrolledCount}명</span></div>\n      ${plans.length===0 ? `<div class=\"empty-state\" style=\"margin-top:12px;\">아직 제출된 지도안이 없습니다. 담당 멘토가 '지도안 작성'에서 제출하면 여기 표시됩니다.</div>` : `\n      <div class=\"table-wrap\" style=\"margin-top:12px;\"><table>\n        <thead><tr><th>차시</th><th>주제</th><th>상태</th><th>제출일</th></tr></thead>\n        <tbody>${plans.map(lp=>`<tr><td>${lp.sessionNo}차시</td><td>${esc(lp.topic)}</td><td>${lp.status==='approved'?'<span class=\"pill pill-good\">승인됨</span>':lp.status==='rejected'?'<span class=\"pill pill-critical\">반려됨</span>':'<span class=\"pill pill-warn\">대기</span>'}</td><td>${fmtDate(lp.submittedAt)}</td></tr>`).join('')}</tbody>\n      </table></div>\n      <div class=\"hint\" style=\"margin-top:10px;\">대기 중인 지도안은 '지도안 승인' 메뉴에서 검토·승인할 수 있습니다.</div>`}\n    </div>`;\n  document.getElementById('back-btn').addEventListener('click', () => { currentAdminProgram = null; render(); });\n  document.getElementById('program-mentor-select').addEventListener('change', e => {\n    const mentorId = e.target.value || null;\n    saveState(d => { d.programs.find(x=>x.id===p.id).mentorId = mentorId; });\n    toast('담당 멘토가 변경되었습니다.');\n  });\n}\n// Shared detailed lesson-plan card — used both in the mentor's own\n// submission history and the admin approval queue, so both sides see\n// exactly the same real-lesson-plan-format content (주제·소요시간·대상·\n// 학습목표·준비물·도입-전개-정리·제안된 수강 학생).\n// A stage's total minutes, derived from its own rows' time ranges (never\n// entered by hand) — mirrors the real-world 지도안 convention of writing\n// \"도입(15')\" next to the stage name, computed from what was actually\n// timed inside it.\nfunction stageDurationMin(rows){\n  if (!rows || !rows.length) return 0;\n  const starts = rows.map(r=>Number(r.start)||0);\n  const ends = rows.map(r=>Number(r.end)||0);\n  return Math.max(0, Math.max(...ends) - Math.min(...starts));\n}\nfunction renderLessonPlanCard(lp, opts){\n  opts = opts || {};\n  const mentor = STATE.accounts.find(a=>a.id===lp.mentorId);\n  const prog = program(lp.programId);\n  const statusPill = lp.status==='approved' ? '<span class=\"pill pill-good\">승인됨</span>'\n    : lp.status==='rejected' ? '<span class=\"pill pill-critical\">반려됨</span>'\n    : '<span class=\"pill pill-warn\">승인 대기</span>';\n  const stages = lp.stages || [];\n  // 준비물 now lives per-activity-row (matching the real table format) —\n  // roll up every distinct one mentioned anywhere in the plan for the\n  // summary chip row.\n  const allMaterials = [];\n  stages.forEach(s => (s.rows||[]).forEach(r => { if (r.materials && !allMaterials.includes(r.materials)) allMaterials.push(r.materials); }));\n  return `<div class=\"panel\">\n    <div class=\"panel-head\">\n      <div><span class=\"eyebrow\">${lp.sessionNo}차시 지도안</span><h2>${esc(lp.topic||'(주제 미입력)')}</h2></div>\n      <div class=\"hint\">${statusPill}</div>\n    </div>\n    <div class=\"chip-row\">\n      ${prog ? `<span class=\"tag\">${esc(prog.school)} · ${esc(prog.name)}</span>` : ''}\n      ${mentor ? `<span class=\"tag\">작성: ${esc(mentor.name)} 멘토</span>` : ''}\n      <span class=\"tag\">${lp.durationMin ? lp.durationMin+'분' : '시간 미입력'}</span>\n      <span class=\"tag\">대상: ${esc(lp.audience||'미입력')}</span>\n      <span class=\"tag\">제안된 수강 학생 ${(lp.studentIds||[]).length}명</span>\n    </div>\n    <div class=\"grid-2b\" style=\"margin-top:14px;\">\n      <div>\n        <div style=\"font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;\">학습 목표</div>\n        <ul class=\"evidence-list\" style=\"gap:6px;\">${(lp.objectives||[]).length ? lp.objectives.map(o=>`<li>${esc(o)}</li>`).join('') : '<li>-</li>'}</ul>\n      </div>\n      <div>\n        <div style=\"font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;\">준비물</div>\n        <div class=\"chip-row\">${allMaterials.length ? allMaterials.map(m=>`<span class=\"tag\">${esc(m)}</span>`).join('') : '<span class=\"tag\">-</span>'}</div>\n        <div style=\"font-size:11px;font-weight:700;color:var(--text-muted);margin:12px 0 6px;\">핵심 활동 (승인 시 설문 문항에 반영)</div>\n        <div class=\"chip-row\">${(lp.activities||[]).length ? lp.activities.map(a=>`<span class=\"tag\">${esc(a)}</span>`).join('') : '<span class=\"tag\">-</span>'}</div>\n      </div>\n    </div>\n    <div style=\"margin-top:16px;\">\n      ${['도입','전개','정리'].map(stageName => {\n        const s = stages.find(x=>x.stage===stageName) || { stage: stageName, rows: [] };\n        return `<div style=\"margin-bottom:14px;\">\n          <div style=\"font-size:12.5px;font-weight:700;margin-bottom:6px;\">${esc(s.stage)} <span style=\"color:var(--text-muted);font-weight:400;\">(${stageDurationMin(s.rows)}′)</span></div>\n          ${(s.rows||[]).length ? s.rows.map(r => `\n            <div class=\"analysis-item\" style=\"margin-bottom:6px;\">\n              <div class=\"analysis-head\"><b>${esc(String(r.start))}′-${esc(String(r.end))}′ &nbsp; ${esc(r.label||'(활동명 미입력)')}</b></div>\n              <div class=\"grid-2b\" style=\"margin-top:4px;\">\n                <p class=\"analysis-text\"><span style=\"color:var(--text-muted);font-size:11px;\">교사</span><br/>${esc(r.teacher||'-')}</p>\n                <p class=\"analysis-text\"><span style=\"color:var(--text-muted);font-size:11px;\">학생</span><br/>${esc(r.student||'-')}</p>\n              </div>\n              ${(r.materials || r.note) ? `<div class=\"hint\" style=\"margin-top:4px;\">${r.materials?('준비물: '+esc(r.materials)):''}${(r.materials && r.note)?' · ':''}${r.note?('유의점: '+esc(r.note)):''}</div>` : ''}\n            </div>`).join('') : '<div class=\"hint\">입력된 활동이 없습니다.</div>'}\n        </div>`;\n      }).join('')}\n    </div>\n    ${opts.canDecide && lp.status==='pending' ? `\n    <div class=\"form-actions\">\n      <button class=\"btn btn-primary approve-plan-btn\" data-id=\"${lp.id}\">승인 (정규 교육으로 반영)</button>\n      <button class=\"btn btn-ghost reject-plan-btn\" data-id=\"${lp.id}\">반려</button>\n    </div>` : ''}\n  </div>`;\n}\n// Admin approval queue — a submitted lesson plan is not \"정규 교육\" until\n// approved here: approval both marks the plan approved (its 핵심 활동 then\n// feed programPerceptionItems) AND enrolls every proposed student into the\n// program (sets their programId), matching \"학생들도 다 선택하면 ... 승인을\n// 받아야지만 정규 교육이 되도록\" exactly.\nfunction renderAdminLessonPlans(el){\n  const plans = (STATE.lessonPlans||[]).slice().sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));\n  const pending = plans.filter(p=>p.status==='pending');\n  const decided = plans.filter(p=>p.status!=='pending');\n  el.innerHTML = `\n    <div class=\"stat-row\">\n      <div class=\"stat-tile\"><div class=\"label\">승인 대기</div><div class=\"value\">${pending.length}건</div><div class=\"sub ${pending.length?'':'muted'}\">${pending.length?'검토가 필요합니다':'없음'}</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">승인됨</div><div class=\"value\">${plans.filter(p=>p.status==='approved').length}건</div><div class=\"sub muted\">누적</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">반려됨</div><div class=\"value\">${plans.filter(p=>p.status==='rejected').length}건</div><div class=\"sub muted\">누적</div></div>\n    </div>\n    <div class=\"panel\"><div class=\"panel-head\"><div><span class=\"eyebrow\">PENDING</span><h2>승인 대기 중인 지도안 (${pending.length}건)</h2></div></div>\n      ${pending.length===0 ? `<div class=\"empty-state\">현재 승인 대기 중인 지도안이 없습니다.</div>` : ''}\n    </div>\n    ${pending.map(lp=>renderLessonPlanCard(lp, {canDecide:true})).join('')}\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">HISTORY</span><h2>처리된 지도안 (${decided.length}건)</h2></div></div>\n      ${decided.length===0 ? `<div class=\"empty-state\">아직 처리된 지도안이 없습니다.</div>` : `\n      <div class=\"table-wrap\"><table>\n        <thead><tr><th>프로그램</th><th>차시</th><th>주제</th><th>작성 멘토</th><th>결과</th><th>처리일</th></tr></thead>\n        <tbody>${decided.map(lp=>{\n          const prog = program(lp.programId); const mentor = STATE.accounts.find(a=>a.id===lp.mentorId);\n          return `<tr><td>${prog?esc(prog.school+' · '+prog.name):'-'}</td><td>${lp.sessionNo}차시</td><td>${esc(lp.topic)}</td><td>${mentor?esc(mentor.name):'-'}</td>\n            <td>${lp.status==='approved'?'<span class=\"pill pill-good\">승인됨</span>':'<span class=\"pill pill-critical\">반려됨</span>'}</td><td>${lp.decidedAt?fmtDate(lp.decidedAt):'-'}</td></tr>`;\n        }).join('')}</tbody>\n      </table></div>`}\n    </div>`;\n  el.querySelectorAll('.approve-plan-btn').forEach(btn => btn.addEventListener('click', () => {\n    saveState(d => {\n      const lp = (d.lessonPlans||[]).find(x=>x.id===btn.dataset.id);\n      if (!lp) return;\n      lp.status = 'approved'; lp.decidedAt = new Date().toISOString(); lp.decidedBy = currentAccount().id;\n      (lp.studentIds||[]).forEach(sid => {\n        const acc = d.accounts.find(a=>a.id===sid);\n        if (acc) acc.programId = lp.programId;\n      });\n    });\n    toast('지도안을 승인했습니다. 제안된 학생들이 정규 등록되고, 설문 문항에도 반영됩니다.');\n  }));\n  el.querySelectorAll('.reject-plan-btn').forEach(btn => btn.addEventListener('click', () => {\n    saveState(d => {\n      const lp = (d.lessonPlans||[]).find(x=>x.id===btn.dataset.id);\n      if (lp) { lp.status = 'rejected'; lp.decidedAt = new Date().toISOString(); lp.decidedBy = currentAccount().id; }\n    });\n    toast('지도안을 반려했습니다. 담당 멘토가 수정하여 다시 제출할 수 있습니다.');\n  }));\n}\n\n// Catalog is authored once in build.js (seedState.courses) — admin can only\n// view it here, not edit it in-app, since the six programs were designed as\n// a fixed curriculum. What admin DOES manage is the applications students\n// submit against this catalog (see renderAdminApplications below).\nfunction renderAdminCourses(el){\n  const courses = STATE.courses || [];\n  const appCountFor = (courseId) => (STATE.applications||[]).filter(a=>a.courseId===courseId).length;\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">CATALOG</span><h2>후속 심화 STEM 교육 과정 (${courses.length}개)</h2></div><div class=\"hint\">학생 화면 '심화 교육 신청'에 그대로 노출됩니다</div></div>\n    </div>\n    ${courses.map(c => `\n      <div class=\"panel\">\n        <div class=\"panel-head\">\n          <div><span class=\"eyebrow\">${esc(c.field)} · ${esc(c.level)}</span><h2>${esc(c.title)}</h2></div>\n          <div class=\"hint\">${esc(c.duration)} · 누적 신청 ${appCountFor(c.id)}건</div>\n        </div>\n        <p class=\"analysis-text\" style=\"margin-bottom:10px;\">${esc(c.summary)}</p>\n        <div class=\"grid-2b\">\n          <div>\n            <div class=\"label\" style=\"font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;\">커리큘럼</div>\n            <ul class=\"evidence-list\" style=\"gap:8px;\">${c.curriculum.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>\n          </div>\n          <div>\n            <div class=\"label\" style=\"font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;\">이런 학생에게 추천해요</div>\n            <p class=\"analysis-text\">${esc(c.suitableFor)}</p>\n          </div>\n        </div>\n      </div>`).join('')}\n  `;\n}\n// Admin approval workflow: a student's application never auto-confirms\n// enrollment — it sits 'pending' until admin explicitly approves or\n// rejects it here. This is the single place status changes.\nfunction renderAdminApplications(el){\n  const apps = (STATE.applications||[]).slice().sort((a,b)=> new Date(b.appliedAt) - new Date(a.appliedAt));\n  const pending = apps.filter(a=>a.status==='pending');\n  const decided = apps.filter(a=>a.status!=='pending');\n  const courseTitle = (id) => { const c = (STATE.courses||[]).find(x=>x.id===id); return c ? c.title : '(삭제된 과정)'; };\n  const studentName = (id) => accountName(id);\n  el.innerHTML = `\n    <div class=\"stat-row\">\n      <div class=\"stat-tile\"><div class=\"label\">승인 대기</div><div class=\"value\">${pending.length}건</div><div class=\"sub ${pending.length?'':'muted'}\">${pending.length?'확인이 필요합니다':'없음'}</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">승인됨</div><div class=\"value\">${apps.filter(a=>a.status==='approved').length}건</div><div class=\"sub muted\">누적</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">반려됨</div><div class=\"value\">${apps.filter(a=>a.status==='rejected').length}건</div><div class=\"sub muted\">누적</div></div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">PENDING</span><h2>승인 대기 중인 신청 (${pending.length}건)</h2></div></div>\n      ${pending.length===0 ? `<div class=\"empty-state\">현재 승인 대기 중인 신청이 없습니다.</div>` : `\n      <div class=\"list-cards\">\n        ${pending.map(a=>`\n          <div class=\"entity-card\" style=\"cursor:default;\">\n            <div class=\"head\"><div class=\"avatar\">${icon('flask')}</div><div><div class=\"id\">${esc(studentName(a.studentId))} → ${esc(courseTitle(a.courseId))}</div><div class=\"grade\">신청일 ${fmtDate(a.appliedAt)}</div></div></div>\n            ${a.message ? `<p class=\"analysis-text\" style=\"margin:6px 0 10px;\">신청 사유: ${esc(a.message)}</p>` : ''}\n            <div class=\"form-actions\">\n              <button class=\"btn btn-primary approve-btn\" data-id=\"${a.id}\">승인</button>\n              <button class=\"btn btn-ghost reject-btn\" data-id=\"${a.id}\">반려</button>\n            </div>\n          </div>`).join('')}\n      </div>`}\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">HISTORY</span><h2>처리된 신청 (${decided.length}건)</h2></div></div>\n      ${decided.length===0 ? `<div class=\"empty-state\">아직 처리된 신청이 없습니다.</div>` : `\n      <div class=\"table-wrap\"><table>\n        <thead><tr><th>학생</th><th>교육 과정</th><th>신청일</th><th>처리 결과</th><th>처리일</th></tr></thead>\n        <tbody>\n          ${decided.map(a=>`<tr><td>${esc(studentName(a.studentId))}</td><td>${esc(courseTitle(a.courseId))}</td><td>${fmtDate(a.appliedAt)}</td>\n            <td>${a.status==='approved' ? '<span class=\"pill pill-good\">승인됨</span>' : '<span class=\"pill pill-critical\">반려됨</span>'}</td>\n            <td>${a.decidedAt ? fmtDate(a.decidedAt) : '-'}</td></tr>`).join('')}\n        </tbody>\n      </table></div>`}\n    </div>`;\n  el.querySelectorAll('.approve-btn').forEach(btn => btn.addEventListener('click', () => {\n    saveState(d => {\n      const app = d.applications.find(a=>a.id===btn.dataset.id);\n      if (app) { app.status = 'approved'; app.decidedAt = new Date().toISOString(); app.decidedBy = currentAccount().id; }\n    });\n    toast('신청을 승인했습니다.');\n  }));\n  el.querySelectorAll('.reject-btn').forEach(btn => btn.addEventListener('click', () => {\n    saveState(d => {\n      const app = d.applications.find(a=>a.id===btn.dataset.id);\n      if (app) { app.status = 'rejected'; app.decidedAt = new Date().toISOString(); app.decidedBy = currentAccount().id; }\n    });\n    toast('신청을 반려했습니다.');\n  }));\n}\n\nfunction renderAdminSafety(el){\n  const entries = Object.keys(STATE.chats).map(key => {\n    const c = STATE.chats[key];\n    const parts = c.participants || key.split('::');\n    return { key, chat:c, a:parts[0], b:parts[1] };\n  }).filter(e => e.chat.status !== 'none');\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">SAFETY</span><h2>전체 1:1 대화 모니터링</h2></div><div class=\"hint\">진행 중이거나 대기 중인 대화 ${entries.length}건</div></div>\n      ${entries.length===0 ? `<div class=\"empty-state\">현재 진행 중이거나 대기 중인 대화가 없습니다.</div>` : `\n      <div class=\"list-cards\">\n        ${entries.map(e=>{\n          const nameA = accountName(e.a), nameB = accountName(e.b);\n          const statusLabel = e.chat.status==='pending' ? '요청 대기' : '대화 중';\n          const active = currentAdminSafetyChat === e.key;\n          return `<div class=\"entity-card safety-card\" data-key=\"${e.key}\" style=\"cursor:pointer;${active?'outline:2px solid var(--accent);':''}\">\n            <div class=\"head\"><div class=\"avatar\">${icon('chat')}</div><div><div class=\"id\">${esc(nameA)} · ${esc(nameB)}</div><div class=\"grade\">${statusLabel} · 메시지 ${e.chat.messages.length}건</div></div></div>\n          </div>`;\n        }).join('')}\n      </div>`}\n    </div>\n    ${currentAdminSafetyChat ? `<div class=\"panel\"><div class=\"panel-head\"><h2>대화 내용 (읽기 전용)</h2></div><div id=\"safety-chat-slot\"></div></div>` : ''}\n  `;\n  el.querySelectorAll('.safety-card').forEach(card => card.addEventListener('click', () => {\n    currentAdminSafetyChat = (currentAdminSafetyChat === card.dataset.key) ? null : card.dataset.key;\n    render();\n  }));\n  if (currentAdminSafetyChat){\n    const e = entries.find(x=>x.key===currentAdminSafetyChat);\n    const slot = document.getElementById('safety-chat-slot');\n    if (e && slot) renderChatPanel(slot, e.a, e.b, { readOnly:true });\n  }\n}\n\n/* ================= shared: student detail panel ================= */\n// One detailed, evidence-cited Growth Report block for a single program\n// participation — used once per historical program so a student who has\n// been through the program more than once gets a report for each time.\nfunction renderGrowthReportBlock(prog, rep, ordinalNum, totalCount, isLatest){\n  const progLabel = prog ? `${esc(prog.school)} · ${esc(prog.name)}` : '프로그램 정보 없음';\n  const showOrdinal = totalCount > 1;\n  const ordinalTitle = showOrdinal ? `${ordinalNum}번째 성장 보고서` : '성장 보고서';\n  const eyebrow = showOrdinal ? `GROWTH REPORT · ${ordinalNum} / ${totalCount}` : 'GROWTH REPORT';\n  if (!rep.ready){\n    return `<div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">${eyebrow}</span><h2>${ordinalTitle}${isLatest && showOrdinal ? ' <span class=\\\"badge-latest\\\">최신</span>' : ''}</h2></div><div class=\"hint\">${progLabel}</div></div>\n      <div class=\"empty-state\">${esc(rep.reason)} 데이터가 모이면 이 화면에 실제 Growth Report가 자동으로 계산되어 표시됩니다.</div>\n    </div>`;\n  }\n  return `<div class=\"panel\">\n    <div class=\"panel-head\"><div><span class=\"eyebrow\">${eyebrow}</span><h2>${ordinalTitle}${isLatest && showOrdinal ? ' <span class=\\\"badge-latest\\\">최신</span>' : ''}</h2></div><div class=\"hint\">${esc(progLabel)} · 탐구 저널 ${rep.sessionCount}건 기반</div></div>\n    ${barChart(COMP.map(c=>({label:c.label, pre:rep.comp[c.key].before, post:rep.comp[c.key].after, color:c.color})))}\n    ${legendHtml()}\n    <div class=\"insight-box\" style=\"margin-top:14px;\">${esc(rep.insight)}</div>\n    <div class=\"analysis-list\">\n      ${COMP.map(c=>{\n        const cc = rep.comp[c.key];\n        const hasEvidence = cc.surveyItems.length || cc.journalEvidence.length;\n        return `\n        <div class=\"analysis-item\">\n          <div class=\"analysis-head\"><span class=\"dot\" style=\"background:var(${c.color})\"></span><b>${c.label}</b><span class=\"analysis-score\">${cc.before} → ${cc.after} (▲${cc.delta})</span></div>\n          <p class=\"analysis-text\">${esc(cc.narrative)}</p>\n          ${hasEvidence ? `\n          <details class=\"evidence-details\">\n            <summary>근거 데이터 보기</summary>\n            <ul class=\"evidence-list\">\n              ${cc.surveyItems.map(it=>`<li>설문: \"${esc(it.text)}\" ${it.pre ?? '-'}점 → ${it.post ?? '-'}점</li>`).join('')}\n              ${cc.journalEvidence.map(e=>`<li>${e.sessionNo}차시 저널: \"${esc(e.text)}\" — 감지된 표현: ${e.matched.map(k=>esc(k)).join(', ')}</li>`).join('')}\n            </ul>\n          </details>` : ''}\n        </div>`;\n      }).join('')}\n    </div>\n    <div class=\"formula-box\">산출 방식: 교육 후 점수 = 사후 인식 설문 50% + AI 자동 수집 행동 데이터 50% ${rep.usedBehavior ? '(탐구 저널 분석 + 플랫폼 사용 로그, 사람이 채점하지 않음)' : '(아직 활동 기록이 없어 사후 인식 설문만 반영됨)'}</div>\n  </div>`;\n}\n// A compact longitudinal view across every program the student has a ready\n// report for, so admin/mentor/student can see accumulated growth over\n// repeated participations, not just the latest snapshot.\nfunction renderGrowthTrendBlock(readyReports){\n  const first = readyReports[0], last = readyReports[readyReports.length-1];\n  return `<div class=\"panel\">\n    <div class=\"panel-head\"><div><span class=\"eyebrow\">TREND</span><h2>프로그램별 성장 추이</h2></div><div class=\"hint\">참여 ${readyReports.length}개 프로그램의 교육 후 점수 변화</div></div>\n    <div class=\"table-wrap\"><table>\n      <thead><tr><th>프로그램</th>${COMP.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>\n      <tbody>\n        ${readyReports.map(r=>`<tr><td>${esc(r.program.school)} · ${esc(r.program.name)}</td>${COMP.map(c=>`<td>${r.rep.comp[c.key].after}</td>`).join('')}</tr>`).join('')}\n      </tbody>\n    </table></div>\n    <div class=\"formula-box\">첫 참여 대비 최신 프로그램: ${COMP.map(c=>{\n      const d = last.rep.comp[c.key].after - first.rep.comp[c.key].after;\n      return `${c.label} ${d>=0?'▲':'▼'}${Math.abs(d)}`;\n    }).join(' · ')}</div>\n  </div>`;\n}\n\nfunction renderStudentDetailPanel(el, s, opts){\n  const pid = currentProgramId(s);\n  const prog = program(pid);\n  // Mentor is derived from the student's CURRENT program, not a fixed\n  // pairing — the same student can have a different mentor next program.\n  const mentor = prog && prog.mentorId ? STATE.accounts.find(m=>m.id===prog.mentorId) : null;\n  const timeline = studentTimeline(s.id);\n  const history = studentPrograms(s.id); // every program w/ any data, oldest first\n\n  // One report per historical program; also surface the currently assigned\n  // program even if it has no data yet, so it shows a \"not ready\" card.\n  const reportPrograms = (pid && !history.some(p=>p.id===pid) && prog) ? [...history, prog] : history;\n  const reports = reportPrograms.map(p => ({ program:p, rep: growthReport(s.id, p.id) }));\n  const readyReports = reports.filter(r => r.rep.ready);\n  const latest = readyReports.length ? readyReports[readyReports.length-1] : (reports.length ? reports[reports.length-1] : null);\n\n  let html = `\n    <div class=\"panel\">\n      <div class=\"panel-head\">\n        <div><span class=\"eyebrow\">STUDENT</span><h2>${esc(s.name)} · ${esc(s.grade||'')}</h2></div>\n        <div class=\"hint\">담당 멘토: ${mentor ? esc(mentor.name) : '미배정'}</div>\n      </div>\n      <div class=\"chip-row\">\n        ${s.school ? `<span class=\"tag\">${esc(s.school)}</span>` : ''}\n        ${prog ? `<span class=\"tag\">${esc(prog.name)}</span>` : `<span class=\"tag\" style=\"color:var(--critical)\">프로그램 미배정</span>`}\n        ${(s.interests||[]).map(i=>`<span class=\"tag\">${esc(i)}</span>`).join('')}\n      </div>\n    </div>\n  `;\n\n  if (reports.length === 0){\n    html += `<div class=\"panel\"><div class=\"panel-head\"><div><span class=\"eyebrow\">GROWTH REPORT</span><h2>교육 전 · 후 비교</h2></div></div><div class=\"empty-state\">배정된 프로그램(학교·회차)이 없습니다. 관리자가 먼저 프로그램에 등록해야 합니다.</div></div>`;\n  } else {\n    reports.forEach((r, idx) => {\n      html += renderGrowthReportBlock(r.program, r.rep, idx+1, reports.length, idx===reports.length-1);\n    });\n  }\n  if (readyReports.length >= 2) html += renderGrowthTrendBlock(readyReports);\n\n  const rep = latest ? latest.rep : { ready:false };\n  html += `\n    <div class=\"grid-2b\">\n      <div class=\"panel\">\n        <div class=\"panel-head\"><h2>Growth Profile</h2><div class=\"hint\">${latest && reports.length>1 ? '최신 참여 프로그램 기준' : ''}</div></div>\n        ${rep.ready ? COMP.map(c=>`\n          <div class=\"meter-row\">\n            <div class=\"meter-label\">${c.label}</div>\n            <div class=\"meter-track\"><div class=\"meter-fill\" style=\"width:${rep.comp[c.key].after}%; background:var(${c.color})\"></div></div>\n            <div class=\"meter-value\">${rep.comp[c.key].after}</div>\n            <div class=\"meter-delta\">▲${rep.comp[c.key].delta}</div>\n          </div>`).join('') : `<div class=\"empty-state\">아직 표시할 성장 데이터가 없습니다.</div>`}\n      </div>\n      <div class=\"panel\">\n        <div class=\"panel-head\"><h2>활동 이력</h2><div class=\"hint\">참여 프로그램 ${history.length}개</div></div>\n        ${timeline.length===0 ? `<div class=\"empty-state\">기록된 활동이 없습니다.</div>` : `\n        <div class=\"timeline\">\n          ${timeline.map(t=>`<div class=\"tl-item\"><div class=\"tl-dot-col\"><div class=\"tl-dot\"></div></div>\n            <div><div class=\"tl-date\">${fmtDate(t.ts)}</div><div class=\"tl-title\">${esc(t.title)}</div><div class=\"tl-desc\">${esc(t.desc)}</div></div></div>`).join('')}\n        </div>`}\n      </div>\n    </div>\n    ${rep.ready ? `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">NEXT STEP</span><h2>추천 경험</h2></div></div>\n      <div class=\"step-cards\">\n        <div class=\"step-card\"><div class=\"step-num\">STEP 1</div><div class=\"step-title\">${NEXT_STEP_BY_AREA[rep.low].title}</div><div class=\"step-desc\">${NEXT_STEP_BY_AREA[rep.low].desc}</div></div>\n        <div class=\"step-card\"><div class=\"step-num\">STEP 2</div><div class=\"step-title\">청년 강사 멘토링</div><div class=\"step-desc\">${esc((s.interests&&s.interests[0])||'관심 분야')} 관련 대화를 멘토와 이어갑니다</div></div>\n        <div class=\"step-card\"><div class=\"step-num\">STEP 3</div><div class=\"step-title\">${esc((s.interests&&s.interests[0])||'관심 분야')} 연계 프로그램</div><div class=\"step-desc\">관심 분야와 직접 연결된 후속 프로그램 추천</div></div>\n      </div>\n    </div>` : ''}\n  `;\n  // AI 자동 수집 행동 데이터 — read-only for everyone (admin, mentor, student\n  // themselves). Nobody rates this; it's computed from the student's own\n  // 탐구 저널 entries and real platform usage (see behaviorScore above).\n  if (pid){\n    const jlogs = studentActivityLogs(s.id, pid);\n    const beh = behaviorScore(s.id, pid);\n    const days = loginDayCount(s.id), msgs = sentMessageCount(s.id), initiated = initiatedChatCount(s.id);\n    html += `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">AI DETECTED</span><h2>AI 자동 수집 행동 데이터</h2></div><div class=\"hint\">탐구 저널 ${jlogs.length}건 · 사람이 채점하지 않음</div></div>\n      ${!beh ? `<div class=\"empty-state\">아직 탐구 저널 기록이 없어 행동 데이터를 산출할 수 없습니다. 학생이 '탐구 저널'에 활동을 기록하면 자동으로 계산됩니다.</div>` : `\n      ${COMP.map(c=>`\n        <div class=\"meter-row\">\n          <div class=\"meter-label\">${c.label}</div>\n          <div class=\"meter-track\"><div class=\"meter-fill\" style=\"width:${beh[c.key]}%; background:var(${c.color})\"></div></div>\n          <div class=\"meter-value\">${beh[c.key]}</div>\n        </div>`).join('')}\n      <div class=\"formula-box\">근거 데이터: 탐구 저널 키워드 분석(전 역량) + 로그인 ${days}일 · 보낸 메시지 ${msgs}건 · 직접 개설한 대화 ${initiated}건 (협업·자기주도성에 반영)</div>`}\n    </div>`;\n  }\n  // 멘토 서포팅 노트 — qualitative only, never averaged into the score above.\n  if (opts.canAddMentorNote || pid){\n    const notes = pid ? studentMentorNotes(s.id, pid) : [];\n    const nextSession = notes.length ? Math.max(...notes.map(n=>n.sessionNo||1)) + 1 : 1;\n    const notesList = notes.length ? `<div class=\"table-wrap\" style=\"margin-top:14px;\"><table>\n      <thead><tr><th>차시</th><th>날짜</th><th>작성 멘토</th><th>내용</th></tr></thead>\n      <tbody>${notes.slice().reverse().map(n=>`<tr><td>${n.sessionNo}차시</td><td>${fmtDate(n.ts)}</td><td>${esc(accountName(n.mentorId))}</td><td>${esc(n.text)}</td></tr>`).join('')}</tbody>\n    </table></div>` : `<div class=\"empty-state\">${opts.canAddMentorNote ? '아직 남긴 서포팅 노트가 없습니다.' : '아직 멘토가 남긴 서포팅 노트가 없습니다.'}</div>`;\n    html += `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">SUPPORTING</span><h2>멘토 서포팅 노트</h2></div><div class=\"hint\">참고용 정성 기록 · 점수에는 반영되지 않음</div></div>\n      ${!pid ? `<div class=\"empty-state\">이 학생은 아직 프로그램(학교·회차)에 배정되지 않았습니다.</div>` :\n        opts.canAddMentorNote ? `\n      <form id=\"mentor-note-form\">\n        <div class=\"field\" style=\"max-width:160px;\"><label>몇 차시 수업인가요?</label><input type=\"number\" min=\"1\" id=\"note-session\" value=\"${nextSession}\" /></div>\n        <div class=\"field\"><label>관찰 내용</label><textarea id=\"note-text\" placeholder=\"이번 차시에 눈에 띈 점을 자유롭게 적어주세요 (예: 오늘 유독 적극적으로 질문했어요)\"></textarea></div>\n        <button type=\"submit\" class=\"btn btn-primary\">서포팅 노트 저장</button>\n      </form>\n      ${notesList}` : notesList}\n    </div>`;\n  }\n  if (opts.canChat || opts.canViewChatReadOnly){\n    const mentorForChat = mentor;\n    html += `<div class=\"panel\"><div class=\"panel-head\"><div><span class=\"eyebrow\">${opts.canViewChatReadOnly?'SAFETY VIEW':'1:1'}</span><h2>${esc(s.name)} 학생 ${mentorForChat? '· '+esc(mentorForChat.name)+' 멘토':''} 대화${opts.canViewChatReadOnly?' (안전 모니터링, 읽기 전용)':''}</h2></div></div><div id=\"chat-slot\"></div></div>`;\n  }\n  el.innerHTML = html;\n\n  if (opts.canAddMentorNote && pid){\n    document.getElementById('mentor-note-form').addEventListener('submit', (e) => {\n      e.preventDefault();\n      const text = document.getElementById('note-text').value.trim();\n      const sessionNo = Number(document.getElementById('note-session').value) || 1;\n      if (!text) { toast('내용을 입력해주세요.'); return; }\n      saveState(d => {\n        if (!d.mentorNotes[s.id]) d.mentorNotes[s.id] = [];\n        d.mentorNotes[s.id].push({ ts: new Date().toISOString(), programId: pid, sessionNo, mentorId: opts.viewerAccount.id, text });\n      });\n      toast(`${sessionNo}차시 서포팅 노트가 저장되었습니다.`);\n    });\n  }\n  if (opts.canChat && mentor){\n    renderChatPanel(document.getElementById('chat-slot'), s.id, mentor.id, { viewerId: opts.viewerAccount.id, readOnly:false });\n  } else if (opts.canViewChatReadOnly && mentor){\n    renderChatPanel(document.getElementById('chat-slot'), s.id, mentor.id, { readOnly:true });\n  } else if ((opts.canChat || opts.canViewChatReadOnly) && !mentor) {\n    const slot = document.getElementById('chat-slot');\n    if (slot) slot.innerHTML = `<div class=\"empty-state\">멘토가 아직 배정되지 않아 대화가 없습니다.</div>`;\n  }\n}\n\n/* ================= chat =================\n   Generalized to an arbitrary pair of accounts so the same mechanism covers\n   student↔mentor 1:1 chat, student↔student peer chat, and an admin\n   read-only safety view over any thread. Threads are keyed by the two\n   participant ids (sorted), never by \"studentId\" alone. */\nfunction renderChatPanel(el, participantA, participantB, opts){\n  opts = opts || {};\n  const readOnly = !!opts.readOnly;\n  const viewerId = opts.viewerId;\n  const key = chatKey(participantA, participantB);\n  const chat = STATE.chats[key] || { status:'none', requestedBy:null, participants:[participantA,participantB], messages:[] };\n\n  if (readOnly){\n    const nameA = accountName(participantA), nameB = accountName(participantB);\n    if (chat.status === 'none'){\n      el.innerHTML = `<div class=\"empty-state\">${esc(nameA)}님과 ${esc(nameB)}님은 아직 대화를 시작하지 않았습니다.</div>`;\n      return;\n    }\n    if (chat.status === 'pending'){\n      el.innerHTML = `<div class=\"empty-state\">대화 요청이 대기 중입니다 (${esc(accountName(chat.requestedBy))}님이 요청함, 아직 수락되지 않음).</div>`;\n      return;\n    }\n    el.innerHTML = `<div class=\"chat-wrap\">\n      <div class=\"chat-log\">\n        ${chat.messages.length===0 ? `<div class=\"chat-empty\">아직 주고받은 메시지가 없습니다.</div>` :\n          chat.messages.map(m=>`<div class=\"chat-msg them\" style=\"margin-left:0;max-width:100%;\"><b>${esc(accountName(m.sender))}</b> · ${esc(m.text)}<div class=\"meta\">${fmtDateTime(m.ts)}</div></div>`).join('')}\n      </div>\n    </div>`;\n    return;\n  }\n\n  const otherId = viewerId === participantA ? participantB : participantA;\n  const otherName = accountName(otherId);\n\n  if (chat.status === 'none'){\n    el.innerHTML = `<div class=\"chat-request-box\"><p>${esc(otherName)}님과 아직 대화를 시작하지 않았습니다.</p>\n      <button class=\"btn btn-primary\" id=\"chat-request-btn\">1:1 대화 요청 보내기</button></div>`;\n    document.getElementById('chat-request-btn').addEventListener('click', () => {\n      saveState(d => { d.chats[key] = { status:'pending', requestedBy: viewerId, participants:[participantA,participantB], messages: (d.chats[key]&&d.chats[key].messages)||[] }; });\n      toast('대화 요청을 보냈습니다.');\n    });\n    return;\n  }\n  if (chat.status === 'pending'){\n    if (chat.requestedBy === viewerId){\n      el.innerHTML = `<div class=\"chat-request-box\"><p>${esc(otherName)}님에게 대화 요청을 보냈습니다. 수락을 기다리는 중입니다.</p>\n        <button class=\"btn btn-ghost\" id=\"chat-cancel-btn\">요청 취소</button></div>`;\n      document.getElementById('chat-cancel-btn').addEventListener('click', () => {\n        saveState(d => { d.chats[key] = { status:'none', requestedBy:null, participants:[participantA,participantB], messages: chat.messages }; });\n      });\n    } else {\n      el.innerHTML = `<div class=\"chat-request-box\"><p>${esc(otherName)}님이 1:1 대화를 요청했습니다.</p>\n        <div class=\"pending-row\"><button class=\"btn btn-primary\" id=\"chat-accept-btn\">수락</button><button class=\"btn btn-ghost\" id=\"chat-decline-btn\">거절</button></div></div>`;\n      document.getElementById('chat-accept-btn').addEventListener('click', () => {\n        saveState(d => { d.chats[key].status = 'active'; });\n        toast('대화가 시작되었습니다.');\n      });\n      document.getElementById('chat-decline-btn').addEventListener('click', () => {\n        saveState(d => { d.chats[key] = { status:'none', requestedBy:null, participants:[participantA,participantB], messages: chat.messages }; });\n      });\n    }\n    return;\n  }\n  // active\n  el.innerHTML = `\n    <div class=\"chat-wrap\">\n      <div class=\"chat-log\" id=\"chat-log\">\n        ${chat.messages.length===0 ? `<div class=\"chat-empty\">${esc(otherName)}님과의 대화가 시작되었습니다. 첫 메시지를 보내보세요.</div>` :\n          chat.messages.map(m => `<div class=\"chat-msg ${m.sender===viewerId?'me':'them'}\">${esc(m.text)}<div class=\"meta\">${fmtDateTime(m.ts)}</div></div>`).join('')}\n      </div>\n      <div class=\"chat-compose\">\n        <input id=\"chat-input\" placeholder=\"메시지를 입력하세요\" />\n        <button class=\"btn btn-primary\" id=\"chat-send-btn\">보내기</button>\n      </div>\n    </div>`;\n  const logEl = document.getElementById('chat-log');\n  logEl.scrollTop = logEl.scrollHeight;\n  const send = () => {\n    const inp = document.getElementById('chat-input');\n    const text = inp.value.trim();\n    if (!text) return;\n    saveState(d => {\n      if (!d.chats[key]) d.chats[key] = { status:'active', requestedBy:null, participants:[participantA,participantB], messages:[] };\n      d.chats[key].messages.push({ sender: viewerId, text, ts: new Date().toISOString() });\n    });\n  };\n  document.getElementById('chat-send-btn').addEventListener('click', send);\n  document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key==='Enter') send(); });\n}\nfunction fmtDateTime(ts){\n  if (!ts) return '';\n  const d = new Date(ts);\n  const h = String(d.getHours()).padStart(2,'0'); const m = String(d.getMinutes()).padStart(2,'0');\n  return `${fmtDate(ts)} ${h}:${m}`;\n}\n\n/* ================= MENTOR ================= */\n// Chat threads this mentor is part of with students who are NOT currently\n// assigned to them — e.g. a student they mentored in an earlier program\n// (now reassigned to someone else), or a student who cold-requested a chat\n// with this mentor without ever taking their class. Mentors are always\n// reachable, not just by their current roster, so these need their own list.\nfunction otherChatThreads(mentorId, excludeStudentIds){\n  const out = [];\n  Object.keys(STATE.chats).forEach(key => {\n    const c = STATE.chats[key];\n    if (!c || c.status === 'none') return;\n    const parts = c.participants || key.split('::');\n    if (!parts.includes(mentorId)) return;\n    const studentId = parts.find(p => p !== mentorId);\n    const sAcc = STATE.accounts.find(a => a.id === studentId);\n    if (!sAcc || sAcc.role !== 'student') return;\n    if (excludeStudentIds.has(studentId)) return;\n    out.push({ studentId, chat: c });\n  });\n  return out;\n}\nfunction renderMentorView(el, acc){\n  if (currentView === 'lessonplan-author') return renderMentorLessonPlans(el, acc);\n  if (currentMentorStudent) return renderMentorStudentDetail(el, acc);\n  if (currentMentorOtherChat) return renderMentorOtherChatDetail(el, acc);\n  const myStudents = STATE.accounts.filter(a => a.role==='student' && studentMentorId(a.id) === acc.id);\n  const myIds = new Set(myStudents.map(s=>s.id));\n  const others = otherChatThreads(acc.id, myIds);\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">MY STUDENTS</span><h2>담당 학생 (${myStudents.length}명)</h2></div></div>\n      ${myStudents.length===0 ? `<div class=\"empty-state\">아직 배정된 학생이 없습니다. 관리자에게 배정을 요청하세요.</div>` : `\n      <div class=\"list-cards\">\n        ${myStudents.map(s=>{\n          const chat = getChat(s.id, acc.id);\n          const pendingForMe = chat.status==='pending' && chat.requestedBy !== acc.id;\n          const rep = growthReport(s.id, currentProgramId(s));\n          return `<div class=\"entity-card student-card\" data-id=\"${s.id}\">\n            <div class=\"head\"><div class=\"avatar\">${esc(s.name[0])}</div><div><div class=\"id\">${esc(s.name)}</div><div class=\"grade\">${esc(s.grade||'')}</div></div>\n              ${pendingForMe ? `<span class=\"pill pill-warn\" style=\"margin-left:auto;\">대화 요청</span>` : ''}\n            </div>\n            <div class=\"chip-row\">${(s.interests||[]).map(i=>`<span class=\"tag\">${esc(i)}</span>`).join('')}</div>\n            <div class=\"chip-row\">${rep.ready ? `<span class=\"pill pill-good\">리포트 생성됨</span>` : `<span class=\"pill pill-muted\">데이터 수집 중</span>`}</div>\n          </div>`;\n        }).join('')}\n      </div>`}\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">OTHER CHATS</span><h2>담당 학생 외의 대화 (${others.length}건)</h2></div><div class=\"hint\">내 수업을 듣지 않은 학생도 대화를 요청할 수 있습니다</div></div>\n      ${others.length===0 ? `<div class=\"empty-state\">담당 학생이 아닌 학생과의 대화 요청/대화가 아직 없습니다.</div>` : `\n      <div class=\"list-cards\">\n        ${others.map(o=>{\n          const s = STATE.accounts.find(a=>a.id===o.studentId);\n          const statusPill = o.chat.status==='active' ? '<span class=\"pill pill-good\">대화 중</span>'\n            : (o.chat.requestedBy===acc.id ? '<span class=\"pill pill-muted\">요청 보냄</span>' : '<span class=\"pill pill-warn\">대화 요청 옴</span>');\n          return `<div class=\"entity-card other-chat-card\" data-id=\"${o.studentId}\">\n            <div class=\"head\"><div class=\"avatar\">${esc(s.name[0])}</div><div><div class=\"id\">${esc(s.name)}</div><div class=\"grade\">${esc(s.grade||'')}${s.school?' · '+esc(s.school):''}</div></div>${statusPill}</div>\n          </div>`;\n        }).join('')}\n      </div>`}\n    </div>`;\n  el.querySelectorAll('.student-card').forEach(card => card.addEventListener('click', () => { currentMentorStudent = card.dataset.id; render(); }));\n  el.querySelectorAll('.other-chat-card').forEach(card => card.addEventListener('click', () => { currentMentorOtherChat = card.dataset.id; render(); }));\n}\nfunction renderMentorOtherChatDetail(el, acc){\n  const s = STATE.accounts.find(a=>a.id===currentMentorOtherChat);\n  if (!s) { currentMentorOtherChat = null; return renderMentorView(el, acc); }\n  el.innerHTML = `<button class=\"btn btn-ghost\" id=\"back-btn\" style=\"margin-bottom:14px;\">${icon('back')} 목록으로</button>\n    <div class=\"panel\"><div class=\"panel-head\"><h2>${esc(s.name)}님과의 대화</h2></div><div style=\"font-size:11.5px;color:var(--text-muted);margin-bottom:10px;\">담당 학생이 아니므로 성장 데이터는 표시되지 않습니다.</div><div id=\"chat-slot\"></div></div>`;\n  document.getElementById('back-btn').addEventListener('click', () => { currentMentorOtherChat = null; render(); });\n  renderChatPanel(document.getElementById('chat-slot'), s.id, acc.id, { viewerId: acc.id, readOnly:false });\n}\nfunction renderMentorStudentDetail(el, acc){\n  const s = STATE.accounts.find(a=>a.id===currentMentorStudent);\n  if (!s) { currentMentorStudent = null; return renderMentorView(el, acc); }\n  el.innerHTML = `<button class=\"btn btn-ghost\" id=\"back-btn\" style=\"margin-bottom:14px;\">${icon('back')} 목록으로</button><div id=\"detail-slot\"></div>`;\n  document.getElementById('back-btn').addEventListener('click', () => { currentMentorStudent = null; render(); });\n  renderStudentDetailPanel(document.getElementById('detail-slot'), s, { canAddMentorNote:true, canChat:true, viewerAccount: acc });\n}\n// Mentor-authored real lesson-plan submission. This is the only place a\n// program's actual class content (주제·소요시간·대상·학습목표·준비물·\n// 도입-전개-정리) and its proposed student roster get created — never the\n// admin. Submitting only queues it as 'pending'; nothing here enrolls a\n// student or changes survey questions until admin approves it in\n// '지도안 승인' (see renderAdminLessonPlans).\n// ---- lesson-plan draft: 도입/전개/정리 each hold an editable list of\n// activity rows (시간·학습내용·교사활동·학생활동·준비물·유의점), matching\n// a real 지도안 표 exactly. Rows are plain in-memory draft state (see\n// mentorPlanDraft above) rebuilt into HTML on every add/remove so the\n// stage's auto-computed duration (\"도입(15′)\") always reflects what's\n// actually been timed.\nfunction emptyPlanRow(start, end){\n  return { start: start||0, end: end||0, label:'', teacher:'', student:'', materials:'', note:'' };\n}\nfunction defaultPlanDraft(){\n  return { '도입': [emptyPlanRow(0,5)], '전개': [emptyPlanRow(5,20)], '정리': [emptyPlanRow(20,25)] };\n}\nfunction renderPlanStageRows(stage){\n  return mentorPlanDraft[stage].map((r, i) => `\n    <div class=\"plan-row\" data-stage=\"${stage}\" data-idx=\"${i}\" style=\"border:1px solid var(--border-strong);border-radius:10px;padding:12px;margin-bottom:10px;\">\n      <div class=\"grid-2b\" style=\"gap:10px;\">\n        <div class=\"field\" style=\"margin-bottom:8px;\"><label>시작(분)</label><input type=\"number\" min=\"0\" class=\"plan-row-start\" value=\"${r.start}\" /></div>\n        <div class=\"field\" style=\"margin-bottom:8px;\"><label>종료(분)</label><input type=\"number\" min=\"0\" class=\"plan-row-end\" value=\"${r.end}\" /></div>\n      </div>\n      <div class=\"field\" style=\"margin-bottom:8px;\"><label>학습내용 (활동명)</label><input class=\"plan-row-label\" value=\"${esc(r.label)}\" placeholder=\"예: 인사\" /></div>\n      <div class=\"grid-2b\" style=\"gap:10px;\">\n        <div class=\"field\" style=\"margin-bottom:8px;\"><label>교사 활동</label><textarea class=\"plan-row-teacher\" style=\"min-height:70px;\">${esc(r.teacher)}</textarea></div>\n        <div class=\"field\" style=\"margin-bottom:8px;\"><label>학생 활동</label><textarea class=\"plan-row-student\" style=\"min-height:70px;\">${esc(r.student)}</textarea></div>\n      </div>\n      <div class=\"grid-2b\" style=\"gap:10px;\">\n        <div class=\"field\" style=\"margin-bottom:0;\"><label>준비물 (선택)</label><input class=\"plan-row-materials\" value=\"${esc(r.materials)}\" placeholder=\"예: ZOOM 링크, PPT\" /></div>\n        <div class=\"field\" style=\"margin-bottom:0;\"><label>지도상 유의점 (선택)</label><input class=\"plan-row-note\" value=\"${esc(r.note)}\" /></div>\n      </div>\n      ${mentorPlanDraft[stage].length > 1 ? `<button type=\"button\" class=\"btn btn-ghost plan-row-remove\" style=\"margin-top:8px;font-size:12px;\">이 활동 삭제</button>` : ''}\n    </div>`).join('');\n}\nfunction renderPlanStageBlock(stage){\n  return `<div class=\"plan-stage-block\" data-stage=\"${stage}\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;\">\n      <h3 style=\"font-size:14px;margin:0;\">${stage} <span class=\"plan-stage-dur\" style=\"color:var(--text-muted);font-weight:400;font-size:12px;\">(자동 계산 ${stageDurationMin(mentorPlanDraft[stage])}분)</span></h3>\n      <button type=\"button\" class=\"btn btn-ghost plan-row-add\" data-stage=\"${stage}\" style=\"font-size:12px;\">+ 활동 추가</button>\n    </div>\n    <div class=\"plan-stage-rows\">${renderPlanStageRows(stage)}</div>\n  </div>`;\n}\n// Re-reads every row currently in the DOM back into mentorPlanDraft, so\n// edits already typed survive an add/remove (which re-renders one stage's\n// HTML from the draft).\nfunction syncPlanDraftFromDom(el){\n  ['도입','전개','정리'].forEach(stage => {\n    const rows = [];\n    el.querySelectorAll(`.plan-row[data-stage=\"${stage}\"]`).forEach(rowEl => {\n      rows.push({\n        start: Number(rowEl.querySelector('.plan-row-start').value) || 0,\n        end: Number(rowEl.querySelector('.plan-row-end').value) || 0,\n        label: rowEl.querySelector('.plan-row-label').value.trim(),\n        teacher: rowEl.querySelector('.plan-row-teacher').value.trim(),\n        student: rowEl.querySelector('.plan-row-student').value.trim(),\n        materials: rowEl.querySelector('.plan-row-materials').value.trim(),\n        note: rowEl.querySelector('.plan-row-note').value.trim(),\n      });\n    });\n    mentorPlanDraft[stage] = rows;\n  });\n}\nfunction recomputeAllDurations(el){\n  let total = 0;\n  el.querySelectorAll('.plan-stage-block').forEach(block => {\n    const rowEls = block.querySelectorAll('.plan-row');\n    const starts = [...rowEls].map(r => Number(r.querySelector('.plan-row-start').value)||0);\n    const ends = [...rowEls].map(r => Number(r.querySelector('.plan-row-end').value)||0);\n    const dur = rowEls.length ? Math.max(0, Math.max(...ends) - Math.min(...starts)) : 0;\n    const durEl = block.querySelector('.plan-stage-dur');\n    if (durEl) durEl.textContent = `(자동 계산 ${dur}분)`;\n    total += dur;\n  });\n  const totalEl = el.querySelector('#plan-total-duration');\n  if (totalEl) totalEl.textContent = total + '분';\n}\nfunction rerenderStageBlock(el, stage){\n  const block = el.querySelector(`.plan-stage-block[data-stage=\"${stage}\"]`);\n  const temp = document.createElement('div');\n  temp.innerHTML = renderPlanStageBlock(stage);\n  const newBlock = temp.firstElementChild;\n  block.replaceWith(newBlock);\n  bindStageBlockEvents(newBlock, el);\n}\nfunction bindStageBlockEvents(block, el){\n  block.querySelectorAll('.plan-row-start, .plan-row-end').forEach(inp => inp.addEventListener('input', () => recomputeAllDurations(el)));\n  block.querySelectorAll('.plan-row-add').forEach(btn => btn.addEventListener('click', () => {\n    syncPlanDraftFromDom(el);\n    const stage = btn.dataset.stage;\n    const rows = mentorPlanDraft[stage];\n    const last = rows[rows.length-1];\n    mentorPlanDraft[stage].push(emptyPlanRow(last ? last.end : 0, last ? last.end + 5 : 5));\n    rerenderStageBlock(el, stage);\n    recomputeAllDurations(el);\n  }));\n  block.querySelectorAll('.plan-row-remove').forEach(btn => btn.addEventListener('click', () => {\n    syncPlanDraftFromDom(el);\n    const rowEl = btn.closest('.plan-row');\n    const stage = rowEl.dataset.stage;\n    const idx = Number(rowEl.dataset.idx);\n    mentorPlanDraft[stage].splice(idx, 1);\n    if (!mentorPlanDraft[stage].length) mentorPlanDraft[stage].push(emptyPlanRow(0,5));\n    rerenderStageBlock(el, stage);\n    recomputeAllDurations(el);\n  }));\n}\nfunction renderMentorLessonPlans(el, acc){\n  const myPrograms = STATE.programs.filter(p => p.mentorId === acc.id);\n  if (!myPrograms.length){\n    el.innerHTML = `<div class=\"panel\"><div class=\"panel-head\"><div><span class=\"eyebrow\">LESSON PLAN</span><h2>지도안 작성</h2></div></div>\n      <div class=\"empty-state\">아직 담당으로 지정된 프로그램이 없습니다. 관리자가 '프로그램 관리'에서 담당 멘토로 지정하면 이 화면에서 지도안을 작성할 수 있습니다.</div></div>`;\n    return;\n  }\n  if (!currentMentorPlanProgram || !myPrograms.some(p => p.id === currentMentorPlanProgram)){\n    currentMentorPlanProgram = myPrograms[0].id;\n  }\n  const pid = currentMentorPlanProgram;\n  const prog = program(pid);\n  const existingPlans = programLessonPlans(pid);\n  const nextSession = existingPlans.length ? Math.max(...existingPlans.map(lp=>lp.sessionNo||1)) + 1 : 1;\n  const students = STATE.accounts.filter(a => a.role === 'student');\n  const myPlans = (STATE.lessonPlans||[]).filter(lp => lp.mentorId === acc.id).sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));\n  if (!mentorPlanDraft) mentorPlanDraft = defaultPlanDraft();\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">LESSON PLAN</span><h2>새 지도안 제출</h2></div></div>\n      <div class=\"field\" style=\"max-width:420px;\"><label>어떤 프로그램의 지도안인가요?</label>\n        <select id=\"plan-program-select\" style=\"${selectFieldStyle}\">\n          ${myPrograms.map(p=>`<option value=\"${p.id}\" ${p.id===pid?'selected':''}>${esc(p.school)} · ${esc(p.name)}</option>`).join('')}\n        </select>\n      </div>\n      <div class=\"insight-box\" style=\"margin:14px 0;\">실제 수업 지도안 형식대로 작성해주세요. 각 활동마다 시작~종료 시간(예: 0′-5′)을 입력하면 도입·전개·정리 단계별 소요 시간이 자동으로 계산됩니다. 승인되면 '핵심 활동'이 이 수업의 사전·사후 설문 문항에 그대로 반영되고, 선택한 학생들이 이 프로그램에 정식 등록됩니다.</div>\n      <form id=\"plan-form\">\n        <div class=\"grid-2b\">\n          <div class=\"field\"><label>몇 차시 수업인가요?</label><input type=\"number\" min=\"1\" id=\"plan-session\" value=\"${nextSession}\" /></div>\n          <div class=\"field\"><label>총 소요 시간 (자동 계산)</label><div id=\"plan-total-duration\" style=\"padding:8px 0;font-weight:700;\">0분</div></div>\n        </div>\n        <div class=\"field\"><label>수업 주제</label><input id=\"plan-topic\" placeholder=\"예: 센서로 장애물을 피하는 자율주행 로봇 만들기\" /></div>\n        <div class=\"field\"><label>대상</label><input id=\"plan-audience\" placeholder=\"예: 초등학교 5~6학년\" value=\"${esc(prog.school||'')}\" /></div>\n        <div class=\"field\"><label>학습 목표 (한 줄에 하나씩)</label><textarea id=\"plan-objectives\" placeholder=\"예:&#10;초음파 센서의 원리를 이해한다&#10;블록 코딩으로 조건문을 활용할 수 있다\" style=\"min-height:80px;\"></textarea></div>\n        <div class=\"field\"><label>핵심 활동 (쉼표로 구분, 승인 시 설문 문항에 반영)</label><input id=\"plan-activities\" placeholder=\"예: 센서 코딩, 장애물 회피 미션 도전\" /></div>\n        <div>\n          ${renderPlanStageBlock('도입')}\n          ${renderPlanStageBlock('전개')}\n          ${renderPlanStageBlock('정리')}\n        </div>\n        <div class=\"field\" style=\"margin-top:16px;\"><label>수강 학생 선택 (승인 시 정식 등록됩니다)</label>\n          <div class=\"checkbox-list\" style=\"max-height:260px;overflow-y:auto;border:1px solid var(--border-strong);border-radius:8px;padding:8px;\">\n            ${students.map(s=>`<label style=\"display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:13px;\">\n              <input type=\"checkbox\" class=\"plan-student-check\" value=\"${s.id}\" ${s.programId===pid?'checked':''} style=\"flex:none;width:16px;height:16px;margin:0;\" />\n              <span>${esc(s.name)}${s.grade?' · '+esc(s.grade):''}${s.school?' · '+esc(s.school):''}</span>\n            </label>`).join('')}\n          </div>\n        </div>\n        <button type=\"submit\" class=\"btn btn-primary\" style=\"margin-top:14px;\">관리자에게 승인 요청</button>\n      </form>\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">MY SUBMISSIONS</span><h2>제출한 지도안 (${myPlans.length}건)</h2></div></div>\n      ${myPlans.length===0 ? `<div class=\"empty-state\">아직 제출한 지도안이 없습니다.</div>` : ''}\n    </div>\n    ${myPlans.map(lp=>renderLessonPlanCard(lp, {canDecide:false})).join('')}`;\n  document.getElementById('plan-program-select').addEventListener('change', e => { currentMentorPlanProgram = e.target.value; mentorPlanDraft = defaultPlanDraft(); render(); });\n  el.querySelectorAll('.plan-stage-block').forEach(block => bindStageBlockEvents(block, el));\n  recomputeAllDurations(el);\n  document.getElementById('plan-form').addEventListener('submit', e => {\n    e.preventDefault();\n    syncPlanDraftFromDom(el);\n    const topic = document.getElementById('plan-topic').value.trim();\n    const audience = document.getElementById('plan-audience').value.trim();\n    const objectives = document.getElementById('plan-objectives').value.split('\\n').map(s=>s.trim()).filter(Boolean);\n    const activities = document.getElementById('plan-activities').value.split(',').map(s=>s.trim()).filter(Boolean);\n    const sessionNo = Number(document.getElementById('plan-session').value) || 1;\n    const studentIds = [...el.querySelectorAll('.plan-student-check:checked')].map(c=>c.value);\n    // Drop rows left completely blank (e.g. an added-then-unused row) —\n    // only rows with actual content count as real 학습내용.\n    const stages = ['도입','전개','정리'].map(stage => ({\n      stage, rows: mentorPlanDraft[stage].filter(r => r.label || r.teacher || r.student),\n    }));\n    const durationMin = stages.reduce((sum, s) => sum + stageDurationMin(s.rows), 0);\n    if (!topic || !objectives.length || !activities.length) { toast('수업 주제, 학습 목표, 핵심 활동은 꼭 입력해주세요.'); return; }\n    if (!stages.some(s => s.rows.length)) { toast('도입·전개·정리 중 최소 하나의 활동은 입력해주세요.'); return; }\n    saveState(d => {\n      if (!d.lessonPlans) d.lessonPlans = [];\n      d.lessonPlans.push({\n        id: 'lp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),\n        programId: pid, mentorId: acc.id, sessionNo, topic, durationMin, audience,\n        objectives, activities, stages, studentIds,\n        status: 'pending', submittedAt: new Date().toISOString(), decidedAt: null, decidedBy: null,\n      });\n    });\n    mentorPlanDraft = defaultPlanDraft();\n    toast('지도안을 제출했습니다. 관리자 승인 후 정규 교육으로 반영됩니다.');\n  });\n}\n\n/* ================= STUDENT ================= */\nfunction renderStudentView(el, acc){\n  if (currentView === 'home') return renderStudentHome(el, acc);\n  if (currentView === 'journal') return renderStudentJournal(el, acc);\n  if (currentView === 'survey') return renderStudentSurvey(el, acc);\n  if (currentView === 'mycourses') return renderStudentCourses(el, acc);\n  if (currentView === 'chat') return renderStudentChat(el, acc);\n  if (currentView === 'community') return renderStudentCommunity(el, acc);\n}\nfunction renderStudentHome(el, acc){\n  renderStudentDetailPanel(el, acc, { canAddMentorNote:false, canChat:false, viewerAccount: acc });\n}\n// 탐구 저널 — this is the actual, real behavior-data source: the student's\n// own short account of what they tried each session. The rule-based\n// analyzer (JOURNAL_KEYWORDS / journalScore) reads this text automatically —\n// nobody rates it, and it's combined with real platform-usage counts\n// (logins, messages sent, chats started) to produce \"AI 자동 수집 행동 데이터\".\nconst selectFieldStyle = 'width:100%;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary)';\nfunction renderStudentJournal(el, acc){\n  const programs = studentEligiblePrograms(acc.id);\n  if (!programs.length){\n    el.innerHTML = `<div class=\"panel\"><div class=\"panel-head\"><div><span class=\"eyebrow\">JOURNAL</span><h2>탐구 저널</h2></div></div>\n      <div class=\"empty-state\">아직 배정된 프로그램(학교·회차)이 없어 저널을 작성할 수 없습니다. 관리자가 프로그램을 배정하면 열립니다.</div></div>`;\n    return;\n  }\n  // Default to the currently assigned program; if that's not among the\n  // eligible list (or nothing's currently assigned), fall back to the most\n  // recent program the student has any history with.\n  if (!currentJournalProgram || !programs.some(p => p.id === currentJournalProgram)){\n    currentJournalProgram = (acc.programId && programs.some(p => p.id === acc.programId)) ? acc.programId : programs[programs.length-1].id;\n  }\n  const pid = currentJournalProgram;\n  const prog = program(pid);\n  const logs = studentActivityLogs(acc.id, pid);\n  const nextSession = logs.length ? Math.max(...logs.map(l=>l.sessionNo||1)) + 1 : 1;\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">JOURNAL</span><h2>이번 차시 기록하기</h2></div></div>\n      <div class=\"field\" style=\"max-width:420px;\"><label>어떤 수업의 탐구 저널인가요?</label>\n        <select id=\"journal-program-select\" style=\"${selectFieldStyle}\">\n          ${programs.map(p=>`<option value=\"${p.id}\" ${p.id===pid?'selected':''}>${esc(p.school)} · ${esc(p.name)}${p.id===acc.programId?' (현재 수강 중)':''}</option>`).join('')}\n        </select>\n      </div>\n      <div class=\"insight-box\" style=\"margin:14px 0;\">이 기록이 여러분의 실제 행동 데이터가 됩니다. 무엇을 시도했고, 어떻게 풀어갔는지 최대한 자세히 적어주세요 — AI가 이 글을 분석해서 여러분의 강점을 찾아냅니다.</div>\n      <form id=\"journal-form\">\n        <div class=\"field\" style=\"max-width:160px;\"><label>몇 차시 수업이었나요?</label><input type=\"number\" min=\"1\" id=\"journal-session\" value=\"${nextSession}\" /></div>\n        <div class=\"field\"><label>오늘 무엇을 시도했나요?</label><textarea id=\"journal-text\" placeholder=\"예: 처음엔 잘 안 됐는데 다른 방법으로 다시 시도해봤어요. 팀원이랑 같이 아이디어를 나눠서 새로운 방법을 찾았어요.\" style=\"min-height:120px;\"></textarea></div>\n        <button type=\"submit\" class=\"btn btn-primary\">저널 저장</button>\n      </form>\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">HISTORY</span><h2>${esc(prog.name)} 저널 (${logs.length}건)</h2></div><div class=\"hint\">${esc(prog.school)}</div></div>\n      ${logs.length===0 ? `<div class=\"empty-state\">이 수업에 작성한 저널이 아직 없습니다.</div>` : `\n      <div class=\"table-wrap\"><table>\n        <thead><tr><th>차시</th><th>날짜</th><th>내용</th></tr></thead>\n        <tbody>${logs.slice().reverse().map(l=>`<tr><td>${l.sessionNo}차시</td><td>${fmtDate(l.ts)}</td><td>${esc(l.text)}</td></tr>`).join('')}</tbody>\n      </table></div>`}\n    </div>`;\n  document.getElementById('journal-program-select').addEventListener('change', e => { currentJournalProgram = e.target.value; render(); });\n  document.getElementById('journal-form').addEventListener('submit', e => {\n    e.preventDefault();\n    const text = document.getElementById('journal-text').value.trim();\n    const sessionNo = Number(document.getElementById('journal-session').value) || 1;\n    if (!text) { toast('내용을 입력해주세요.'); return; }\n    saveState(d => {\n      if (!d.activityLogs[acc.id]) d.activityLogs[acc.id] = [];\n      d.activityLogs[acc.id].push({ ts: new Date().toISOString(), programId: pid, sessionNo, text });\n    });\n    toast(`${prog.name} ${sessionNo}차시 탐구 저널이 저장되었습니다.`);\n  });\n}\n// Follow-up / advanced STEM course catalog + application. Applying never\n// auto-enrolls the student — every application starts 'pending' and only\n// becomes real once admin approves it in renderAdminApplications.\nfunction renderStudentCourses(el, acc){\n  const courses = STATE.courses || [];\n  const myApps = (STATE.applications||[]).filter(a=>a.studentId===acc.id);\n  const latestAppFor = (courseId) => myApps.filter(a=>a.courseId===courseId).sort((a,b)=> new Date(b.appliedAt)-new Date(a.appliedAt))[0] || null;\n  const statusPill = (app) => {\n    if (!app) return '';\n    if (app.status==='pending') return '<span class=\"pill pill-warn\">승인 대기 중</span>';\n    if (app.status==='approved') return '<span class=\"pill pill-good\">승인됨 · 수강 확정</span>';\n    return '<span class=\"pill pill-critical\">반려됨</span>';\n  };\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">STEM ADVANCED</span><h2>후속 심화 교육 과정</h2></div><div class=\"hint\">신청 후 관리자 승인이 완료되면 수강이 확정됩니다</div></div>\n      <div class=\"insight-box\">참여했던 프로그램에서 더 나아가고 싶다면, 아래 심화 과정 중 관심 있는 교육에 신청해보세요. 신청은 바로 확정되지 않으며, 관리자가 확인 후 승인합니다.</div>\n    </div>\n    ${courses.map(c => {\n      const app = latestAppFor(c.id);\n      const canApply = !app || app.status==='rejected';\n      return `\n      <div class=\"panel\">\n        <div class=\"panel-head\">\n          <div><span class=\"eyebrow\">${esc(c.field)} · ${esc(c.level)}</span><h2>${esc(c.title)}</h2></div>\n          <div class=\"hint\">${esc(c.duration)}</div>\n        </div>\n        <p class=\"analysis-text\" style=\"margin-bottom:10px;\">${esc(c.summary)}</p>\n        <div class=\"grid-2b\">\n          <div>\n            <div class=\"label\" style=\"font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;\">무엇을 배우나요</div>\n            <ul class=\"evidence-list\" style=\"gap:8px;\">${c.curriculum.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>\n          </div>\n          <div>\n            <div class=\"label\" style=\"font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;\">이런 학생에게 추천해요</div>\n            <p class=\"analysis-text\">${esc(c.suitableFor)}</p>\n          </div>\n        </div>\n        <div style=\"margin-top:14px;\">\n          ${app ? `<div class=\"chip-row\">${statusPill(app)}<span class=\"hint\" style=\"margin-left:8px;\">${app.status==='rejected' ? '이전 신청이 반려되었습니다. 다시 신청할 수 있어요.' : '신청일 '+fmtDate(app.appliedAt)}</span></div>` : ''}\n          ${canApply ? `\n          <form class=\"apply-form\" data-course=\"${c.id}\" style=\"margin-top:10px;\">\n            <div class=\"field\"><label>신청 사유 (선택)</label><input placeholder=\"예: 로봇 캠프에서 더 나아가 직접 코드를 짜보고 싶어요\" class=\"apply-message\" /></div>\n            <button type=\"submit\" class=\"btn btn-primary\">${app && app.status==='rejected' ? '다시 신청하기' : '신청하기'}</button>\n          </form>` : ''}\n        </div>\n      </div>`;\n    }).join('')}\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">MY APPLICATIONS</span><h2>내 신청 현황 (${myApps.length}건)</h2></div></div>\n      ${myApps.length===0 ? `<div class=\"empty-state\">아직 신청한 심화 교육이 없습니다.</div>` : `\n      <div class=\"table-wrap\"><table>\n        <thead><tr><th>교육 과정</th><th>신청일</th><th>상태</th><th>처리일</th></tr></thead>\n        <tbody>\n          ${myApps.slice().sort((a,b)=>new Date(b.appliedAt)-new Date(a.appliedAt)).map(a=>{\n            const c = courses.find(x=>x.id===a.courseId);\n            return `<tr><td>${esc(c?c.title:'(삭제된 과정)')}</td><td>${fmtDate(a.appliedAt)}</td><td>${statusPill(a)}</td><td>${a.decidedAt?fmtDate(a.decidedAt):'-'}</td></tr>`;\n          }).join('')}\n        </tbody>\n      </table></div>`}\n    </div>`;\n  el.querySelectorAll('.apply-form').forEach(form => {\n    form.addEventListener('submit', e => {\n      e.preventDefault();\n      const courseId = form.dataset.course;\n      const message = form.querySelector('.apply-message').value.trim();\n      saveState(d => {\n        if (!d.applications) d.applications = [];\n        d.applications.push({ id:'app_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), studentId: acc.id, courseId, status:'pending', appliedAt: new Date().toISOString(), message, decidedAt:null, decidedBy:null });\n      });\n      toast('신청이 접수되었습니다. 관리자 승인을 기다려주세요.');\n    });\n  });\n}\n// Mentors can change program-to-program (a student may take one program's\n// class from mentor01 and the next from mentor02), so chat is not locked to\n// today's assigned mentor — a student can pick ANY mentor here, including\n// one whose class they've never taken.\nfunction renderStudentChat(el, acc){\n  if (currentChatMentor) return renderStudentChatWithMentor(el, acc);\n  const mentors = STATE.accounts.filter(a => a.role==='mentor');\n  const myMentorId = studentMentorId(acc.id);\n  const taughtByIds = new Set(studentMentorNotes(acc.id).map(n => n.mentorId));\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">MENTORS</span><h2>대화할 멘토 선택하기</h2></div><div class=\"hint\">담당 멘토가 아니어도 다른 멘토에게 대화를 요청할 수 있습니다</div></div>\n      ${mentors.length===0 ? `<div class=\"empty-state\">등록된 멘토가 없습니다.</div>` : `\n      <div class=\"list-cards\">\n        ${mentors.map(m=>{\n          const chat = getChat(acc.id, m.id);\n          const statusPill = chat.status==='active' ? '<span class=\"pill pill-good\">대화 중</span>'\n            : chat.status==='pending' ? (chat.requestedBy===acc.id ? '<span class=\"pill pill-muted\">요청 보냄</span>' : '<span class=\"pill pill-warn\">대화 요청 옴</span>')\n            : '';\n          const relTag = m.id===myMentorId ? '<span class=\"tag\" style=\"color:var(--accent);\">현재 담당 멘토</span>'\n            : taughtByIds.has(m.id) ? '<span class=\"tag\">이전에 배운 멘토</span>' : '';\n          return `<div class=\"entity-card\" data-id=\"${m.id}\" style=\"cursor:pointer;\">\n            <div class=\"head\"><div class=\"avatar\" style=\"background:var(--s-collab-soft); color:var(--s-collab);\">${esc(m.name[0])}</div><div><div class=\"id\">${esc(m.name)}</div><div class=\"grade\">${esc(m.field||'')}</div></div>${statusPill}</div>\n            ${relTag ? `<div class=\"chip-row\">${relTag}</div>` : ''}\n          </div>`;\n        }).join('')}\n      </div>`}\n    </div>`;\n  el.querySelectorAll('.entity-card').forEach(card => card.addEventListener('click', () => { currentChatMentor = card.dataset.id; render(); }));\n}\nfunction renderStudentChatWithMentor(el, acc){\n  const mentor = STATE.accounts.find(a=>a.id===currentChatMentor);\n  if (!mentor) { currentChatMentor = null; return renderStudentChat(el, acc); }\n  el.innerHTML = `<button class=\"btn btn-ghost\" id=\"back-btn\" style=\"margin-bottom:14px;\">${icon('back')} 목록으로</button>\n    <div class=\"panel\"><div class=\"panel-head\"><h2>${esc(mentor.name)} 멘토와의 대화</h2></div><div id=\"chat-slot\"></div></div>`;\n  document.getElementById('back-btn').addEventListener('click', () => { currentChatMentor = null; render(); });\n  renderChatPanel(document.getElementById('chat-slot'), acc.id, mentor.id, { viewerId: acc.id, readOnly:false });\n}\nfunction renderStudentCommunity(el, acc){\n  if (currentCommunityPeer) return renderStudentCommunityChat(el, acc);\n  const peers = STATE.accounts.filter(a => a.role==='student' && a.id !== acc.id && a.school && acc.school && a.school === acc.school);\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">COMMUNITY</span><h2>${acc.school ? esc(acc.school)+'의 다른 학생들' : '같은 학교 친구들'}</h2></div><div class=\"hint\">이름·학년·관심 분야만 공개됩니다</div></div>\n      ${!acc.school ? `<div class=\"empty-state\">학교 정보가 등록되어 있지 않아 또래를 찾을 수 없습니다. 관리자에게 학교 등록을 요청하세요.</div>` :\n        peers.length===0 ? `<div class=\"empty-state\">같은 학교에 등록된 다른 학생이 아직 없습니다.</div>` : `\n      <div class=\"list-cards\">\n        ${peers.map(p=>{\n          const chat = getChat(acc.id, p.id);\n          const statusPill = chat.status==='active' ? '<span class=\"pill pill-good\">대화 중</span>'\n            : chat.status==='pending' ? (chat.requestedBy===acc.id ? '<span class=\"pill pill-muted\">요청 보냄</span>' : '<span class=\"pill pill-warn\">대화 요청 옴</span>')\n            : '';\n          return `<div class=\"entity-card\" data-id=\"${p.id}\" style=\"cursor:pointer;\">\n            <div class=\"head\"><div class=\"avatar\">${esc(p.name[0])}</div><div><div class=\"id\">${esc(p.name)}</div><div class=\"grade\">${esc(p.grade||'')}</div></div>${statusPill}</div>\n            <div class=\"chip-row\">${(p.interests||[]).map(i=>`<span class=\"tag\">${esc(i)}</span>`).join('')}</div>\n          </div>`;\n        }).join('')}\n      </div>`}\n    </div>`;\n  el.querySelectorAll('.entity-card').forEach(card => card.addEventListener('click', () => { currentCommunityPeer = card.dataset.id; render(); }));\n}\nfunction renderStudentCommunityChat(el, acc){\n  const peer = STATE.accounts.find(a=>a.id===currentCommunityPeer);\n  if (!peer) { currentCommunityPeer = null; return renderStudentCommunity(el, acc); }\n  el.innerHTML = `<button class=\"btn btn-ghost\" id=\"back-btn\" style=\"margin-bottom:14px;\">${icon('back')} 목록으로</button>\n    <div class=\"panel\"><div class=\"panel-head\"><h2>${esc(peer.name)}님과의 대화</h2></div><div id=\"chat-slot\"></div></div>`;\n  document.getElementById('back-btn').addEventListener('click', () => { currentCommunityPeer = null; render(); });\n  renderChatPanel(document.getElementById('chat-slot'), acc.id, peer.id, { viewerId: acc.id, readOnly:false });\n}\nfunction renderStudentSurvey(el, acc){\n  const programs = studentEligiblePrograms(acc.id);\n  if (!programs.length){\n    el.innerHTML = `<div class=\"panel\"><div class=\"panel-head\"><div><span class=\"eyebrow\">SURVEY</span><h2>성장 설문</h2></div></div>\n      <div class=\"empty-state\">아직 배정된 프로그램(학교·회차)이 없어 설문을 진행할 수 없습니다. 관리자가 프로그램을 배정하면 설문이 열립니다.</div></div>`;\n    return;\n  }\n  if (!currentSurveyProgram || !programs.some(p => p.id === currentSurveyProgram)){\n    currentSurveyProgram = (acc.programId && programs.some(p => p.id === acc.programId)) ? acc.programId : programs[programs.length-1].id;\n  }\n  const pid = currentSurveyProgram;\n  const prog = program(pid);\n  const surveys = (STATE.surveys[acc.id] && STATE.surveys[acc.id][pid]) || {};\n  const preDone = !!surveys.pre, postDone = !!surveys.post;\n  const items = programPerceptionItems(prog);\n  const approvedActs = programApprovedActivities(pid);\n  const hasCustomItems = approvedActs.length > 0;\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">SURVEY</span><h2>설문 선택</h2></div></div>\n      <div class=\"field\" style=\"max-width:420px;\"><label>어떤 수업의 설문인가요?</label>\n        <select id=\"survey-program-select\" style=\"${selectFieldStyle}\">\n          ${programs.map(p=>`<option value=\"${p.id}\" ${p.id===pid?'selected':''}>${esc(p.school)} · ${esc(p.name)}${p.id===acc.programId?' (현재 수강 중)':''}</option>`).join('')}\n        </select>\n      </div>\n      <div class=\"chip-row\" style=\"margin-top:12px;\">\n        <span class=\"pill ${preDone?'pill-good':'pill-muted'}\">사전 설문 ${preDone?'완료':'대기'}</span>\n        <span class=\"pill ${postDone?'pill-good':'pill-muted'}\">사후 설문 ${postDone?'완료':'대기'}</span>\n      </div>\n      <div class=\"form-actions\">\n        <button class=\"btn ${surveyPhase==='pre'?'btn-primary':'btn-ghost'}\" id=\"tab-pre\">사전 설문 ${preDone?'다시 작성':'작성'}</button>\n        <button class=\"btn ${surveyPhase==='post'?'btn-primary':'btn-ghost'}\" id=\"tab-post\">사후 설문 ${postDone?'다시 작성':'작성'}</button>\n
