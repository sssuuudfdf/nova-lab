   </div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">${surveyPhase==='pre'?'PRE':'POST'}</span><h2>${surveyPhase==='pre'?'교육 전':'교육 후'} 인식 설문</h2></div><div class=\"hint\">1(전혀 아니다) ~ 5(매우 그렇다)</div></div>\n      ${hasCustomItems ? `<div class=\"insight-box\" style=\"margin-bottom:14px;\">이 문항들은 \"${esc(prog.name)}\" 수업의 실제 활동(${approvedActs.map(a=>esc(a)).join(', ')}) — 담당 멘토가 작성하고 관리자가 승인한 지도안 — 을 바탕으로 만들어졌습니다.</div>` : ''}\n      <form id=\"survey-form\">\n        ${COMP.map(c => `\n          <div class=\"survey-q\"><div class=\"qtext\" style=\"color:var(--accent-strong); font-weight:800; margin-bottom:2px;\">${c.label}</div>\n            ${items[c.key].map(item => `\n              <div class=\"survey-q\" style=\"padding:10px 0;\">\n                <div class=\"qtext\">${esc(item.text)}</div>\n                <div class=\"likert\">\n                  ${[1,2,3,4,5].map(v=>`<label><input type=\"radio\" name=\"${item.id}\" value=\"${v}\" ${(surveys[surveyPhase]&&surveys[surveyPhase][item.id]===v)?'checked':(v===3&&!surveys[surveyPhase]?'checked':'')}/>${v}</label>`).join('')}\n                </div>\n              </div>`).join('')}\n          </div>`).join('')}\n        <button type=\"submit\" class=\"btn btn-primary\">${surveyPhase==='pre'?'사전':'사후'} 설문 제출</button>\n      </form>\n    </div>`;\n  document.getElementById('survey-program-select').addEventListener('change', e => { currentSurveyProgram = e.target.value; render(); });\n  document.getElementById('tab-pre').addEventListener('click', () => { surveyPhase='pre'; render(); });\n  document.getElementById('tab-post').addEventListener('click', () => { surveyPhase='post'; render(); });\n  document.getElementById('survey-form').addEventListener('submit', e => {\n    e.preventDefault();\n    const fd = new FormData(e.target);\n    const rec = { _submittedAt: new Date().toISOString() };\n    let allAnswered = true;\n    COMP.forEach(c => items[c.key].forEach(item => {\n      const v = fd.get(item.id);\n      if (!v) allAnswered = false; else rec[item.id] = Number(v);\n    }));\n    if (!allAnswered) { toast('모든 문항에 답해주세요.'); return; }\n    saveState(d => {\n      if (!d.surveys[acc.id]) d.surveys[acc.id] = {};\n      if (!d.surveys[acc.id][pid]) d.surveys[acc.id][pid] = {};\n      d.surveys[acc.id][pid][surveyPhase] = rec;\n    });\n    toast(`${prog.name} ${surveyPhase==='pre'?'사전':'사후'} 설문이 제출되었습니다.`);\n  });\n}\n\n/* ================= boot ================= */\nrender();\n";
const CSS_TEXT = "@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');\n\n:root{\n  color-scheme: light;\n  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#fbfaf8; --surface-sunken:#efeeea;\n  --text-primary:#17161c; --text-secondary:#57565d; --text-muted:#8c8a91;\n  --border:rgba(23,22,28,0.10); --border-strong:rgba(23,22,28,0.16);\n  --accent:#4a3aa7; --accent-strong:#372c82; --accent-soft:#ece8fb; --accent-ink:#ffffff;\n  --good-text:#006300; --good-soft:#e4f3e1;\n  --critical:#d03b3b; --critical-soft:#fbe8e8;\n  --warn:#9a6b00; --warn-soft:#faedd3;\n  --s-problem:#2a78d6;   --s-problem-soft:#e2ecfa;\n  --s-creativity:#c9591f; --s-creativity-soft:#fbe9dd;\n  --s-collab:#178f65;    --s-collab-soft:#dcf1e8;\n  --s-self:#b8790a;      --s-self-soft:#faedd3;\n  --before-fill:#d9d7d1;\n  --shadow: 0 1px 2px rgba(23,22,28,0.04), 0 8px 24px -12px rgba(23,22,28,0.12);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme: dark;\n    --bg:#0e0d12; --surface:#18171d; --surface-2:#1e1d24; --surface-sunken:#131217;\n    --text-primary:#f5f4f8; --text-secondary:#c2c0c7; --text-muted:#8e8c93;\n    --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.16);\n    --accent:#a99ef2; --accent-strong:#c1b8f6; --accent-soft:rgba(169,158,242,0.16); --accent-ink:#1c1730;\n    --good-text:#3fc23f; --good-soft:rgba(63,194,63,0.14);\n    --critical:#e88686; --critical-soft:rgba(232,134,134,0.14);\n    --warn:#e0a53f; --warn-soft:rgba(224,165,63,0.16);\n    --s-problem:#5c9cec;  --s-problem-soft:rgba(92,156,236,0.16);\n    --s-creativity:#e8834f; --s-creativity-soft:rgba(232,131,79,0.16);\n    --s-collab:#3ec293;    --s-collab-soft:rgba(62,194,147,0.16);\n    --s-self:#e0a53f;      --s-self-soft:rgba(224,165,63,0.16);\n    --before-fill:#3a3843;\n    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme: dark;\n  --bg:#0e0d12; --surface:#18171d; --surface-2:#1e1d24; --surface-sunken:#131217;\n  --text-primary:#f5f4f8; --text-secondary:#c2c0c7; --text-muted:#8e8c93;\n  --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.16);\n  --accent:#a99ef2; --accent-strong:#c1b8f6; --accent-soft:rgba(169,158,242,0.16); --accent-ink:#1c1730;\n  --good-text:#3fc23f; --good-soft:rgba(63,194,63,0.14);\n  --critical:#e88686; --critical-soft:rgba(232,134,134,0.14);\n  --warn:#e0a53f; --warn-soft:rgba(224,165,63,0.16);\n  --s-problem:#5c9cec;  --s-problem-soft:rgba(92,156,236,0.16);\n  --s-creativity:#e8834f; --s-creativity-soft:rgba(232,131,79,0.16);\n  --s-collab:#3ec293;    --s-collab-soft:rgba(62,194,147,0.16);\n  --s-self:#e0a53f;      --s-self-soft:rgba(224,165,63,0.16);\n  --before-fill:#3a3843;\n  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);\n}\n\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;height:100%;}\nbody{\n  background:var(--bg); color:var(--text-primary);\n  font-family:\"Noto Sans KR\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;\n}\nh1,h2,h3,h4{margin:0; font-weight:700; text-wrap:balance;}\np{margin:0;}\nbutton{font-family:inherit;}\na{color:var(--accent-strong);}\n::selection{background:var(--accent-soft);}\n@media (prefers-reduced-motion: no-preference){ .view{animation:fadeIn .16s ease;} }\n@keyframes fadeIn{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:none;}}\n\n/* ---------- Login ---------- */\n.login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }\n.login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px;\n  padding:32px 30px; box-shadow:var(--shadow); }\n.login-brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }\n.login-brand .mark{ width:30px; height:30px; border-radius:8px; background:linear-gradient(155deg, var(--accent), var(--s-collab)); }\n.login-brand .txt .n{ font-size:14.5px; font-weight:800; letter-spacing:.2px; }\n.login-brand .txt .s{ font-size:11px; color:var(--text-muted); font-weight:600; letter-spacing:.4px; }\n.login-card h1{ font-size:19px; margin-bottom:6px; }\n.login-card .sub{ font-size:12.5px; color:var(--text-muted); margin-bottom:22px; }\n.field{ margin-bottom:14px; }\n.field label{ display:block; font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:6px; }\n.field input, .field select, .field textarea{\n  width:100%; font-family:inherit; font-size:13.5px; color:var(--text-primary);\n  background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; padding:9px 11px;\n}\n.field textarea{ resize:vertical; min-height:60px; }\n.field input:focus, .field select:focus, .field textarea:focus, button:focus-visible, .nav-item:focus-visible{\n  outline:2px solid var(--accent); outline-offset:1px;\n}\n.login-error{ font-size:12.5px; color:var(--critical); background:var(--critical-soft); border-radius:8px; padding:9px 11px; margin-bottom:14px; }\n.btn{ display:inline-flex; align-items:center; gap:6px; justify-content:center; font-size:13px; font-weight:700;\n  border-radius:8px; padding:9px 15px; border:1px solid transparent; cursor:pointer; white-space:nowrap; }\n.btn-primary{ background:var(--accent); color:var(--accent-ink); }\n.btn-primary:hover{ background:var(--accent-strong); }\n.btn-ghost{ background:var(--surface-2); color:var(--text-primary); border-color:var(--border-strong); }\n.btn-ghost:hover{ background:var(--surface-sunken); }\n.btn-danger{ background:var(--critical-soft); color:var(--critical); }\n.btn:disabled{ opacity:.5; cursor:default; }\n.btn-block{ width:100%; }\n.login-foot{ margin-top:16px; font-size:11.5px; color:var(--text-muted); text-align:center; }\n\n/* ---------- App shell ---------- */\n.app{ display:flex; min-height:100vh; }\n.sidebar{ width:216px; flex:none; background:var(--surface); border-right:1px solid var(--border);\n  display:flex; flex-direction:column; padding:20px 12px; position:sticky; top:0; height:100vh; }\n.brand{ display:flex; align-items:center; gap:9px; padding:4px 8px 18px; }\n.brand-mark{ width:26px; height:26px; border-radius:7px; background:linear-gradient(155deg, var(--accent), var(--s-collab)); flex:none; }\n.brand-text .name{ font-size:13.5px; font-weight:800; letter-spacing:.2px; }\n.brand-text .sub{ font-size:10.5px; color:var(--text-muted); font-weight:600; letter-spacing:.4px; }\n.nav{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }\n.nav-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;\n  color:var(--text-secondary); font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }\n.nav-item svg{ width:16px; height:16px; flex:none; opacity:.85; }\n.nav-item:hover{ background:var(--surface-2); color:var(--text-primary); }\n.nav-item.active{ background:var(--accent-soft); color:var(--accent-strong); }\n.nav-item.active svg{ opacity:1; }\n.nav-item .badge{ margin-left:auto; font-size:10px; font-weight:800; background:var(--critical); color:#fff; border-radius:999px; padding:1px 6px; }\n.sidebar-foot{ margin-top:auto; padding:12px 10px 2px; border-top:1px solid var(--border); }\n.who{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }\n.who .avatar{ width:28px; height:28px; border-radius:8px; background:var(--accent-soft); color:var(--accent-strong);\n  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex:none; }\n.who .meta .n{ font-size:12.5px; font-weight:700; }\n.who .meta .r{ font-size:10.5px; color:var(--text-muted); font-weight:600; }\n\n.main{ flex:1; min-width:0; display:flex; flex-direction:column; }\n.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px;\n  border-bottom:1px solid var(--b }\n\n.grid-2{ display:grid; grid-template-columns:1.15fr .85fr; gap:16px; align-items:start; }\n.grid-2b{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }\n\n.tag{ display:inline-flex; align-items:center; font-size:11.5px; font-weight:600; padding:4px 9px;\n  border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-secondary); }\n.pill{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; }\n.pill-good{ color:var(--good-text); background:var(--good-soft); }\n.pill-warn{ color:var(--warn); background:var(--warn-soft); }\n.pill-muted{ color:var(--text-muted); background:var(--surface-2); }\n.pill-critical{ color:var(--critical); background:var(--critical-soft); }\n\ntable{ width:100%; border-collapse:collapse; font-size:12.5px; }\nth{ text-align:left; font-size:10.5px; font-weight:700; color:var(--text-muted); letter-spacing:.3px;\n  padding:0 10px 8px; border-bottom:1px solid var(--border-strong); }\ntd{ padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }\ntbody tr:hover{ background:var(--surface-2); }\n.table-wrap{ overflow-x:auto; }\n.num{ font-variant-numeric:tabular-nums; }\n\n/* bars / meters */\n.chart{ display:flex; align-items:flex-end; gap:26px; height:190px; padding:6px 4px 0; }\n.chart-group{ display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; height:100%; justify-content:flex-end;}\n.chart-bars{ display:flex; align-items:flex-end; gap:6px; height:150px; }\n.bar{ width:22px; border-radius:4px 4px 2px 2px; position:relative; }\n.bar-value{ position:absolute; top:-17px; left:50%; transform:translateX(-50%); font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text-secondary); white-space:nowrap;}\n.chart-label{ font-size:11.5px; font-weight:700; text-align:center; }\n.chart-delta{ font-size:10.5px; font-weight:700; color:var(--good-text); }\n.legend{ display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; }\n.legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-secondary); font-weight:600; }\n.legend-swatch{ width:10px; height:10px; border-radius:3px; }\n\n.meter-row{ display:flex; align-items:center; gap:12px; padding:9px 0; }\n.meter-label{ width:96px; flex:none; font-size:12.5px; font-weight:700; }\n.meter-track{ flex:1; height:9px; border-radius:999px; background:var(--surface-sunken); position:relative; overflow:hidden; }\n.meter-fill{ height:100%; border-radius:999px; }\n.meter-value{ width:34px; flex:none; text-align:right; font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums; }\n.meter-delta{ width:44px; flex:none; text-align:right; font-size:11px; font-weight:700; color:var(--good-text); }\n\n.insight-box{ background:var(--accent-soft); border:1px solid var(--border); border-left:3px solid var(--accent);\n  border-radius:8px; padding:14px 16px; font-size:13px; color:var(--text-primary); line-height:1.7; }\n.formula-box{ font-size:11.5px; color:var(--text-muted); background:var(--surface-2); border-radius:8px; padding:9px 11px; margin-top:10px; }\n.info-row{ background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--text-secondary); line-height:1.6; }\n.info-row b{ color:var(--text-primary); }\n\n.analysis-list{ display:flex; flex-direction:column; gap:14px; margin-top:16px; }\n.analysis-item{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--surface-2); }\n.analysis-head{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px; }\n.analysis-head .dot{ width:9px; height:9px; border-radius:50%; flex:none; }\n.analysis-head b{ color:var(--text-primary); }\n.analysis-score{ margin-left:auto; font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; }\n.analysis-text{ font-size:12.5px; color:var(--text-secondary); line-height:1.7; margin:0; }\n.evidence-details{ margin-top:8px; }\n.evidence-details summary{ cursor:pointer; font-size:11.5px; color:var(--accent); font-weight:600; }\n.evidence-details summary:hover{ text-decoration:underline; }\n.evidence-list{ list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }\n.evidence-list li{ font-size:11.5px; color:var(--text-muted); line-height:1.6; padding-left:12px; position:relative; }\n.evidence-list li::before{ content:\"–\"; position:absolute; left:0; color:var(--text-muted); }\n\n.bullet-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }\n.bullet-list li{ display:flex; gap:8px; font-size:12.5px; color:var(--text-secondary); }\n.bullet-list li::before{ content:\"•\"; color:var(--accent); font-weight:700; flex:none; }\n\n.timeline{ display:flex; flex-direction:column; }\n.tl-item{ display:flex; gap:14px; padding-bottom:16px; position:relative; }\n.tl-item:last-child{ padding-bottom:0; }\n.tl-dot-col{ display:flex; flex-direction:column; align-items:center; flex:none; }\n.tl-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); margin-top:4px; flex:none; }\n.tl-date{ font-size:11px; font-weight:700; color:var(--accent); }\n.tl-title{ font-size:13px; font-weight:700; margin-top:2px; }\n.tl-desc{ font-size:12px; color:var(--text-muted); margin-top:2px; }\n\n/* survey form */\n.survey-q{ padding:14px 0; border-bottom:1px solid var(--border); }\n.survey-q:last-child{ border-bottom:none; }\n.survey-q .qtext{ font-size:13px; font-weight:600; margin-bottom:10px; }\n.likert{ display:flex; gap:8px; }\n.likert label{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:var(--text-muted); cursor:pointer; }\n.likert input{ width:16px; height:16px; accent-color:var(--accent); }\n\n/* student/mentor cards */\n.list-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:14px; }\n.ent center; }\n\n.toast{ position:fixed; bottom:22px; left:50%; transform:translate(-50%, 12px); opacity:0;\n  background:var(--text-primary); color:var(--bg); font-size:12.5px; font-weight:600;\n  padding:10px 16px; border-radius:999px; box-shadow:var(--shadow); pointer-events:none;\n  transition:opacity .18s ease, transform .18s ease; z-index:50; white-space:nowrap; }\n.toast.show{ opacity:1; transform:translate(-50%, 0); }\n\n.step-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }\n.step-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:15px; display:flex; flex-direction:column; gap:6px; }\n.step-num{ font-size:11px; font-weight:800; color:var(--accent); }\n.step-title{ font-size:13.5px; font-weight:700; }\n.step-desc{ font-size:12px; color:var(--text-secondary); }\n\n.form-actions{ display:flex; gap:10px; margin-top:16px; }\n.inline-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }\n.inline-form .field{ margin-bottom:0; flex:1; min-width:140px; }\n\n@media (max-width: 860px){\n  .stat-row{ grid-template-columns:repeat(2,1fr); }\n  .grid-2, .grid-2b{ grid-template-columns:1fr; }\n  .step-cards{ grid-template-columns:1fr; }\n  .list-cards{ grid-template-columns:1fr 1fr; }\n  .sidebar{ width:64px; }\n  .brand-text, .nav-item span, .who .meta{ display:none; }\n  .nav-item{ justify-content:center; }\n}\n";

    '시키지 않아도 스스로 {act} 관련 활동을 더 찾아본다.',
    '{act}에 대해 궁금한 점이 생기면 스스로 찾아본다.',
    '{act}를 계획을 세워 진행하는 것이 익숙하다.',
  ],
};
// Lesson plans (수업 지도안) are authored by the mentor teaching a program,
// one per session, and only count once admin has approved them — see
// renderMentorLessonPlans (authoring) and renderAdminLessonPlans (approval).
function programLessonPlans(programId){
  return (STATE.lessonPlans||[]).filter(lp => lp.programId === programId)
    .sort((a,b)=> (a.sessionNo||0) - (b.sessionNo||0) || new Date(a.submittedAt) - new Date(b.submittedAt));
}
function lessonPlan(id){ return (STATE.lessonPlans||[]).find(lp => lp.id === id) || null; }
// The most recent submission for one specific (program, session) pair —
// used to prefill a resubmission after a rejection.
function lessonPlanForSession(programId, sessionNo){
  const matches = programLessonPlans(programId).filter(lp => lp.sessionNo === sessionNo);
  return matches.length ? matches[matches.length-1] : null;
}
// Every 핵심 활동 keyword from this program's APPROVED lesson plans, merged
// and de-duplicated across sessions — the real, admin-reviewed curriculum
// content that drives programPerceptionItems() below. A pending or rejected
// plan's activities never leak into the survey until admin approves it.
function programApprovedActivities(programId){
  const acts = [];
  programLessonPlans(programId).filter(lp => lp.status === 'approved').forEach(lp => {
    (lp.activities||[]).forEach(a => { if (a && !acts.includes(a)) acts.push(a); });
  });
  return acts;
}
// Program-specific survey item set: item ids always match
// DEFAULT_PERCEPTION_ITEMS (so STATE.surveys keys stay stable across every
// program), only the displayed text changes based on that program's real,
// ADMIN-APPROVED curriculum. Falls back to the generic default text when a
// program has no approved lesson plan activities yet.
function programPerceptionItems(prog){
  const acts = prog ? programApprovedActivities(prog.id) : [];
  if (!acts.length) return DEFAULT_PERCEPTION_ITEMS;
  const out = {};
  COMP.forEach(c => {
    out[c.key] = ITEM_TEMPLATES[c.key].map((tpl, i) => ({
      id: DEFAULT_PERCEPTION_ITEMS[c.key][i].id,
      text: tpl.replace(/\{act\}/g, acts[i % acts.length]),
    }));
  });
  return out;
}
// A student's currently active mentor is now derived from their CURRENT
// program's assigned teacher, not a separate fixed pairing — a student may
// have had mentor01 for one program's cohort and mentor02 for the next.
function studentMentorId(studentId){
  const acc = STATE.accounts.find(a=>a.id===studentId);
  const pid = acc && acc.programId;
  const prog = pid ? program(pid) : null;
  return prog ? (prog.mentorId || null) : null;
}

const BEHAVIOR_PHRASES = {
  problem:'활동 기록과 사용 로그에서 문제 해결 시도 신호가 반복적으로 감지됨',
  creativity:'활동 기록에서 새로운 아이디어나 접근을 시도한 흔적이 반복적으로 감지됨',
  collab:'대화 참여 로그에서 다른 학생과 의견을 나누는 활동이 반복적으로 감지됨',
  self:'로그인 빈도와 활동 기록에서 스스로 참여를 이어가는 패턴이 반복적으로 감지됨',
};
// Keyword signals used by the rule-based journal analyzer below. A hit is a
// simple substring match against the student's own 탐구 저널 (activity log)
// text — transparent and inspectable, not a black box.
const JOURNAL_KEYWORDS = {
  problem:   ['다시 시도','다른 방법','전략을 바꿔','다르게 풀어','해결 방법을 바꿔','실패했지만','고쳐서','오류를 찾아','여러 번'],
  creativity:['새로운 아이디어','다르게 만들어','나만의 방법','색다른','독특한','기존과 다른','새롭게'],
  collab:    ['같이','팀원','도와','함께','나눠서','친구와','서로'],
  self:      ['스스로','혼자서','계획을 세워','더 해보고 싶어서','궁금해서 찾아','자발적으로','미리'],
};
const NEXT_STEP_BY_AREA = {
  self:      { title:'심화 탐구 프로젝트',       desc:'스스로 질문을 설계하고 답을 찾아가는 프로젝트형 학습' },
  collab:    { title:'팀 프로젝트 중심 활동',     desc:'또래와 역할을 나눠 함께 문제를 해결하는 협업 활동' },
  creativity:{ title:'오픈엔디드 메이커 프로젝트', desc:'정해진 답 없이 자유롭게 설계하고 만들어보는 활동' },
  problem:   { title:'단계별 챌린지 워크숍',      desc:'난이도가 점진적으로 올라가는 문제해결 챌린지' },
};

/* ---------------- write status / persistence ---------------- */
let writeStatus = 'idle'; // idle | saving | saved | readonly | offline
let artifactCap = null;
(async () => {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      artifactCap = await window.claude.use('artifact');
    }
  } catch(e) { artifactCap = null; }
  renderWriteStatus();
})();

function buildDoc(state){
  let w = TEMPLATE_JS.replace('__STATE_PLACEHOLDER__', () => JSON.stringify(state));
  w = w.replace('"__TEMPLATE_JS_PLACEHOLDER__"', () => JSON.stringify(TEMPLATE_JS));
  return '<!doctype html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>Nova Lab Growth System</title><style>' + CSS_TEXT + '</style></head>' +
    '<body><div id="root"></div><script>' + w + '</scr' + 'ipt></body></html>';
}

function replaceStateWith(newState){
  for (const k of Object.keys(STATE)) delete STATE[k];
  for (const k of Object.keys(newState)) STATE[k] = newState[k];
}
async function saveState(mutator){
  // mutator: function(draft) -> mutates a deep-cloned draft; returns nothing
  const draft = JSON.parse(JSON.stringify(STATE));
  mutator(draft);
  replaceStateWith(draft);
  render();
  if (!artifactCap){ writeStatus='offline'; renderWriteStatus(); return; }
  writeStatus = 'saving'; renderWriteStatus();
  stashNavState();
  try {
    await artifactCap.publish(buildDoc(STATE));
    writeStatus = 'saved'; renderWriteStatus();
  } catch(err){
    if (err && (err.code === 'not_writer' || err.code === 'not_granted' || err.code === 'not_declared')){
      writeStatus = 'readonly';
    } else if (err && err.code === 'conflict') {
      // another viewer's save is winning; the shell reloads this view automatically.
      writeStatus = 'saving';
    } else {
      writeStatus = 'offline';
    }
    renderWriteStatus();
  }
}

function renderWriteStatus(){
  const el = document.getElementById('write-status');
  if (!el) return;
  const map = {
    idle:   { text:'', cls:'' },
    saving: { text:'저장 중…', cls:'pill-muted' },
    saved:  { text:'저장됨', cls:'pill-good' },
    readonly:{ text:'읽기 전용 (편집 권한 없음)', cls:'pill-warn' },
    offline:{ text:'로컬에서만 실행 중 (공유 저장 안 됨)', cls:'pill-warn' },
  };
  const s = map[writeStatus] || map.idle;
  el.className = 'pill ' + s.cls;
  el.textContent = s.text;
  el.style.display = s.text ? 'inline-flex' : 'none';
}

/* ---------------- scoring engine ----------------
   Two independently real, auto-collected inputs feed the "행동 데이터"
   (behavior data) side of the Growth Report — no human rates a student:
     1) 탐구 저널 분석 — the student's own per-session activity log text,
        scored by a transparent keyword-hit rule (JOURNAL_KEYWORDS above).
     2) 플랫폼 사용 로그 — actual usage the system already records as a
        side effect of normal use: login days, messages the student sent,
        1:1 chats the student personally initiated.
   A mentor's note (STATE.mentorNotes) is qualitative context only and is
   never averaged into these numbers. */
function likertToScore(v){ return Math.round((v/5)*100); }

function program(programId){ return STATE.programs.find(p=>p.id===programId) || null; }
function currentProgramId(studentAcc){ return studentAcc && studentAcc.programId; }
function studentActivityLogs(studentId, programId){
  return (STATE.activityLogs[studentId]||[]).filter(l => !programId || l.programId === programId);
}
function studentMentorNotes(studentId, programId){
  return (STATE.mentorNotes[studentId]||[]).filter(l => !programId || l.programId === programId);
}
function studentPrograms(studentId){
  // every distinct program this student has any survey or activity data under, oldest first
  const ids = new Set();
  const s = STATE.surveys[studentId] || {};
  Object.keys(s).forEach(pid => ids.add(pid));
  (STATE.activityLogs[studentId]||[]).forEach(l => ids.add(l.programId));
  return [...ids].filter(Boolean).map(pid => program(pid)).filter(Boolean)
    .sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));
}
// Every program a student's Growth Report panel would render a block for —
// their full history plus their currently assigned program (even if it has
// no data yet) — used so admin-facing counts match what the detail panel shows.
function studentReportPrograms(studentId){
  const acc = STATE.accounts.find(a=>a.id===studentId);
  const pid = acc && acc.programId;
  const prog = pid ? program(pid) : null;
  const history = studentPrograms(studentId);
  return (pid && !history.some(p=>p.id===pid) && prog) ? [...history, prog] : history;
}
// Same list, named for its other use: which programs a student can pick
// from when choosing "어떤 수업" to write a 탐구 저널 entry or take a
// 성장 설문 for — their current class plus every past class they have any
// record under, so journal/survey are always attributed to the right
// program instead of assuming "whatever I'm assigned to right now".
function studentEligiblePrograms(studentId){ return studentReportPrograms(studentId); }
// How many of those are actually ready (data complete enough for a real
// Growth Report) — the number admin sees as "누적 성장 보고서" per student.
function studentReadyReportCount(studentId){
  return studentReportPrograms(studentId).filter(p => growthReport(studentId, p.id).ready).length;
}

function perceptionScore(studentId, programId, phase){
  const rec = STATE.surveys[studentId] && STATE.surveys[studentId][programId] && STATE.surveys[studentId][programId][phase];
  if (!rec) return null;
  const progItems = programPerceptionItems(program(programId));
  const out = {};
  for (const c of COMP){
    const items = progItems[c.key];
    const vals = items.map(it => rec[it.id]).filter(v => typeof v === 'number');
    if (vals.length < items.length) { out[c.key] = null; continue; }
    const avg = vals.reduce((a,b)=>a+b,0) / vals.length;
    out[c.key] = likertToScore(avg);
  }
  return out;
}
// Per-item pre/post answers for one competency — the raw evidence behind
// the aggregated perceptionScore, used to cite exactly which survey
// statement moved and by how much. Text reflects THIS program's own
// curriculum (see programPerceptionItems), not a generic form.
function perceptionItemDetail(studentId, programId, key){
  const preRec = STATE.surveys[studentId] && STATE.surveys[studentId][programId] && STATE.surveys[studentId][programId].pre;
  const postRec = STATE.surveys[studentId] && STATE.surveys[studentId][programId] && STATE.surveys[studentId][programId].post;
  const items = programPerceptionItems(program(programId))[key];
  return items.map(it => ({
    text: it.text,
    pre: preRec ? preRec[it.id] : null,
    post: postRec ? postRec[it.id] : null,
  }));
}
// Which of the student's own 탐구 저널 entries actually matched this
// competency's keyword list, and which words matched — the literal,
// inspectable evidence behind the journal-derived portion of the score.
function journalEvidence(studentId, programId, key){
  return studentActivityLogs(studentId, programId)
    .map(l => ({ sessionNo: l.sessionNo, ts: l.ts, text: l.text, matched: JOURNAL_KEYWORDS[key].filter(k => l.text.includes(k)) }))
    .filter(e => e.matched.length > 0);
}

function journalKeywordHits(text, key){
  if (!text) return 0;
  let hits = 0;
  JOURNAL_KEYWORDS[key].forEach(k => { if (text.includes(k)) hits++; });
  return hits;
}
// Baseline 50 (student engaged but no distinct signal detected) + 25 per
// average keyword hit per entry, capped at 100. Disclosed verbatim in the UI.
function journalScore(studentId, programId){
  const logs = studentActivityLogs(studentId, programId);
  if (!logs.length) return null;
  const out = {};
  for (const c of COMP){
    const totalHits = logs.reduce((sum,l) => sum + journalKeywordHits(l.text, c.key), 0);
    const density = totalHits / logs.length;
    out[c.key] = Math.min(100, Math.round(50 + density*25));
  }
  return out;
}
function loginDayCount(studentId){
  const acc = STATE.accounts.find(a=>a.id===studentId);
  if (!acc || !acc.loginLog) return 0;
  return new Set(acc.loginLog.map(ts => ts.slice(0,10))).size;
}
function sentMessageCount(studentId){
  let count = 0;
  Object.values(STATE.chats).forEach(c => {
    if (!c.participants || !c.participants.includes(studentId)) return;
    count += (c.messages||[]).filter(m=>m.sender===studentId).length;
  });
  return count;
}
function initiatedChatCount(studentId){
  return Object.values(STATE.chats).filter(c => c.requestedBy === studentId).length;
}
function usageScore(studentId){
  return {
    collab: Math.min(100, sentMessageCount(studentId) * 12),
    self:   Math.min(100, loginDayCount(studentId) * 10 + initiatedChatCount(studentId) * 15),
  };
}
// behaviorScore = the "AI 자동 수집 행동 데이터" — journal analysis for every
// competency, usage-log signal blended in only where a usage proxy exists
// (협업 = messages sent, 자기주도성 = login frequency + chats initiated).
function behaviorScore(studentId, programId){
  const j = journalScore(studentId, programId);
  if (!j) return null;
  const u = usageScore(studentId);
  return {
    problem: j.problem,
    creativity: j.creativity,
    collab: Math.round(0.7*j.collab + 0.3*u.collab),
    self: Math.round(0.7*j.self + 0.3*u.self),
  };
}

// Builds the detailed, evidence-cited analytical paragraph for one
// competency — every clause names a concrete, real data point (a specific
// survey item's before/after values, an actual journal quote and which
// keyword in it matched, real usage counts) rather than a generic template.
function competencyNarrative(c, before, after, delta, surveyItems, journalEv, usage){
  const dirText = delta > 0 ? `${delta}점 상승했습니다` : delta < 0 ? `${Math.abs(delta)}점 하락했습니다` : '거의 변화가 없었습니다';
  let s = `${c.label} 점수는 사전 ${before}점에서 사후(행동 데이터 반영) ${after}점으로 ${dirText}.`;

  const risen = surveyItems.filter(it => typeof it.pre === 'number' && typeof it.post === 'number' && it.post > it.pre);
  const flat = surveyItems.filter(it => typeof it.pre === 'number' && typeof it.post === 'number' && it.post === it.pre);
  if (risen.length) {
    const ex = risen.slice().sort((a,b)=>(b.post-b.pre)-(a.post-a.pre))[0];
    s += ` 인식 설문에서는 "${ex.text}" 문항이 ${ex.pre}점→${ex.post}점으로 오르는 등 ${surveyItems.length}개 문항 중 ${risen.length}개에서 응답이 상승했습니다.`;
  } else if (flat.length === surveyItems.length) {
    s += ` 인식 설문 3개 문항 모두 응답에 변화가 없었습니다.`;
  } else {
    s += ` 인식 설문 응답에는 뚜렷한 상승이 확인되지 않았습니다.`;
  }

  if (journalEv.length) {
    const uniqueKeywords = [...new Set(journalEv.flatMap(e => e.matched))];
    const quote = journalEv[0].text.length > 46 ? journalEv[0].text.slice(0, 46) + '…' : journalEv[0].text;
    s += ` 탐구 저널 ${journalEv.length}건에서 "${uniqueKeywords.slice(0,3).join('", "')}" 표현이 확인되어(예: ${journalEv[0].sessionNo}차시 — "${quote}") 실제 행동으로도 뒷받침됩니다.`;
  } else {
    s += ` 아직 탐구 저널에서는 이 역량과 관련된 표현이 확인되지 않았습니다.`;
  }

  if (usage) {
    s += ` 여기에 플랫폼 사용 로그(로그인 ${usage.days}일, 보낸 메시지 ${usage.msgs}건${usage.initiated ? ', 직접 개설한 대화 '+usage.initiated+'건' : ''})도 30% 비중으로 반영되었습니다.`;
  }
  return s;
}

function growthReport(studentId, programId){
  if (!programId) {
    return { ready:false, reason:'배정된 프로그램(학교·회차)이 없습니다. 관리자가 먼저 프로그램에 등록해야 합니다.' };
  }
  const pre = perceptionScore(studentId, programId, 'pre');
  const post = perceptionScore(studentId, programId, 'post');
  const beh = behaviorScore(studentId, programId);
  if (!pre || !post) {
    return { ready:false, pre, post, beh,
      reason: !pre ? '사전 설문이 아직 제출되지 않았습니다.' : '사후 설문이 아직 제출되지 않았습니다.' };
  }
  const usedBehavior = !!beh;
  const days = loginDayCount(studentId), msgs = sentMessageCount(studentId), initiated = initiatedChatCount(studentId);
  const comp = {};
  for (const c of COMP){
    const before = pre[c.key];
    const after = usedBehavior && beh[c.key] != null
      ? Math.round(0.5*post[c.key] + 0.5*beh[c.key])
      : post[c.key];
    const surveyItems = perceptionItemDetail(studentId, programId, c.key);
    const jEv = journalEvidence(studentId, programId, c.key);
    const usage = (c.key === 'collab' || c.key === 'self') ? { days, msgs, initiated } : null;
    comp[c.key] = {
      before, after, delta: after - before,
      surveyItems, journalEvidence: jEv, usage,
      narrative: competencyNarrative(c, before, after, after-before, surveyItems, jEv, usage),
    };
  }
  const ranked = [...COMP].map(c=>c.key).sort((a,b)=>comp[b].delta - comp[a].delta);
  const top1 = ranked[0], top2 = ranked[1], low = ranked[3];
  const sessionCount = studentActivityLogs(studentId, programId).length;
  const insight = `${compLabel(top1)} 행동과 ${compLabel(top2)} 행동이 뚜렷하게 증가했습니다` +
    `(${compLabel(top1)} ▲${comp[top1].delta}, ${compLabel(top2)} ▲${comp[top2].delta}). ` +
    `${BEHAVIOR_PHRASES[top1]}. 반면 ${compLabel(low)}은(는) 상대적으로 변화 폭이 작아(▲${comp[low].delta}) ` +
    `추가적인 경험이 필요합니다.` + (usedBehavior ? '' : ' (아직 활동 기록이 없어 인식 설문 결과만 반영된 값입니다.)');
  return { ready:true, comp, top1, top2, low, insight, usedBehavior, sessionCount };
}

function studentTimeline(studentId){
  const acc = STATE.accounts.find(a=>a.id===studentId);
  const items = [];
  if (acc) items.push({ ts: acc.createdAt, title:'학생 계정 등록', desc: acc.name + ' · ' + (acc.grade||'') + (acc.school? ' · '+acc.school : '') });
  const surveysByProgram = STATE.surveys[studentId] || {};
  Object.keys(surveysByProgram).forEach(pid => {
    const p = program(pid);
    const label = p ? `${p.school} · ${p.name}` : pid;
    if (surveysByProgram[pid].pre) items.push({ ts: surveysByProgram[pid].pre._submittedAt, title:'사전 설문 제출', desc: label });
    if (surveysByProgram[pid].post) items.push({ ts: surveysByProgram[pid].post._submittedAt, title:'사후 설문 제출', desc: label });
  });
  // group activity-journal entries by program+session for a compact history
  const logs = STATE.activityLogs[studentId] || [];
  const bySession = {};
  logs.forEach(l => {
    const key = l.programId + '::' + l.sessionNo;
    if (!bySession[key]) bySession[key] = { ...l, count:0 };
    bySession[key].count++;
    if (new Date(l.ts) > new Date(bySession[key].ts)) bySession[key].ts = l.ts;
  });
  Object.values(bySession).forEach(g => {
    const p = program(g.programId);
    items.push({ ts:g.ts, title:`${g.sessionNo}차시 탐구 저널 작성`, desc: p ? `${p.school} · ${p.name}` : '' });
  });
  return items.filter(i=>i.ts).sort((a,b)=> new Date(a.ts) - new Date(b.ts));
}
function fmtDate(ts){
  if (!ts) return '';
  const d = new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function accountName(id){ const a = STATE.accounts.find(x=>x.id===id); return a ? a.name : '알 수 없음'; }
function chatKey(a,b){ return [a,b].sort().join('::'); }
function getChat(a,b){
  return STATE.chats[chatKey(a,b)] || { status:'none', requestedBy:null, participants:[a,b], messages:[] };
}
function studentSurveyDone(studentId, phase){
  const acc = STATE.accounts.find(a=>a.id===studentId);
  const pid = acc && acc.programId;
  return !!(pid && STATE.surveys[studentId] && STATE.surveys[studentId][pid] && STATE.surveys[studentId][pid][phase]);
}

/* ---------------- small UI helpers ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function barChart(pairs, {height=150}={}){
  const max = 100;
  let html = `<div class="chart">`;
  pairs.forEach(p=>{
    const preH = Math.round((p.pre/max)*height);
    const postH = Math.round((p.post/max)*height);
    html += `<div class="chart-group">
      <div class="chart-bars">
        <div class="bar" style="height:${preH}px;background:var(--before-fill)" title="${esc(p.label)} 교육 전 ${p.pre}점"><span class="bar-value" style="color:var(--text-muted)">${p.pre}</span></div>
        <div class="bar" style="height:${postH}px;background:var(${p.color})" title="${esc(p.label)} 교육 후 ${p.post}점"><span class="bar-value">${p.post}</span></div>
      </div>
      <div class="chart-delta">▲${p.post-p.pre}</div>
      <div class="chart-label">${esc(p.label)}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function legendHtml(){
  let html = `<div class="legend"><div class="legend-item"><span class="legend-swatch" style="background:var(--before-fill)"></span>교육 전</div>`;
  COMP.forEach(c=>{ html += `<div class="legend-item"><span class="legend-swatch" style="background:var(${c.color})"></span>${c.label} · 교육 후</div>`; });
  html += `</div>`;
  return html;
}

  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="login-wrap">

          <div class="mark"></div>

        <div class="field"><label>비밀번호</label><input id="login-pw" type="password" autocomplete="current-password" /></div>
        <button class="btn btn-primary btn-block" id="login-btn">로그인</button>

      </div>

  const doLogin = () => {
    const id = document.getElementById('login-id').value.trim();
    const pw = document.getElementById('login-pw').value;
    const acc = STATE.accounts.find(a => a.id === id && a.pw === pw);
    const slot = document.getElementById('login-error-slot');
    if (!acc) { slot.innerHTML = `<div class="login-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>`; return; }
    session = { accountId: acc.id };
    persistSession();
    resetNavState();
    // Real, automatic usage telemetry: every login is timestamped on the
    // shared account record — this is part of what feeds a student's
    // auto-collected "자기주도성" behavior signal (see loginDayCount above).
    saveState(d => {
      const a = d.accounts.find(x=>x.id===acc.id);
      if (!a.loginLog) a.loginLog = [];
      a.loginLog.push(new Date().toISOString());
    });
  };
  document.getElementById('login-btn').addEventListener('click', doLogin);
  root.querySelectorAll('#login-id, #login-pw').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));

  session = { accountId: null };
  persistSession();
  resetNavState();
  render();
}

// Shared detailed lesson-plan card — used both in the mentor's own
// submission history and the admin approval queue, so both sides see
// exactly the same real-lesson-plan-format content (주제·소요시간·대상·
// 학습목표·준비물·도입-전개-정리·제안된 수강 학생).
// A stage's total minutes, derived from its own rows' time ranges (never
// entered by hand) — mirrors the real-world 지도안 convention of writing
// "도입(15')" next to the stage name, computed from what was actually
// timed inside it.
function stageDurationMin(rows){
  if (!rows || !rows.length) return 0;
  const starts = rows.map(r=>Number(r.start)||0);
  const ends = rows.map(r=>Number(r.end)||0);
  return Math.max(0, Math.max(...ends) - Math.min(...starts));
}
function renderLessonPlanCard(lp, opts){
  opts = opts || {};
  const mentor = STATE.accounts.find(a=>a.id===lp.mentorId);
  const prog = program(lp.programId);
  const statusPill = lp.status==='approved' ? '<span class="pill pill-good">승인됨</span>'
    : lp.status==='rejected' ? '<span class="pill pill-critical">반려됨</span>'
    : '<span class="pill pill-warn">승인 대기</span>';
  const stages = lp.stages || [];
  // 준비물 now lives per-activity-row (matching the real table format) —
  // roll up every distinct one mentioned anywhere in the plan for the
  // summary chip row.
  const allMaterials = [];
  stages.forEach(s => (s.rows||[]).forEach(r => { if (r.materials && !allMaterials.includes(r.materials)) allMaterials.push(r.materials); }));
  return `<div class="panel">
    <div class="panel-head">
      <div><span class="eyebrow">${lp.sessionNo}차시 지도안</span><h2>${esc(lp.topic||'(주제 미입력)')}</h2></div>
      <div class="hint">${statusPill}</div>
    </div>
    <div class="chip-row">
      ${prog ? `<span class="tag">${esc(prog.school)} · ${esc(prog.name)}</span>` : ''}
      ${mentor ? `<span class="tag">작성: ${esc(mentor.name)} 멘토</span>` : ''}
      <span class="tag">${lp.durationMin ? lp.durationMin+'분' : '시간 미입력'}</span>
      <span class="tag">대상: ${esc(lp.audience||'미입력')}</span>
      <span class="tag">제안된 수강 학생 ${(lp.studentIds||[]).length}명</span>
    </div>
    <div class="grid-2b" style="margin-top:14px;">
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;">학습 목표</div>
        <ul class="evidence-list" style="gap:6px;">${(lp.objectives||[]).length ? lp.objectives.map(o=>`<li>${esc(o)}</li>`).join('') : '<li>-</li>'}</ul>
      </div>
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;">준비물</div>
        <div class="chip-row">${allMaterials.length ? allMaterials.map(m=>`<span class="tag">${esc(m)}</span>`).join('') : '<span class="tag">-</span>'}</div>
        <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin:12px 0 6px;">핵심 활동 (승인 시 설문 문항에 반영)</div>
        <div class="chip-row">${(lp.activities||[]).length ? lp.activities.map(a=>`<span class="tag">${esc(a)}</span>`).join('') : '<span class="tag">-</span>'}</div>
      </div>
    </div>
    <div style="margin-top:16px;">
      ${['도입','전개','정리'].map(stageName => {
        const s = stages.find(x=>x.stage===stageName) || { stage: stageName, rows: [] };
        return `<div style="margin-bottom:14px;">
          <div style="font-size:12.5px;font-weight:700;margin-bottom:6px;">${esc(s.stage)} <span style="color:var(--text-muted);font-weight:400;">(${stageDurationMin(s.rows)}′)</span></div>
          ${(s.rows||[]).length ? s.rows.map(r => `
            <div class="analysis-item" style="margin-bottom:6px;">
              <div class="analysis-head"><b>${esc(String(r.start))}′-${esc(String(r.end))}′ &nbsp; ${esc(r.label||'(활동명 미입력)')}</b></div>
              <div class="grid-2b" style="margin-top:4px;">

            </div>`).join('') : '<div class="hint">입력된 활동이 없습니다.</div>'}
        </div>`;
      }).join('')}

    ${opts.canDecide && lp.status==='pending' ? `
    <div class="form-actions">

    </div>` : ''}

}
// Admin approval queue — a submitted lesson plan is not "정규 교육" until
// approved here: approval both marks the plan approved (its 핵심 활동 then
// feed programPerceptionItems) AND enrolls every proposed student into the
// program (sets their programId), matching "학생들도 다 선택하면 ... 승인을
// 받아야지만 정규 교육이 되도록" exactly.
function renderAdminLessonPlans(el){
  const plans = (STATE.lessonPlans||[]).slice().sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  const pending = plans.filter(p=>p.status==='pending');
  const decided = plans.filter(p=>p.status!=='pending');
  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-tile"><div class="label">승인 대기</div><div class="value">${pending.length}건</div><div class="sub ${pending.length?'':'muted'}">${pending.length?'검토가 필요합니다':'없음'}</div></div>
      <div class="stat-tile"><div class="label">승인됨</div><div class="value">${plans.filter(p=>p.status==='approved').length}건</div><div class="sub muted">누적</div></div>
      <div class="stat-tile"><div class="label">반려됨</div><div class="value">${plans.filter(p=>p.status==='rejected').length}건</div><div class="sub muted">누적</div></div>
    </div>
    <div class="panel"><div class="panel-head"><div><span class="eyebrow">PENDING</span><h2>승인 대기 중인 지도안 (${pending.length}건)</h2></div></div>
      ${pending.length===0 ? `<div class="empty-state">현재 승인 대기 중인 지도안이 없습니다.</div>` : ''}
    </div>
    ${pending.map(lp=>renderLessonPlanCard(lp, {canDecide:true})).join('')}
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">HISTORY</span><h2>처리된 지도안 (${decided.length}건)</h2></div></div>
      ${decided.length===0 ? `<div class="empty-state">아직 처리된 지도안이 없습니다.</div>` : `
      <div class="table-wrap"><table>
        <thead><tr><th>프로그램</th><th>차시</th><th>주제</th><th>작성 멘토</th><th>결과</th><th>처리일</th></tr></thead>
        <tbody>${decided.map(lp=>{
          const prog = program(lp.programId); const mentor = STATE.accounts.find(a=>a.id===lp.mentorId);
          return `<tr><td>${prog?esc(prog.school+' · '+prog.name):'-'}</td><td>${lp.sessionNo}차시</td><td>${esc(lp.topic)}</td><td>${mentor?esc(mentor.name):'-'}</td>
            <td>${lp.status==='approved'?'<span class="pill pill-good">승인됨</span>':'<span class="pill pill-critical">반려됨</span>'}</td><td>${lp.decidedAt?fmtDate(lp.decidedAt):'-'}</td></tr>`;
        }).join('')}</tbody>
      </table></div>`}
    </div>`;
  el.querySelectorAll('.approve-plan-btn').forEach(btn => btn.addEventListener('click', () => {
    saveState(d => {
      const lp = (d.lessonPlans||[]).find(x=>x.id===btn.dataset.id);
      if (!lp) return;
      lp.status = 'approved'; lp.decidedAt = new Date().toISOString(); lp.decidedBy = currentAccount().id;
      (lp.studentIds||[]).forEach(sid => {
        const acc = d.accounts.find(a=>a.id===sid);
        if (acc) acc.programId = lp.programId;
      });
    });
    toast('지도안을 승인했습니다. 제안된 학생들이 정규 등록되고, 설문 문항에도 반영됩니다.');
  }));
  el.querySelectorAll('.reject-plan-btn').forEach(btn => btn.addEventListener('click', () => {
    saveState(d => {
      const lp = (d.lessonPlans||[]).find(x=>x.id===btn.dataset.id);
      if (lp) { lp.status = 'rejected'; lp.decidedAt = new Date().toISOString(); lp.decidedBy = currentAccount().id; }
    });
    toast('지도안을 반려했습니다. 담당 멘토가 수정하여 다시 제출할 수 있습니다.');
  }));
}

function renderAdminSafety(el){
  const entries = Object.keys(STATE.chats).map(key => {
    const c = STATE.chats[key];
    const parts = c.participants || key.split('::');
    return { key, chat:c, a:parts[0], b:parts[1] };
  }).filter(e => e.chat.status !== 'none');
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">SAFETY</span><h2>전체 1:1 대화 모니터링</h2></div><div class="hint">진행 중이거나 대기 중인 대화 ${entries.length}건</div></div>
      ${entries.length===0 ? `<div class="empty-state">현재 진행 중이거나 대기 중인 대화가 없습니다.</div>` : `
      <div class="list-cards">
        ${entries.map(e=>{
          const nameA = accountName(e.a), nameB = accountName(e.b);
          const statusLabel = e.chat.status==='pending' ? '요청 대기' : '대화 중';
          const active = currentAdminSafetyChat === e.key;
          return `<div class="entity-card safety-card" data-key="${e.key}" style="cursor:pointer;${active?'outline:2px solid var(--accent);':''}">
            <div class="head"><div class="avatar">${icon('chat')}</div><div><div class="id">${esc(nameA)} · ${esc(nameB)}</div><div class="grade">${statusLabel} · 메시지 ${e.chat.messages.length}건</div></div></div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
    ${currentAdminSafetyChat ? `<div class="panel"><div class="panel-head"><h2>대화 내용 (읽기 전용)</h2></div><div id="safety-chat-slot"></div></div>` : ''}
  `;
  el.querySelectorAll('.safety-card').forEach(card => card.addEventListener('click', () => {
    currentAdminSafetyChat = (currentAdminSafetyChat === card.dataset.key) ? null : card.dataset.key;
    render();
  }));
  if (currentAdminSafetyChat){
    const e = entries.find(x=>x.key===currentAdminSafetyChat);
    const slot = document.getElementById('safety-chat-slot');
    if (e && slot) renderChatPanel(slot, e.a, e.b, { readOnly:true });
  }
}

// One detailed, evidence-cited Growth Report block for a single program
// participation — used once per historical program so a student who has
// been through the program more than once gets a report for each time.
function renderGrowthReportBlock(prog, rep, ordinalNum, totalCount, isLatest){
  const progLabel = prog ? `${esc(prog.school)} · ${esc(prog.name)}` : '프로그램 정보 없음';
  const showOrdinal = totalCount > 1;
  const ordinalTitle = showOrdinal ? `${ordinalNum}번째 성장 보고서` : '성장 보고서';
  const eyebrow = showOrdinal ? `GROWTH REPORT · ${ordinalNum} / ${totalCount}` : 'GROWTH REPORT';
  if (!rep.ready){
    return `<div class="panel">
      <div class="panel-head"><div><span class="eyebrow">${eyebrow}</span><h2>${ordinalTitle}${isLatest && showOrdinal ? ' <span class=\"badge-latest\">최신</span>' : ''}</h2></div><div class="hint">${progLabel}</div></div>
      <div class="empty-state">${esc(rep.reason)} 데이터가 모이면 이 화면에 실제 Growth Report가 자동으로 계산되어 표시됩니다.</div>
    </div>`;
  }
  return `<div class="panel">
    <div class="panel-head"><div><span class="eyebrow">${eyebrow}</span><h2>${ordinalTitle}${isLatest && showOrdinal ? ' <span class=\"badge-latest\">최신</span>' : ''}</h2></div><div class="hint">${esc(progLabel)} · 탐구 저널 ${rep.sessionCount}건 기반</div></div>
    ${barChart(COMP.map(c=>({label:c.label, pre:rep.comp[c.key].before, post:rep.comp[c.key].after, color:c.color})))}
    ${legendHtml()}
    <div class="insight-box" style="margin-top:14px;">${esc(rep.insight)}</div>
    <div class="analysis-list">
      ${COMP.map(c=>{
        const cc = rep.comp[c.key];
        const hasEvidence = cc.surveyItems.length || cc.journalEvidence.length;
        return `
        <div class="analysis-item">
          <div class="analysis-head"><span class="dot" style="background:var(${c.color})"></span><b>${c.label}</b><span class="analysis-score">${cc.before} → ${cc.after} (▲${cc.delta})</span></div>
          <p class="analysis-text">${esc(cc.narrative)}</p>
          ${hasEvidence ? `
          <details class="evidence-details">
            <summary>근거 데이터 보기</summary>
            <ul class="evidence-list">
              ${cc.surveyItems.map(it=>`<li>설문: "${esc(it.text)}" ${it.pre ?? '-'}점 → ${it.post ?? '-'}점</li>`).join('')}
              ${cc.journalEvidence.map(e=>`<li>${e.sessionNo}차시 저널: "${esc(e.text)}" — 감지된 표현: ${e.matched.map(k=>esc(k)).join(', ')}</li>`).join('')}
            </ul>
          </details>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="formula-box">산출 방식: 교육 후 점수 = 사후 인식 설문 50% + AI 자동 수집 행동 데이터 50% ${rep.usedBehavior ? '(탐구 저널 분석 + 플랫폼 사용 로그, 사람이 채점하지 않음)' : '(아직 활동 기록이 없어 사후 인식 설문만 반영됨)'}</div>
  </div>`;
}
// A compact longitudinal view across every program the student has a ready
// report for, so admin/mentor/student can see accumulated growth over
// repeated participations, not just the latest snapshot.
function renderGrowthTrendBlock(readyReports){
  const first = readyReports[0], last = readyReports[readyReports.length-1];
  return `<div class="panel">
    <div class="panel-head"><div><span class="eyebrow">TREND</span><h2>프로그램별 성장 추이</h2></div><div class="hint">참여 ${readyReports.length}개 프로그램의 교육 후 점수 변화</div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>프로그램</th>${COMP.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
      <tbody>
        ${readyReports.map(r=>`<tr><td>${esc(r.program.school)} · ${esc(r.program.name)}</td>${COMP.map(c=>`<td>${r.rep.comp[c.key].after}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table></div>
    <div class="formula-box">첫 참여 대비 최신 프로그램: ${COMP.map(c=>{
      const d = last.rep.comp[c.key].after - first.rep.comp[c.key].after;
      return `${c.label} ${d>=0?'▲':'▼'}${Math.abs(d)}`;
    }).join(' · ')}</div>
  </div>`;
}

function renderStudentDetailPanel(el, s, opts){
  const pid = currentProgramId(s);
  const prog = program(pid);
  // Mentor is derived from the student's CURRENT program, not a fixed
  // pairing — the same student can have a different mentor next program.
  const mentor = prog && prog.mentorId ? STATE.accounts.find(m=>m.id===prog.mentorId) : null;
  const timeline = studentTimeline(s.id);
  const history = studentPrograms(s.id); // every program w/ any data, oldest first

  // One report per historical program; also surface the currently assigned
  // program even if it has no data yet, so it shows a "not ready" card.
  const reportPrograms = (pid && !history.some(p=>p.id===pid) && prog) ? [...history, prog] : history;
  const reports = reportPrograms.map(p => ({ program:p, rep: growthReport(s.id, p.id) }));
  const readyReports = reports.filter(r => r.rep.ready);
  const latest = readyReports.length ? readyReports[readyReports.length-1] : (reports.length ? reports[reports.length-1] : null);

  let html = `
    <div class="panel">
      <div class="panel-head">
        <div><span class="eyebrow">STUDENT</span><h2>${esc(s.name)} · ${esc(s.grade||'')}</h2></div>
        <div class="hint">담당 멘토: ${mentor ? esc(mentor.name) : '미배정'}</div>
      </div>
      <div class="chip-row">
        ${s.school ? `<span class="tag">${esc(s.school)}</span>` : ''}
        ${prog ? `<span class="tag">${esc(prog.name)}</span>` : `<span class="tag" style="color:var(--critical)">프로그램 미배정</span>`}
        ${(s.interests||[]).map(i=>`<span class="tag">${esc(i)}</span>`).join('')}
      </div>
    </div>
  `;

  if (reports.length === 0){
    html += `<div class="panel"><div class="panel-head"><div><span class="eyebrow">GROWTH REPORT</span><h2>교육 전 · 후 비교</h2></div></div><div class="empty-state">배정된 프로그램(학교·회차)이 없습니다. 관리자가 먼저 프로그램에 등록해야 합니다.</div></div>`;
  } else {
    reports.forEach((r, idx) => {
      html += renderGrowthReportBlock(r.program, r.rep, idx+1, reports.length, idx===reports.length-1);
    });
  }
  if (readyReports.length >= 2) html += renderGrowthTrendBlock(readyReports);

  const rep = latest ? latest.rep : { ready:false };
  html += `
    <div class="grid-2b">
      <div class="panel">
        <div class="panel-head"><h2>Growth Profile</h2><div class="hint">${latest && reports.length>1 ? '최신 참여 프로그램 기준' : ''}</div></div>
        ${rep.ready ? COMP.map(c=>`
          <div class="meter-row">
            <div class="meter-label">${c.label}</div>
            <div class="meter-track"><div class="meter-fill" style="width:${rep.comp[c.key].after}%; background:var(${c.color})"></div></div>
            <div class="meter-value">${rep.comp[c.key].after}</div>
            <div class="meter-delta">▲${rep.comp[c.key].delta}</div>
          </div>`).join('') : `<div class="empty-state">아직 표시할 성장 데이터가 없습니다.</div>`}
      </div>
      <div class="panel">
        <div class="panel-head"><h2>활동 이력</h2><div class="hint">참여 프로그램 ${history.length}개</div></div>
        ${timeline.length===0 ? `<div class="empty-state">기록된 활동이 없습니다.</div>` : `
        <div class="timeline">
          ${timeline.map(t=>`<div class="tl-item"><div class="tl-dot-col"><div class="tl-dot"></div></div>
            <div><div class="tl-date">${fmtDate(t.ts)}</div><div class="tl-title">${esc(t.title)}</div><div class="tl-desc">${esc(t.desc)}</div></div></div>`).join('')}
        </div>`}
      </div>
    </div>
    ${rep.ready ? `
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">NEXT STEP</span><h2>추천 경험</h2></div></div>
      <div class="step-cards">
        <div class="step-card"><div class="step-num">STEP 1</div><div class="step-title">${NEXT_STEP_BY_AREA[rep.low].title}</div><div class="step-desc">${NEXT_STEP_BY_AREA[rep.low].desc}</div></div>
        <div class="step-card"><div class="step-num">STEP 2</div><div class="step-title">청년 강사 멘토링</div><div class="step-desc">${esc((s.interests&&s.interests[0])||'관심 분야')} 관련 대화를 멘토와 이어갑니다</div></div>
        <div class="step-card"><div class="step-num">STEP 3</div><div class="step-title">${esc((s.interests&&s.interests[0])||'관심 분야')} 연계 프로그램</div><div class="step-desc">관심 분야와 직접 연결된 후속 프로그램 추천</div></div>
      </div>
    </div>` : ''}
  `;
  // AI 자동 수집 행동 데이터 — read-only for everyone (admin, mentor, student
  // themselves). Nobody rates this; it's computed from the student's own
  // 탐구 저널 entries and real platform usage (see behaviorScore above).
  if (pid){
    const jlogs = studentActivityLogs(s.id, pid);
    const beh = behaviorScore(s.id, pid);
    const days = loginDayCount(s.id), msgs = sentMessageCount(s.id), initiated = initiatedChatCount(s.id);
    html += `
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">AI DETECTED</span><h2>AI 자동 수집 행동 데이터</h2></div><div class="hint">탐구 저널 ${jlogs.length}건 · 사람이 채점하지 않음</div></div>
      ${!beh ? `<div class="empty-state">아직 탐구 저널 기록이 없어 행동 데이터를 산출할 수 없습니다. 학생이 '탐구 저널'에 활동을 기록하면 자동으로 계산됩니다.</div>` : `
      ${COMP.map(c=>`
        <div class="meter-row">
          <div class="meter-label">${c.label}</div>
          <div class="meter-track"><div class="meter-fill" style="width:${beh[c.key]}%; background:var(${c.color})"></div></div>
          <div class="meter-value">${beh[c.key]}</div>
        </div>`).join('')}
      <div class="formula-box">근거 데이터: 탐구 저널 키워드 분석(전 역량) + 로그인 ${days}일 · 보낸 메시지 ${msgs}건 · 직접 개설한 대화 ${initiated}건 (협업·자기주도성에 반영)</div>`}
    </div>`;
  }
  // 멘토 서포팅 노트 — qualitative only, never averaged into the score above.
  if (opts.canAddMentorNote || pid){
    const notes = pid ? studentMentorNotes(s.id, pid) : [];
    const nextSession = notes.length ? Math.max(...notes.map(n=>n.sessionNo||1)) + 1 : 1;
    const notesList = notes.length ? `<div class="table-wrap" style="margin-top:14px;"><table>
      <thead><tr><th>차시</th><th>날짜</th><th>작성 멘토</th><th>내용</th></tr></thead>
      <tbody>${notes.slice().reverse().map(n=>`<tr><td>${n.sessionNo}차시</td><td>${fmtDate(n.ts)}</td><td>${esc(accountName(n.mentorId))}</td><td>${esc(n.text)}</td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="empty-state">${opts.canAddMentorNote ? '아직 남긴 서포팅 노트가 없습니다.' : '아직 멘토가 남긴 서포팅 노트가 없습니다.'}</div>`;
    html += `
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">SUPPORTING</span><h2>멘토 서포팅 노트</h2></div><div class="hint">참고용 정성 기록 · 점수에는 반영되지 않음</div></div>
      ${!pid ? `<div class="empty-state">이 학생은 아직 프로그램(학교·회차)에 배정되지 않았습니다.</div>` :
        opts.canAddMentorNote ? `
      <form id="mentor-note-form">
        <div class="field" style="max-width:160px;"><label>몇 차시 수업인가요?</label><input type="number" min="1" id="note-session" value="${nextSession}" /></div>
        <div class="field"><label>관찰 내용</label><textarea id="note-text" placeholder="이번 차시에 눈에 띈 점을 자유롭게 적어주세요 (예: 오늘 유독 적극적으로 질문했어요)"></textarea></div>
        <button type="submit" class="btn btn-primary">서포팅 노트 저장</button>
      </form>
      ${notesList}` : notesList}
    </div>`;
  }
  if (opts.canChat || opts.canViewChatReadOnly){
    const mentorForChat = mentor;
    html += `<div class="panel"><div class="panel-head"><div><span class="eyebrow">${opts.canViewChatReadOnly?'SAFETY VIEW':'1:1'}</span><h2>${esc(s.name)} 학생 ${mentorForChat? '· '+esc(mentorForChat.name)+' 멘토':''} 대화${opts.canViewChatReadOnly?' (안전 모니터링, 읽기 전용)':''}</h2></div></div><div id="chat-slot"></div></div>`;
  }
  el.innerHTML = html;

  if (opts.canAddMentorNote && pid){
    document.getElementById('mentor-note-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('note-text').value.trim();
      const sessionNo = Number(document.getElementById('note-session').value) || 1;
      if (!text) { toast('내용을 입력해주세요.'); return; }
      saveState(d => {
        if (!d.mentorNotes[s.id]) d.mentorNotes[s.id] = [];
        d.mentorNotes[s.id].push({ ts: new Date().toISOString(), programId: pid, sessionNo, mentorId: opts.viewerAccount.id, text });
      });
      toast(`${sessionNo}차시 서포팅 노트가 저장되었습니다.`);
    });
  }
  if (opts.canChat && mentor){
    renderChatPanel(document.getElementById('chat-slot'), s.id, mentor.id, { viewerId: opts.viewerAccount.id, readOnly:false });
  } else if (opts.canViewChatReadOnly && mentor){
    renderChatPanel(document.getElementById('chat-slot'), s.id, mentor.id, { readOnly:true });
  } else if ((opts.canChat || opts.canViewChatReadOnly) && !mentor) {
    const slot = document.getElementById('chat-slot');
    if (slot) slot.innerHTML = `<div class="empty-state">멘토가 아직 배정되지 않아 대화가 없습니다.</div>`;
  }
}

/* ================= chat =================
   Generalized to an arbitrary pair of accounts so the same mechanism covers
   student↔mentor 1:1 chat, student↔student peer chat, and an admin
   read-only safety view over any thread. Threads are keyed by the two
   participant ids (sorted), never by "studentId" alone. */
function renderChatPanel(el, participantA, participantB, opts){
  opts = opts || {};
  const readOnly = !!opts.readOnly;
  const viewerId = opts.viewerId;
  const key = chatKey(participantA, participantB);
  const chat = STATE.chats[key] || { status:'none', requestedBy:null, participants:[participantA,participantB], messages:[] };

  if (readOnly){
    const nameA = accountName(participantA), nameB = accountName(participantB);
    if (chat.status === 'none'){
      el.innerHTML = `<div class="empty-state">${esc(nameA)}님과 ${esc(nameB)}님은 아직 대화를 시작하지 않았습니다.</div>`;
      return;
    }
    if (chat.status === 'pending'){
      el.innerHTML = `<div class="empty-state">대화 요청이 대기 중입니다 (${esc(accountName(chat.requestedBy))}님이 요청함, 아직 수락되지 않음).</div>`;
      return;
    }
    el.innerHTML = `<div class="chat-wrap">
      <div class="chat-log">
        ${chat.messages.length===0 ? `<div class="chat-empty">아직 주고받은 메시지가 없습니다.</div>` :
          chat.messages.map(m=>`<div class="chat-msg them" style="margin-left:0;max-width:100%;"><b>${esc(accountName(m.sender))}</b> · ${esc(m.text)}<div class="meta">${fmtDateTime(m.ts)}</div></div>`).join('')}
      </div>
    </div>`;
    return;
  }

  const otherId = viewerId === participantA ? participantB : participantA;
  const otherName = accountName(otherId);

  if (chat.status === 'none'){
    el.innerHTML = `<div class="chat-request-box"><p>${esc(otherName)}님과 아직 대화를 시작하지 않았습니다.</p>
      <button class="btn btn-primary" id="chat-request-btn">1:1 대화 요청 보내기</button></div>`;
    document.getElementById('chat-request-btn').addEventListener('click', () => {
      saveState(d => { d.chats[key] = { status:'pending', requestedBy: viewerId, participants:[participantA,participantB], messages: (d.chats[key]&&d.chats[key].messages)||[] }; });
      toast('대화 요청을 보냈습니다.');
    });
    return;
  }
  if (chat.status === 'pending'){
    if (chat.requestedBy === viewerId){
      el.innerHTML = `<div class="chat-request-box"><p>${esc(otherName)}님에게 대화 요청을 보냈습니다. 수락을 기다리는 중입니다.</p>
        <button class="btn btn-ghost" id="chat-cancel-btn">요청 취소</button></div>`;
      document.getElementById('chat-cancel-btn').addEventListener('click', () => {
        saveState(d => { d.chats[key] = { status:'none', requestedBy:null, participants:[participantA,participantB], messages: chat.messages }; });
      });
    } else {
      el.innerHTML = `<div class="chat-request-box"><p>${esc(otherName)}님이 1:1 대화를 요청했습니다.</p>
        <div class="pending-row"><button class="btn btn-primary" id="chat-accept-btn">수락</button><button class="btn btn-ghost" id="chat-decline-btn">거절</button></div></div>`;
      document.getElementById('chat-accept-btn').addEventListener('click', () => {
        saveState(d => { d.chats[key].status = 'active'; });
        toast('대화가 시작되었습니다.');
      });
      document.getElementById('chat-decline-btn').addEventListener('click', () => {
        saveState(d => { d.chats[key] = { status:'none', requestedBy:null, participants:[participantA,participantB], messages: chat.messages }; });
      });
    }
    return;
  }
  // active
  el.innerHTML = `
    <div class="chat-wrap">
      <div class="chat-log" id="chat-log">
        ${chat.messages.length===0 ? `<div class="chat-empty">${esc(otherName)}님과의 대화가 시작되었습니다. 첫 메시지를 보내보세요.</div>` :
          chat.messages.map(m => `<div class="chat-msg ${m.sender===viewerId?'me':'them'}">${esc(m.text)}<div class="meta">${fmtDateTime(m.ts)}</div></div>`).join('')}
      </div>
      <div class="chat-compose">
        <input id="chat-input" placeholder="메시지를 입력하세요" />
        <button class="btn btn-primary" id="chat-send-btn">보내기</button>
      </div>
    </div>`;
  const logEl = document.getElementById('chat-log');
  logEl.scrollTop = logEl.scrollHeight;
  const send = () => {
    const inp = document.getElementById('chat-input');
    const text = inp.value.trim();
    if (!text) return;
    saveState(d => {
      if (!d.chats[key]) d.chats[key] = { status:'active', requestedBy:null, participants:[participantA,participantB], messages:[] };
      d.chats[key].messages.push({ sender: viewerId, text, ts: new Date().toISOString() });
    });
  };
  document.getElementById('chat-send-btn').addEventListener('click', send);
  document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key==='Enter') send(); });
}
function fmtDateTime(ts){
  if (!ts) return '';
  const d = new Date(ts);
  const h = String(d.getHours()).padStart(2,'0'); const m = String(d.getMinutes()).padStart(2,'0');
  return `${fmtDate(ts)} ${h}:${m}`;
}

/* ================= MENTOR ================= */
// Chat threads this mentor is part of with students who are NOT currently
// assigned to them — e.g. a student they mentored in an earlier program
// (now reassigned to someone else), or a student who cold-requested a chat
// with this mentor without ever taking their class. Mentors are always
// reachable, not just by their current roster, so these need their own list.
function otherChatThreads(mentorId, excludeStudentIds){
  const out = [];
  Object.keys(STATE.chats).forEach(key => {
    const c = STATE.chats[key];
    if (!c || c.status === 'none') return;
    const parts = c.participants || key.split('::');
    if (!parts.includes(mentorId)) return;
    const studentId = parts.find(p => p !== mentorId);
    const sAcc = STATE.accounts.find(a => a.id === studentId);
    if (!sAcc || sAcc.role !== 'student') return;
    if (excludeStudentIds.has(studentId)) return;
    out.push({ studentId, chat: c });
  });
  return out;
}
function renderMentorView(el, acc){
  if (currentView === 'lessonplan-author') return renderMentorLessonPlans(el, acc);
  if (currentMentorStudent) return renderMentorStudentDetail(el, acc);
  if (currentMentorOtherChat) return renderMentorOtherChatDetail(el, acc);
  const myStudents = STATE.accounts.filter(a => a.role==='student' && studentMentorId(a.id) === acc.id);
  const myIds = new Set(myStudents.map(s=>s.id));
  const others = otherChatThreads(acc.id, myIds);
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">MY STUDENTS</span><h2>담당 학생 (${myStudents.length}명)</h2></div></div>
      ${myStudents.length===0 ? `<div class="empty-state">아직 배정된 학생이 없습니다. 관리자에게 배정을 요청하세요.</div>` : `
      <div class="list-cards">
        ${myStudents.map(s=>{
          const chat = getChat(s.id, acc.id);
          const pendingForMe = chat.status==='pending' && chat.requestedBy !== acc.id;
          const rep = growthReport(s.id, currentProgramId(s));
          return `<div class="entity-card student-card" data-id="${s.id}">
            <div class="head"><div class="avatar">${esc(s.name[0])}</div><div><div class="id">${esc(s.name)}</div><div class="grade">${esc(s.grade||'')}</div></div>
              ${pendingForMe ? `<span class="pill pill-warn" style="margin-left:auto;">대화 요청</span>` : ''}
            </div>
            <div class="chip-row">${(s.interests||[]).map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div>
            <div class="chip-row">${rep.ready ? `<span class="pill pill-good">리포트 생성됨</span>` : `<span class="pill pill-muted">데이터 수집 중</span>`}</div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">OTHER CHATS</span><h2>담당 학생 외의 대화 (${others.length}건)</h2></div><div class="hint">내 수업을 듣지 않은 학생도 대화를 요청할 수 있습니다</div></div>
      ${others.length===0 ? `<div class="empty-state">담당 학생이 아닌 학생과의 대화 요청/대화가 아직 없습니다.</div>` : `
      <div class="list-cards">
        ${others.map(o=>{
          const s = STATE.accounts.find(a=>a.id===o.studentId);
          const statusPill = o.chat.status==='active' ? '<span class="pill pill-good">대화 중</span>'
            : (o.chat.requestedBy===acc.id ? '<span class="pill pill-muted">요청 보냄</span>' : '<span class="pill pill-warn">대화 요청 옴</span>');
          return `<div class="entity-card other-chat-card" data-id="${o.studentId}">
            <div class="head"><div class="avatar">${esc(s.name[0])}</div><div><div class="id">${esc(s.name)}</div><div class="grade">${esc(s.grade||'')}${s.school?' · '+esc(s.school):''}</div></div>${statusPill}</div>
          </div>`;
        }).join('')}
      </div>`}
    </div>`;
  el.querySelectorAll('.student-card').forEach(card => card.addEventListener('click', () => { currentMentorStudent = card.dataset.id; render(); }));
  el.querySelectorAll('.other-chat-card').forEach(card => card.addEventListener('click', () => { currentMentorOtherChat = card.dataset.id; render(); }));
}
function renderMentorOtherChatDetail(el, acc){
  const s = STATE.accounts.find(a=>a.id===currentMentorOtherChat);
  if (!s) { currentMentorOtherChat = null; return renderMentorView(el, acc); }
  el.innerHTML = `<button class="btn btn-ghost" id="back-btn" style="margin-bottom:14px;">${icon('back')} 목록으로</button>
    <div class="panel"><div class="panel-head"><h2>${esc(s.name)}님과의 대화</h2></div><div style="font-size:11.5px;color:var(--text-muted);margin-bottom:10px;">담당 학생이 아니므로 성장 데이터는 표시되지 않습니다.</div><div id="chat-slot"></div></div>`;
  document.getElementById('back-btn').addEventListener('click', () => { currentMentorOtherChat = null; render(); });
  renderChatPanel(document.getElementById('chat-slot'), s.id, acc.id, { viewerId: acc.id, readOnly:false });
}
function renderMentorStudentDetail(el, acc){
  const s = STATE.accounts.find(a=>a.id===currentMentorStudent);
  if (!s) { currentMentorStudent = null; return renderMentorView(el, acc); }
  el.innerHTML = `<button class="btn btn-ghost" id="back-btn" style="margin-bottom:14px;">${icon('back')} 목록으로</button><div id="detail-slot"></div>`;
  document.getElementById('back-btn').addEventListener('click', () => { currentMentorStudent = null; render(); });
  renderStudentDetailPanel(document.getElementById('detail-slot'), s, { canAddMentorNote:true, canChat:true, viewerAccount: acc });
}
// Mentor-authored real lesson-plan submission. This is the only place a
// program's actual class content (주제·소요시간·대상·학습목표·준비물·
// 도입-전개-정리) and its proposed student roster get created — never the
// admin. Submitting only queues it as 'pending'; nothing here enrolls a
// student or changes survey questions until admin approves it in
// '지도안 승인' (see renderAdminLessonPlans).
// ---- lesson-plan draft: 도입/전개/정리 each hold an editable list of
// activity rows (시간·학습내용·교사활동·학생활동·준비물·유의점), matching
// a real 지도안 표 exactly. Rows are plain in-memory draft state (see
// mentorPlanDraft above) rebuilt into HTML on every add/remove so the
// stage's auto-computed duration ("도입(15′)") always reflects what's
// actually been timed.
function emptyPlanRow(start, end){
  return { start: start||0, end: end||0, label:'', teacher:'', student:'', materials:'', note:'' };
}
function defaultPlanDraft(){
  return { '도입': [emptyPlanRow(0,5)], '전개': [emptyPlanRow(5,20)], '정리': [emptyPlanRow(20,25)] };
}
function renderPlanStageRows(stage){
  return mentorPlanDraft[stage].map((r, i) => `
    <div class="plan-row" data-stage="${stage}" data-idx="${i}" style="border:1px solid var(--border-strong);border-radius:10px;padding:12px;margin-bottom:10px;">
      <div class="grid-2b" style="gap:10px;">
        <div class="field" style="margin-bottom:8px;"><label>시작(분)</label><input type="number" min="0" class="plan-row-start" value="${r.start}" /></div>
        <div class="field" style="margin-bottom:8px;"><label>종료(분)</label><input type="number" min="0" class="plan-row-end" value="${r.end}" /></div>
      </div>
      <div class="field" style="margin-bottom:8px;"><label>학습내용 (활동명)</label><input class="plan-row-label" value="${esc(r.label)}" placeholder="예: 인사" /></div>
      <div class="grid-2b" style="gap:10px;">
        <div class="field" style="margin-bottom:8px;"><label>교사 활동</label><textarea class="plan-row-teacher" style="min-height:70px;">${esc(r.teacher)}</textarea></div>
        <div class="field" style="margin-bottom:8px;"><label>학생 활동</label><textarea class="plan-row-student" style="min-height:70px;">${esc(r.student)}</textarea></div>
      </div>
      <div class="grid-2b" style="gap:10px;">
        <div class="field" style="margin-bottom:0;"><label>준비물 (선택)</label><input class="plan-row-materials" value="${esc(r.materials)}" placeholder="예: ZOOM 링크, PPT" /></div>
        <div class="field" style="margin-bottom:0;"><label>지도상 유의점 (선택)</label><input class="plan-row-note" value="${esc(r.note)}" /></div>
      </div>
      ${mentorPlanDraft[stage].length > 1 ? `<button type="button" class="btn btn-ghost plan-row-remove" style="margin-top:8px;font-size:12px;">이 활동 삭제</button>` : ''}
    </div>`).join('');
}
function renderPlanStageBlock(stage){
  return `<div class="plan-stage-block" data-stage="${stage}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;">
      <h3 style="font-size:14px;margin:0;">${stage} <span class="plan-stage-dur" style="color:var(--text-muted);font-weight:400;font-size:12px;">(자동 계산 ${stageDurationMin(mentorPlanDraft[stage])}분)</span></h3>
      <button type="button" class="btn btn-ghost plan-row-add" data-stage="${stage}" style="font-size:12px;">+ 활동 추가</button>
    </div>
    <div class="plan-stage-rows">${renderPlanStageRows(stage)}</div>

}
// Re-reads every row currently in the DOM back into mentorPlanDraft, so
// edits already typed survive an add/remove (which re-renders one stage's
// HTML from the draft).
function syncPlanDraftFromDom(el){
  ['도입','전개','정리'].forEach(stage => {
    const rows = [];
    el.querySelectorAll(`.plan-row[data-stage="${stage}"]`).forEach(rowEl => {
      rows.push({
        start: Number(rowEl.querySelector('.plan-row-start').value) || 0,
        end: Number(rowEl.querySelector('.plan-row-end').value) || 0,
        label: rowEl.querySelector('.plan-row-label').value.trim(),
        teacher: rowEl.querySelector('.plan-row-teacher').value.trim(),
        student: rowEl.querySelector('.plan-row-student').value.trim(),
        materials: rowEl.querySelector('.plan-row-materials').value.trim(),
        note: rowEl.querySelector('.plan-row-note').value.trim(),
      });
    });
    mentorPlanDraft[stage] = rows;
  });
}
function recomputeAllDurations(el){
  let total = 0;
  el.querySelectorAll('.plan-stage-block').forEach(block => {
    const rowEls = block.querySelectorAll('.plan-row');
    const starts = [...rowEls].map(r => Number(r.querySelector('.plan-row-start').value)||0);
    const ends = [...rowEls].map(r => Number(r.querySelector('.plan-row-end').value)||0);
    const dur = rowEls.length ? Math.max(0, Math.max(...ends) - Math.min(...starts)) : 0;
    const durEl = block.querySelector('.plan-stage-dur');
    if (durEl) durEl.textContent = `(자동 계산 ${dur}분)`;
    total += dur;
  });
  const totalEl = el.querySelector('#plan-total-duration');
  if (totalEl) totalEl.textContent = total + '분';
}
function rerenderStageBlock(el, stage){
  const block = el.querySelector(`.plan-stage-block[data-stage="${stage}"]`);
  const temp = document.createElement('div');
  temp.innerHTML = renderPlanStageBlock(stage);
  const newBlock = temp.firstElementChild;
  block.replaceWith(newBlock);
  bindStageBlockEvents(newBlock, el);
}
function bindStageBlockEvents(block, el){
  block.querySelectorAll('.plan-row-start, .plan-row-end').forEach(inp => inp.addEventListener('input', () => recomputeAllDurations(el)));
  block.querySelectorAll('.plan-row-add').forEach(btn => btn.addEventListener('click', () => {
    syncPlanDraftFromDom(el);
    const stage = btn.dataset.stage;
    const rows = mentorPlanDraft[stage];
    const last = rows[rows.length-1];
    mentorPlanDraft[stage].push(emptyPlanRow(last ? last.end : 0, last ? last.end + 5 : 5));
    rerenderStageBlock(el, stage);
    recomputeAllDurations(el);
  }));
  block.querySelectorAll('.plan-row-remove').forEach(btn => btn.addEventListener('click', () => {
    syncPlanDraftFromDom(el);
    const rowEl = btn.closest('.plan-row');
    const stage = rowEl.dataset.stage;
    const idx = Number(rowEl.dataset.idx);
    mentorPlanDraft[stage].splice(idx, 1);
    if (!mentorPlanDraft[stage].length) mentorPlanDraft[stage].push(emptyPlanRow(0,5));
    rerenderStageBlock(el, stage);
    recomputeAllDurations(el);
  }));
}
