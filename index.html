<title>Nova Lab Growth System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

:root{
  color-scheme: light;
  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#fbfaf8; --surface-sunken:#efeeea;
  --text-primary:#17161c; --text-secondary:#57565d; --text-muted:#8c8a91;
  --border:rgba(23,22,28,0.10); --border-strong:rgba(23,22,28,0.16);
  --accent:#4a3aa7; --accent-strong:#372c82; --accent-soft:#ece8fb; --accent-ink:#ffffff;
  --good-text:#006300; --good-soft:#e4f3e1;
  --critical:#d03b3b; --critical-soft:#fbe8e8;
  --warn:#9a6b00; --warn-soft:#faedd3;
  --s-problem:#2a78d6;   --s-problem-soft:#e2ecfa;
  --s-creativity:#c9591f; --s-creativity-soft:#fbe9dd;
  --s-collab:#178f65;    --s-collab-soft:#dcf1e8;
  --s-self:#b8790a;      --s-self-soft:#faedd3;
  --before-fill:#d9d7d1;
  --shadow: 0 1px 2px rgba(23,22,28,0.04), 0 8px 24px -12px rgba(23,22,28,0.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e0d12; --surface:#18171d; --surface-2:#1e1d24; --surface-sunken:#131217;
    --text-primary:#f5f4f8; --text-secondary:#c2c0c7; --text-muted:#8e8c93;
    --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.16);
    --accent:#a99ef2; --accent-strong:#c1b8f6; --accent-soft:rgba(169,158,242,0.16); --accent-ink:#1c1730;
    --good-text:#3fc23f; --good-soft:rgba(63,194,63,0.14);
    --critical:#e88686; --critical-soft:rgba(232,134,134,0.14);
    --warn:#e0a53f; --warn-soft:rgba(224,165,63,0.16);
    --s-problem:#5c9cec;  --s-problem-soft:rgba(92,156,236,0.16);
    --s-creativity:#e8834f; --s-creativity-soft:rgba(232,131,79,0.16);
    --s-collab:#3ec293;    --s-collab-soft:rgba(62,194,147,0.16);
    --s-self:#e0a53f;      --s-self-soft:rgba(224,165,63,0.16);
    --before-fill:#3a3843;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e0d12; --surface:#18171d; --surface-2:#1e1d24; --surface-sunken:#131217;
  --text-primary:#f5f4f8; --text-secondary:#c2c0c7; --text-muted:#8e8c93;
  --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.16);
  --accent:#a99ef2; --accent-strong:#c1b8f6; --accent-soft:rgba(169,158,242,0.16); --accent-ink:#1c1730;
  --good-text:#3fc23f; --good-soft:rgba(63,194,63,0.14);
  --critical:#e88686; --critical-soft:rgba(232,134,134,0.14);
  --warn:#e0a53f; --warn-soft:rgba(224,165,63,0.16);
  --s-problem:#5c9cec;  --s-problem-soft:rgba(92,156,236,0.16);
  --s-creativity:#e8834f; --s-creativity-soft:rgba(232,131,79,0.16);
  --s-collab:#3ec293;    --s-collab-soft:rgba(62,194,147,0.16);
  --s-self:#e0a53f;      --s-self-soft:rgba(224,165,63,0.16);
  --before-fill:#3a3843;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text-primary);
  font-family:"Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:700; text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;}
a{color:var(--accent-strong);}
::selection{background:var(--accent-soft);}
@media (prefers-reduced-motion: no-preference){ .view{animation:fadeIn .16s ease;} }
@keyframes fadeIn{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:none;}}

/* ---------- Login ---------- */
.login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:32px 30px; box-shadow:var(--shadow); }
.login-brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
.login-brand .mark{ width:30px; height:30px; border-radius:8px; background:linear-gradient(155deg, var(--accent), var(--s-collab)); }
.login-brand .txt .n{ font-size:14.5px; font-weight:800; letter-spacing:.2px; }
.login-brand .txt .s{ font-size:11px; color:var(--text-muted); font-weight:600; letter-spacing:.4px; }
.login-card h1{ font-size:19px; margin-bottom:6px; }
.login-card .sub{ font-size:12.5px; color:var(--text-muted); margin-bottom:22px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; font-family:inherit; font-size:13.5px; color:var(--text-primary);
  background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; padding:9px 11px;
}
.field textarea{ resize:vertical; min-height:60px; }
.field input:focus, .field select:focus, .field textarea:focus, button:focus-visible, .nav-item:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}
.login-error{ font-size:12.5px; color:var(--critical); background:var(--critical-soft); border-radius:8px; padding:9px 11px; margin-bottom:14px; }
.btn{ display:inline-flex; align-items:center; gap:6px; justify-content:center; font-size:13px; font-weight:700;
  border-radius:8px; padding:9px 15px; border:1px solid transparent; cursor:pointer; white-space:nowrap; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ background:var(--accent-strong); }
.btn-ghost{ background:var(--surface-2); color:var(--text-primary); border-color:var(--border-strong); }
.btn-ghost:hover{ background:var(--surface-sunken); }
.btn-danger{ background:var(--critical-soft); color:var(--critical); }
.btn:disabled{ opacity:.5; cursor:default; }
.btn-block{ width:100%; }
.login-foot{ margin-top:16px; font-size:11.5px; color:var(--text-muted); text-align:center; }

/* ---------- App shell ---------- */
.app{ display:flex; min-height:100vh; }
.sidebar{ width:216px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 12px; position:sticky; top:0; height:100vh; }
.brand{ display:flex; align-items:center; gap:9px; padding:4px 8px 18px; }
.brand-mark{ width:26px; height:26px; border-radius:7px; background:linear-gradient(155deg, var(--accent), var(--s-collab)); flex:none; }
.brand-text .name{ font-size:13.5px; font-weight:800; letter-spacing:.2px; }
.brand-text .sub{ font-size:10.5px; color:var(--text-muted); font-weight:600; letter-spacing:.4px; }
.nav{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.nav-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
  color:var(--text-secondary); font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
.nav-item svg{ width:16px; height:16px; flex:none; opacity:.85; }
.nav-item:hover{ background:var(--surface-2); color:var(--text-primary); }
.nav-item.active{ background:var(--accent-soft); color:var(--accent-strong); }
.nav-item.active svg{ opacity:1; }
.nav-item .badge{ margin-left:auto; font-size:10px; font-weight:800; background:var(--critical); color:#fff; border-radius:999px; padding:1px 6px; }
.sidebar-foot{ margin-top:auto; padding:12px 10px 2px; border-top:1px solid var(--border); }
.who{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.who .avatar{ width:28px; height:28px; border-radius:8px; background:var(--accent-soft); color:var(--accent-strong);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex:none; }
.who .meta .n{ font-size:12.5px; font-weight:700; }
.who .meta .r{ font-size:10.5px; color:var(--text-muted); font-weight:600; }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px;
  border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; z-index:5; }
.topbar h1{ font-size:18px; }
.topbar .desc{ font-size:12.5px; color:var(--text-muted); margin-top:2px; font-weight:500; }
.content{ padding:24px 28px 64px; max-width:1180px; }
.view{ display:none; } .view.active{ display:block; }

.readonly-banner{ display:flex; gap:10px; align-items:flex-start; background:var(--warn-soft); border:1px solid var(--border);
  border-radius:10px; padding:11px 14px; margin-bottom:20px; font-size:12.5px; color:var(--text-secondary); }

/* ---------- Generic pieces ---------- */
.stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
.stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
.stat-tile .label{ font-size:11px; font-weight:700; color:var(--text-muted); letter-spacing:.3px; }
.stat-tile .value{ font-size:24px; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums; }
.stat-tile .sub{ font-size:11.5px; color:var(--good-text); font-weight:700; margin-top:3px; }
.stat-tile .sub.muted{ color:var(--text-muted); }

.panel{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:16px; }
.panel-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
.panel-head h2{ font-size:14.5px; }
.panel-head .eyebrow{ font-size:10.5px; font-weight:700; color:var(--accent); letter-spacing:.5px; display:block; margin-bottom:4px; }
.panel-head .hint{ font-size:11.5px; color:var(--text-muted); }
.badge-latest{ display:inline-block; font-size:10px; font-weight:700; color:var(--accent-ink); background:var(--accent); border-radius:999px; padding:2px 8px; margin-left:8px; vertical-align:middle; letter-spacing:.3px; }
.empty-state{ font-size:13px; color:var(--text-muted); padding:18px 4px; text-align:center; }

.grid-2{ display:grid; grid-template-columns:1.15fr .85fr; gap:16px; align-items:start; }
.grid-2b{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

.tag{ display:inline-flex; align-items:center; font-size:11.5px; font-weight:600; padding:4px 9px;
  border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-secondary); }
.pill{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; }
.pill-good{ color:var(--good-text); background:var(--good-soft); }
.pill-warn{ color:var(--warn); background:var(--warn-soft); }
.pill-muted{ color:var(--text-muted); background:var(--surface-2); }
.pill-critical{ color:var(--critical); background:var(--critical-soft); }

table{ width:100%; border-collapse:collapse; font-size:12.5px; }
th{ text-align:left; font-size:10.5px; font-weight:700; color:var(--text-muted); letter-spacing:.3px;
  padding:0 10px 8px; border-bottom:1px solid var(--border-strong); }
td{ padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
tbody tr:hover{ background:var(--surface-2); }
.table-wrap{ overflow-x:auto; }
.num{ font-variant-numeric:tabular-nums; }

/* bars / meters */
.chart{ display:flex; align-items:flex-end; gap:26px; height:190px; padding:6px 4px 0; }
.chart-group{ display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; height:100%; justify-content:flex-end;}
.chart-bars{ display:flex; align-items:flex-end; gap:6px; height:150px; }
.bar{ width:22px; border-radius:4px 4px 2px 2px; position:relative; }
.bar-value{ position:absolute; top:-17px; left:50%; transform:translateX(-50%); font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text-secondary); white-space:nowrap;}
.chart-label{ font-size:11.5px; font-weight:700; text-align:center; }
.chart-delta{ font-size:10.5px; font-weight:700; color:var(--good-text); }
.legend{ display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; }
.legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-secondary); font-weight:600; }
.legend-swatch{ width:10px; height:10px; border-radius:3px; }

.meter-row{ display:flex; align-items:center; gap:12px; padding:9px 0; }
.meter-label{ width:96px; flex:none; font-size:12.5px; font-weight:700; }
.meter-track{ flex:1; height:9px; border-radius:999px; background:var(--surface-sunken); position:relative; overflow:hidden; }
.meter-fill{ height:100%; border-radius:999px; }
.meter-value{ width:34px; flex:none; text-align:right; font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums; }
.meter-delta{ width:44px; flex:none; text-align:right; font-size:11px; font-weight:700; color:var(--good-text); }

.insight-box{ background:var(--accent-soft); border:1px solid var(--border); border-left:3px solid var(--accent);
  border-radius:8px; padding:14px 16px; font-size:13px; color:var(--text-primary); line-height:1.7; }
.formula-box{ font-size:11.5px; color:var(--text-muted); background:var(--surface-2); border-radius:8px; padding:9px 11px; margin-top:10px; }
.info-row{ background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--text-secondary); line-height:1.6; }
.info-row b{ color:var(--text-primary); }

.analysis-list{ display:flex; flex-direction:column; gap:14px; margin-top:16px; }
.analysis-item{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--surface-2); }
.analysis-head{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px; }
.analysis-head .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.analysis-head b{ color:var(--text-primary); }
.analysis-score{ margin-left:auto; font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.analysis-text{ font-size:12.5px; color:var(--text-secondary); line-height:1.7; margin:0; }
.evidence-details{ margin-top:8px; }
.evidence-details summary{ cursor:pointer; font-size:11.5px; color:var(--accent); font-weight:600; }
.evidence-details summary:hover{ text-decoration:underline; }
.evidence-list{ list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
.evidence-list li{ font-size:11.5px; color:var(--text-muted); line-height:1.6; padding-left:12px; position:relative; }
.evidence-list li::before{ content:"–"; position:absolute; left:0; color:var(--text-muted); }

.bullet-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.bullet-list li{ display:flex; gap:8px; font-size:12.5px; color:var(--text-secondary); }
.bullet-list li::before{ content:"•"; color:var(--accent); font-weight:700; flex:none; }

.timeline{ display:flex; flex-direction:column; }
.tl-item{ display:flex; gap:14px; padding-bottom:16px; position:relative; }
.tl-item:last-child{ padding-bottom:0; }
.tl-dot-col{ display:flex; flex-direction:column; align-items:center; flex:none; }
.tl-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); margin-top:4px; flex:none; }
.tl-date{ font-size:11px; font-weight:700; color:var(--accent); }
.tl-title{ font-size:13px; font-weight:700; margin-top:2px; }
.tl-desc{ font-size:12px; color:var(--text-muted); margin-top:2px; }

/* survey form */
.survey-q{ padding:14px 0; border-bottom:1px solid var(--border); }
.survey-q:last-child{ border-bottom:none; }
.survey-q .qtext{ font-size:13px; font-weight:600; margin-bottom:10px; }
.likert{ display:flex; gap:8px; }
.likert label{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:var(--text-muted); cursor:pointer; }
.likert input{ width:16px; height:16px; accent-color:var(--accent); }

/* student/mentor cards */
.list-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:14px; }
.entity-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:15px; box-shadow:var(--shadow); cursor:pointer; }
.entity-card:hover{ border-color:var(--border-strong); }
.entity-card .head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.entity-card .avatar{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none; background:var(--accent-soft); color:var(--accent-strong); }
.entity-card .head .id{ font-size:13.5px; font-weight:800; }
.entity-card .head .grade{ font-size:11px; color:var(--text-muted); font-weight:600; }
.chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.chip{ font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:6px; }

/* chat */
.chat-wrap{ display:flex; flex-direction:column; height:520px; }
.chat-log{ flex:1; overflow-y:auto; padding:6px 4px; display:flex; flex-direction:column; gap:10px; }
.chat-msg{ max-width:72%; padding:9px 12px; border-radius:12px; font-size:13px; line-height:1.5; }
.chat-msg .meta{ font-size:10px; color:var(--text-muted); margin-top:4px; font-weight:600; }
.chat-msg.me{ align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:3px; }
.chat-msg.me .meta{ color:rgba(255,255,255,0.75); text-align:right; }
.chat-msg.them{ align-self:flex-start; background:var(--surface-2); border:1px solid var(--border); border-bottom-left-radius:3px; }
.chat-compose{ display:flex; gap:8px; margin-top:12px; }
.chat-compose input{ flex:1; }
.chat-empty{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:12.5px; text-align:center; padding:20px; }
.chat-request-box{ text-align:center; padding:40px 20px; }
.chat-request-box p{ font-size:13px; color:var(--text-secondary); margin-bottom:16px; }
.pending-row{ display:flex; align-items:center; gap:10px; justify-content:center; }

.toast{ position:fixed; bottom:22px; left:50%; transform:translate(-50%, 12px); opacity:0;
  background:var(--text-primary); color:var(--bg); font-size:12.5px; font-weight:600;
  padding:10px 16px; border-radius:999px; box-shadow:var(--shadow); pointer-events:none;
  transition:opacity .18s ease, transform .18s ease; z-index:50; white-space:nowrap; }
.toast.show{ opacity:1; transform:translate(-50%, 0); }

.step-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.step-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:15px; display:flex; flex-direction:column; gap:6px; }
.step-num{ font-size:11px; font-weight:800; color:var(--accent); }
.step-title{ font-size:13.5px; font-weight:700; }
.step-desc{ font-size:12px; color:var(--text-secondary); }

.form-actions{ display:flex; gap:10px; margin-top:16px; }
.inline-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.inline-form .field{ margin-bottom:0; flex:1; min-width:140px; }

@media (max-width: 860px){
  .stat-row{ grid-template-columns:repeat(2,1fr); }
  .grid-2, .grid-2b{ grid-template-columns:1fr; }
  .step-cards{ grid-template-columns:1fr; }
  .list-cards{ grid-template-columns:1fr 1fr; }
  .sidebar{ width:64px; }
  .brand-text, .nav-item span, .who .meta{ display:none; }
  .nav-item{ justify-content:center; }
}

</style>

ck{ width:100%; }\\n.login-foot{ margin-top:16px; font-size:11.5px; color:var(--text-muted); text-align:center; }\\n\\n/* ---------- App shell ---------- */\\n.app{ display:flex; min-height:100vh; }\\n.sidebar{ width:216px; flex:none; background:var(--surface); border-right:1px solid var(--border);\\n  display:flex; flex-direction:column; padding:20px 12px; position:sticky; top:0; height:100vh; }\\n.brand{ display:flex; align-items:center; gap:9px; padding:4px 8px 18px; }\\n.brand-mark{ width:26px; height:26px; border-radius:7px; background:linear-gradient(155deg, var(--accent), var(--s-collab)); flex:none; }\\n.brand-text .name{ font-size:13.5px; font-weight:800; letter-spacing:.2px; }\\n.brand-text .sub{ font-size:10.5px; color:var(--text-muted); font-weight:600; letter-spacing:.4px; }\\n.nav{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }\\n.nav-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;\\n  color:var(--text-secondary); font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }\\n.nav-item svg{ width:16px; height:16px; flex:none; opacity:.85; }\\n.nav-item:hover{ background:var(--surface-2); color:var(--text-primary); }\\n.nav-item.active{ background:var(--accent-soft); color:var(--accent-strong); }\\n.nav-item.active svg{ opacity:1; }\\n.nav-item .badge{ margin-left:auto; font-size:10px; font-weight:800; background:var(--critical); color:#fff; border-radius:999px; padding:1px 6px; }\\n.sidebar-foot{ margin-top:auto; padding:12px 10px 2px; border-top:1px solid var(--border); }\\n.who{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }\\n.who .avatar{ width:28px; height:28px; border-radius:8px; background:var(--accent-soft); color:var(--accent-strong);\\n  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex:none; }\\n.who .meta .n{ font-size:12.5px; font-weight:700; }\\n.who .meta .r{ font-size:10.5px; color:var(--text-muted); font-weight:600; }\\n\\n.main{ flex:1; min-width:0; display:flex; flex-direction:column; }\\n.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px;\\n  border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; z-index:5; }\\n.topbar h1{ font-size:18px; }\\n.topbar .desc{ font-size:12.5px; color:var(--text-muted); margin-top:2px; font-weight:500; }\\n.content{ padding:24px 28px 64px; max-width:1180px; }\\n.view{ display:none; } .view.active{ display:block; }\\n\\n.readonly-banner{ display:flex; gap:10px; align-items:flex-start; background:var(--warn-soft); border:1px solid var(--border);\\n  border-radius:10px; padding:11px 14px; margin-bottom:20px; font-size:12.5px; color:var(--text-secondary); }\\n\\n/* ---------- Generic pieces ---------- */\\n.stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }\\n.stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }\\n.stat-tile .label{ font-size:11px; font-weight:700; color:var(--text-muted); letter-spacing:.3px; }\\n.stat-tile .value{ font-size:24px; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums; }\\n.stat-tile .sub{ font-size:11.5px; color:var(--good-text); font-weight:700; margin-top:3px; }\\n.stat-tile .sub.muted{ color:var(--text-muted); }\\n\\n.panel{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:16px; }\\n.panel-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }\\n.panel-head h2{ font-size:14.5px; }\\n.panel-head .eyebrow{ font-size:10.5px; font-weight:700; color:var(--accent); letter-spacing:.5px; display:block; margin-bottom:4px; }\\n.panel-head .hint{ font-size:11.5px; color:var(--text-muted); }\\n.badge-latest{ display:inline-block; font-size:10px; font-weight:700; color:var(--accent-ink); background:var(--accent); border-radius:999px; padding:2px 8px; margin-left:8px; vertical-align:middle; letter-spacing:.3px; }\\n.empty-state{ font-size:13px; color:var(--text-muted); padding:18px 4px; text-align:center; }\\n\\n.grid-2{ display:grid; grid-template-columns:1.15fr .85fr; gap:16px; align-items:start; }\\n.grid-2b{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }\\n\\n.tag{ display:inline-flex; align-items:center; font-size:11.5px; font-weight:600; padding:4px 9px;\\n  border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-secondary); }\\n.pill{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; }\\n.pill-good{ color:var(--good-text); background:var(--good-soft); }\\n.pill-warn{ color:var(--warn); background:var(--warn-soft); }\\n.pill-muted{ color:var(--text-muted); background:var(--surface-2); }\\n.pill-critical{ color:var(--critical); background:var(--critical-soft); }\\n\\ntable{ width:100%; border-collapse:collapse; font-size:12.5px; }\\nth{ text-align:left; font-size:10.5px; font-weight:700; color:var(--text-muted); letter-spacing:.3px;\\n  padding:0 10px 8px; border-bottom:1px solid var(--border-strong); }\\ntd{ padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }\\ntbody tr:hover{ background:var(--surface-2); }\\n.table-wrap{ overflow-x:auto; }\\n.num{ font-variant-numeric:tabular-nums; }\\n\\n/* bars / meters */\\n.chart{ display:flex; align-items:flex-end; gap:26px; height:190px; padding:6px 4px 0; }\\n.chart-group{ display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; height:100%; justify-content:flex-end;}\\n.chart-bars{ display:flex; align-items:flex-end; gap:6px; height:150px; }\\n.bar{ width:22px; border-radius:4px 4px 2px 2px; position:relative; }\\n.bar-value{ position:absolute; top:-17px; left:50%; transform:translateX(-50%); font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text-secondary); white-space:nowrap;}\\n.chart-label{ font-size:11.5px; font-weight:700; text-align:center; }\\n.chart-delta{ font-size:10.5px; font-weight:700; color:var(--good-text); }\\n.legend{ display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; }\\n.legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-secondary); font-weight:600; }\\n.legend-swatch{ width:10px; height:10px; border-radius:3px; }\\n\\n.meter-row{ display:flex; align-items:center; gap:12px; padding:9px 0; }\\n.meter-label{ width:96px; flex:none; font-size:12.5px; font-weight:700; }\\n.meter-track{ flex:1; height:9px; border-radius:999px; background:var(--surface-sunken); position:relative; overflow:hidden; }\\n.meter-fill{ height:100%; border-radius:999px; }\\n.meter-value{ width:34px; flex:none; text-align:right; font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums; }\\n.meter-delta{ width:44px; flex:none; text-align:right; font-size:11px; font-weight:700; color:var(--good-text); }\\n\\n.insight-box{ background:var(--accent-soft); border:1px solid var(--border); border-left:3px solid var(--accent);\\n  border-radius:8px; padding:14px 16px; font-size:13px; color:var(--text-primary); line-height:1.7; }\\n.formula-box{ font-size:11.5px; color:var(--text-muted); background:var(--surface-2); border-radius:8px; padding:9px 11px; margin-top:10px; }\\n.info-row{ background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--text-secondary); line-height:1.6; }\\n.info-row b{ color:var(--text-primary); }\\n\\n.analysis-list{ display:flex; flex-direction:column; gap:14px; margin-top:16px; }\\n.analysis-item{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--surface-2); }\\n.analysis-head{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px; }\\n.analysis-head .dot{ width:9px; height:9px; border-radius:50%; flex:none; }\\n.analysis-head b{ color:var(--text-primary); }\\n.analysis-score{ margin-left:auto; font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; }\\n.analysis-text{ font-size:12.5px; color:var(--text-secondary); line-height:1.7; margin:0; }\\n.evidence-details{ margin-top:8px; }\\n.evidence-details summary{ cursor:pointer; font-size:11.5px; color:var(--accent); font-weight:600; }\\n.evidence-details summary:hover{ text-decoration:underline; }\\n.evidence-list{ list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }\\n.evidence-list li{ font-size:11.5px; color:var(--text-muted); line-height:1.6; padding-left:12px; position:relative; }\\n.evidence-list li::before{ content:\\\"–\\\"; position:absolute; left:0; color:var(--text-muted); }\\n\\n.bullet-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }\\n.bullet-list li{ display:flex; gap:8px; font-size:12.5px; color:var(--text-secondary); }\\n.bullet-list li::before{ content:\\\"•\\\"; color:var(--accent); font-weight:700; flex:none; }\\n\\n.timeline{ display:flex; flex-direction:column; }\\n.tl-item{ display:flex; gap:14px; padding-bottom:16px; position:relative; }\\n.tl-item:last-child{ padding-bottom:0; }\\n.tl-dot-col{ display:flex; flex-direction:column; align-items:center; flex:none; }\\n.tl-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); margin-top:4px; flex:none; }\\n.tl-date{ font-size:11px; font-weight:700; color:var(--accent); }\\n.tl-title{ font-size:13px; font-weight:700; margin-top:2px; }\\n.tl-desc{ font-size:12px; color:var(--text-muted); margin-top:2px; }\\n\\n/* survey form */\\n.survey-q{ padding:14px 0; border-bottom:1px solid var(--border); }\\n.survey-q:last-child{ border-bottom:none; }\\n.survey-q .qtext{ font-size:13px; font-weight:600; margin-bottom:10px; }\\n.likert{ display:flex; gap:8px; }\\n.likert label{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:var(--text-muted); cursor:pointer; }\\n.likert input{ width:16px; height:16px; accent-color:var(--accent); }\\n\\n/* student/mentor cards */\\n.list-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:14px; }\\n.entity-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:15px; box-shadow:var(--shadow); cursor:pointer; }\\n.entity-card:hover{ border-color:var(--border-strong); }\\n.entity-card .head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }\\n.entity-card .avatar{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none; background:var(--accent-soft); color:var(--accent-strong); }\\n.entity-card .head .id{ font-size:13.5px; font-weight:800; }\\n.entity-card .head .grade{ font-size:11px; color:var(--text-muted); font-weight:600; }\\n.chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }\\n.chip{ font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:6px; }\\n\\n/* chat */\\n.chat-wrap{ display:flex; flex-direction:column; height:520px; }\\n.chat-log{ flex:1; overflow-y:auto; padding:6px 4px; display:flex; flex-direction:column; gap:10px; }\\n.chat-msg{ max-width:72%; padding:9px 12px; border-radius:12px; font-size:13px; line-height:1.5; }\\n.chat-msg .meta{ font-size:10px; color:var(--text-muted); margin-top:4px; font-weight:600; }\\n.chat-msg.me{ align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:3px; }\\n.chat-msg.me .meta{ color:rgba(255,255,255,0.75); text-align:right; }\\n.chat-msg.them{ align-self:flex-start; background:var(--surface-2); border:1px solid var(--border); border-bottom-left-radius:3px; }\\n.chat-compose{ display:flex; gap:8px; margin-top:12px; }\\n.chat-compose input{ flex:1; }\\n.chat-empty{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:12.5px; text-align:center; padding:20px; }\\n.chat-request-box{ text-align:center; padding:40px 20px; }\\n.chat-request-box p{ font-size:13px; color:var(--text-secondary); margin-bottom:16px; }\\n.pending-row{ display:flex; align-items:center; gap:10px; justify-content:center; }\\n\\n.toast{ position:fixed; bottom:22px; left:50%; transform:translate(-50%, 12px); opacity:0;\\n  background:var(--text-primary); color:var(--bg); font-size:12.5px; font-weight:600;\\n  padding:10px 16px; border-radius:999px; box-shadow:var(--shadow); pointer-events:none;\\n  transition:opacity .18s ease, transform .18s ease; z-index:50; white-space:nowrap; }\\n.toast.show{ opacity:1; transform:translate(-50%, 0); }\\n\\n.step-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }\\n.step-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:15px; display:flex; flex-direction:column; gap:6px; }\\n.step-num{ font-size:11px; font-weight:800; color:var(--accent); }\\n.step-title{ font-size:13.5px; font-weight:700; }\\n.step-desc{ font-size:12px; color:var(--text-secondary); }\\n\\n.form-actions{ display:flex; gap:10px; margin-top:16px; }\\n.inline-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }\\n.inline-form .field{ margin-bottom:0; flex:1; min-width:140px; }\\n\\n@media (max-width: 860px){\\n  .stat-row{ grid-template-columns:repeat(2,1fr); }\\n  .grid-2, .grid-2b{ grid-template-columns:1fr; }\\n  .step-cards{ grid-template-columns:1fr; }\\n  .list-cards{ grid-template-columns:1fr 1fr; }\\n  .sidebar{ width:64px; }\\n  .brand-text, .nav-item span, .who .meta{ display:none; }\\n  .nav-item{ justify-content:center; }\\n}\\n\";\n\n/* ============================================================\n   Nova Lab Growth System — real data-collection platform\n   Roles: admin / mentor / student. Single shared document,\n   persisted via the artifact capability (claude.use(\"artifact\")).\n   ============================================================ */\n\nconst COMP = [\n  { key:'problem',    label:'문제해결력', color:'--s-problem',    soft:'--s-problem-soft' },\n  { key:'creativity',  label:'창의적 사고', color:'--s-creativity', soft:'--s-creativity-soft' },\n  { key:'collab',      label:'협업',       color:'--s-collab',     soft:'--s-collab-soft' },\n  { key:'self',        label:'자기주도성', color:'--s-self',       soft:'--s-self-soft' },\n];\nconst compLabel = k => COMP.find(c=>c.key===k).label;\n\n// Fallback item set used only when a program has no 수업 자료(materials)\n// entered yet — every id below is structural (problem_1..3 등) and must\n// never change, since STATE.surveys stores answers keyed by these ids.\nconst DEFAULT_PERCEPTION_ITEMS = {\n  problem: [\n    { id:'problem_1', text:'어려운 문제를 만나도 여러 방법을 시도해본다.' },\n    { id:'problem_2', text:'문제가 잘 풀리지 않을 때 다른 전략으로 바꿔본다.' },\n    { id:'problem_3', text:'스스로 문제를 해결할 수 있다고 생각한다.' },\n  ],\n  creativity: [\n    { id:'creativity_1', text:'새로운 아이디어를 떠올리는 것을 좋아한다.' },\n    { id:'creativity_2', text:'기존과 다른 방식으로 문제를 풀어보려 한다.' },\n    { id:'creativity_3', text:'나만의 방법으로 결과물을 만드는 것이 즐겁다.' },\n  ],\n  collab: [\n    { id:'collab_1', text:'다른 친구와 함께 활동할 때 의견을 잘 이야기한다.' },\n    { id:'collab_2', text:'도움이 필요할 때 다른 사람에게 요청한다.' },\n    { id:'collab_3', text:'팀 활동에서 나의 역할을 잘 수행한다.' },\n  ],\n  self: [\n    { id:'self_1', text:'시키지 않아도 스스로 다음 활동을 찾아본다.' },\n    { id:'self_2', text:'궁금한 것이 생기면 스스로 찾아본다.' },\n    { id:'self_3', text:'계획을 세우고 실행하는 것이 익숙하다.' },\n  ],\n};\n// Templates used to generate PROGRAM-SPECIFIC survey items from the actual\n// 수업 자료(materials.activities) admin enters for that program — {act} is\n// substituted with one of the program's real activity phrases, so a robotics\n// camp and a data-science course end up asking genuinely different\n// questions under the same 4 competencies, instead of one generic form for\n// every class. Deterministic string substitution, not a generative model —\n// fully inspectable, consistent with how 행동 데이터 is computed elsewhere.\nconst ITEM_TEMPLATES = {\n  problem: [\n    '{act} 활동 중 어려운 문제가 생기면 여러 방법을 시도해본다.',\n    '{act}에서 실수하거나 잘 안 될 때 다른 전략으로 바꿔본다.',\n    '{act} 과제를 스스로 해결할 수 있다고 생각한다.',\n  ],\n  creativity: [\n    '{act}를 할 때 나만의 새로운 방법을 떠올려본다.',\n    '{act} 결과물을 기존과 다르게 만들어보고 싶다.',\n    '{act}에서 다양한 아이디어를 자유롭게 시도해본다.',\n  ],\n  collab: [\n    '{act} 활동을 할 때 팀원과 의견을 잘 나눈다.',\n    '{act} 중 도움이 필요하면 다른 친구에게 요청한다.',\n    '{act} 팀 활동에서 나의 역할을 잘 수행한다.',\n  ],\n  self: [\n    '시키지 않아도 스스로 {act} 관련 활동을 더 찾아본다.',\n    '{act}에 대해 궁금한 점이 생기면 스스로 찾아본다.',\n    '{act}를 계획을 세워 진행하는 것이 익숙하다.',\n  ],\n};\n// Lesson plans (수업 지도안) are authored by the mentor teaching a program,\n// one per session, and only count once admin has approved them — see\n// renderMentorLessonPlans (authoring) and renderAdminLessonPlans (approval).\nfunction programLessonPlans(programId){\n  return (STATE.lessonPlans||[]).filter(lp => lp.programId === programId)\n    .sort((a,b)=> (a.sessionNo||0) - (b.sessionNo||0) || new Date(a.submittedAt) - new Date(b.submittedAt));\n}\nfunction lessonPlan(id){ return (STATE.lessonPlans||[]).find(lp => lp.id === id) || null; }\n// The most recent submission for one specific (program, session) pair —\n// used to prefill a resubmission after a rejection.\nfunction lessonPlanForSession(programId, sessionNo){\n  const matches = programLessonPlans(programId).filter(lp => lp.sessionNo === sessionNo);\n  return matches.length ? matches[matches.length-1] : null;\n}\n// Every 핵심 활동 keyword from this program's APPROVED lesson plans, merged\n// and de-duplicated across sessions — the real, admin-reviewed curriculum\n// content that drives programPerceptionItems() below. A pending or rejected\n// plan's activities never leak into the survey until admin approves it.\nfunction programApprovedActivities(programId){\n  const acts = [];\n  programLessonPlans(programId).filter(lp => lp.status === 'approved').forEach(lp => {\n    (lp.activities||[]).forEach(a => { if (a && !acts.includes(a)) acts.push(a); });\n  });\n  return acts;\n}\n// Program-specific survey item set: item ids always match\n// DEFAULT_PERCEPTION_ITEMS (so STATE.surveys keys stay stable across every\n// program), only the displayed text changes based on that program's real,\n// ADMIN-APPROVED curriculum. Falls back to the generic default text when a\n// program has no approved lesson plan activities yet.\nfunction programPerceptionItems(prog){\n  const acts = prog ? programApprovedActivities(prog.id) : [];\n  if (!acts.length) return DEFAULT_PERCEPTION_ITEMS;\n  const out = {};\n  COMP.forEach(c => {\n    out[c.key] = ITEM_TEMPLATES[c.key].map((tpl, i) => ({\n      id: DEFAULT_PERCEPTION_ITEMS[c.key][i].id,\n      text: tpl.replace(/\\{act\\}/g, acts[i % acts.length]),\n    }));\n  });\n  return out;\n}\n// A student's currently active mentor is now derived from their CURRENT\n// program's assigned teacher, not a separate fixed pairing — a student may\n// have had mentor01 for one program's cohort and mentor02 for the next.\nfunction studentMentorId(studentId){\n  const acc = STATE.accounts.find(a=>a.id===studentId);\n  const pid = acc && acc.programId;\n  const prog = pid ? program(pid) : null;\n  return prog ? (prog.mentorId || null) : null;\n}\n\nconst BEHAVIOR_PHRASES = {\n  problem:'활동 기록과 사용 로그에서 문제 해결 시도 신호가 반복적으로 감지됨',\n  creativity:'활동 기록에서 새로운 아이디어나 접근을 시도한 흔적이 반복적으로 감지됨',\n  collab:'대화 참여 로그에서 다른 학생과 의견을 나누는 활동이 반복적으로 감지됨',\n  self:'로그인 빈도와 활동 기록에서 스스로 참여를 이어가는 패턴이 반복적으로 감지됨',\n};\n// Keyword signals used by the rule-based journal analyzer below. A hit is a\n// simple substring match against the student's own 탐구 저널 (activity log)\n// text — transparent and inspectable, not a black box.\nconst JOURNAL_KEYWORDS = {\n  problem:   ['다시 시도','다른 방법','전략을 바꿔','다르게 풀어','해결 방법을 바꿔','실패했지만','고쳐서','오류를 찾아','여러 번'],\n  creativity:['새로운 아이디어','다르게 만들어','나만의 방법','색다른','독특한','기존과 다른','새롭게'],\n  collab:    ['같이','팀원','도와','함께','나눠서','친구와','서로'],\n  self:      ['스스로','혼자서','계획을 세워','더 해보고 싶어서','궁금해서 찾아','자발적으로','미리'],\n};\nconst NEXT_STEP_BY_AREA = {\n  self:      { title:'심화 탐구 프로젝트',       desc:'스스로 질문을 설계하고 답을 찾아가는 프로젝트형 학습' },\n  collab:    { title:'팀 프로젝트 중심 활동',     desc:'또래와 역할을 나눠 함께 문제를 해결하는 협업 활동' },\n  creativity:{ title:'오픈엔디드 메이커 프로젝트', desc:'정해진 답 없이 자유롭게 설계하고 만들어보는 활동' },\n  problem:   { title:'단계별 챌린지 워크숍',      desc:'난이도가 점진적으로 올라가는 문제해결 챌린지' },\n};\n\n/* ---------------- session (per-viewer, localStorage only) ---------------- */\nlet session = { accountId: null };\ntry {\n  const saved = localStorage.getItem('novalab_session');\n  if (saved) session = JSON.parse(saved);\n} catch(e) {}\n\nfunction persistSession(){\n  try { localStorage.setItem('novalab_session', JSON.stringify(session)); } catch(e) {}\n}\nfunction currentAccount(){\n  return STATE.accounts.find(a => a.id === session.accountId) || null;\n}\n\n/* ---------------- write status / persistence ---------------- */\nlet writeStatus = 'idle'; // idle | saving | saved | readonly | offline\nlet artifactCap = null;\n(async () => {\n  try {\n    if (window.claude && typeof window.claude.use === 'function') {\n      artifactCap = await window.claude.use('artifact');\n    }\n  } catch(e) { artifactCap = null; }\n  renderWriteStatus();\n})();\n\nfunction buildDoc(state){\n  let w = TEMPLATE_JS.replace('__STATE_PLACEHOLDER__', () => JSON.stringify(state));\n  w = w.replace('\"__TEMPLATE_JS_PLACEHOLDER__\"', () => JSON.stringify(TEMPLATE_JS));\n  return '<!doctype html><html><head><meta charset=\"utf-8\">' +\n    '<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">' +\n    '<title>Nova Lab Growth System</title><style>' + CSS_TEXT + '</style></head>' +\n    '<body><div id=\"root\"></div><script>' + w + '</scr' + 'ipt></body></html>';\n}\n\nfunction replaceStateWith(newState){\n  for (const k of Object.keys(STATE)) delete STATE[k];\n  for (const k of Object.keys(newState)) STATE[k] = newState[k];\n}\nasync function saveState(mutator){\n  // mutator: function(draft) -> mutates a deep-cloned draft; returns nothing\n  const draft = JSON.parse(JSON.stringify(STATE));\n  mutator(draft);\n  replaceStateWith(draft);\n  render();\n  if (!artifactCap){ writeStatus='offline'; renderWriteStatus(); return; }\n  writeStatus = 'saving'; renderWriteStatus();\n  stashNavState();\n  try {\n    await artifactCap.publish(buildDoc(STATE));\n    writeStatus = 'saved'; renderWriteStatus();\n  } catch(err){\n    if (err && (err.code === 'not_writer' || err.code === 'not_granted' || err.code === 'not_declared')){\n      writeStatus = 'readonly';\n    } else if (err && err.code === 'conflict') {\n      // another viewer's save is winning; the shell reloads this view automatically.\n      writeStatus = 'saving';\n    } else {\n      writeStatus = 'offline';\n    }\n    renderWriteStatus();\n  }\n}\n\nfunction renderWriteStatus(){\n  const el = document.getElementById('write-status');\n  if (!el) return;\n  const map = {\n    idle:   { text:'', cls:'' },\n    saving: { text:'저장 중…', cls:'pill-muted' },\n    saved:  { text:'저장됨', cls:'pill-good' },\n    readonly:{ text:'읽기 전용 (편집 권한 없음)', cls:'pill-warn' },\n    offline:{ text:'로컬에서만 실행 중 (공유 저장 안 됨)', cls:'pill-warn' },\n  };\n  const s = map[writeStatus] || map.idle;\n  el.className = 'pill ' + s.cls;\n  el.textContent = s.text;\n  el.style.display = s.text ? 'inline-flex' : 'none';\n}\n\n/* ---------------- scoring engine ----------------\n   Two independently real, auto-collected inputs feed the \"행동 데이터\"\n   (behavior data) side of the Growth Report — no human rates a student:\n     1) 탐구 저널 분석 — the student's own per-session activity log text,\n        scored by a transparent keyword-hit rule (JOURNAL_KEYWORDS above).\n     2) 플랫폼 사용 로그 — actual usage the system already records as a\n        side effect of normal use: login days, messages the student sent,\n        1:1 chats the student personally initiated.\n   A mentor's note (STATE.mentorNotes) is qualitative context only and is\n   never averaged into these numbers. */\nfunction likertToScore(v){ return Math.round((v/5)*100); }\n\nfunction program(programId){ return STATE.programs.find(p=>p.id===programId) || null; }\nfunction currentProgramId(studentAcc){ return studentAcc && studentAcc.programId; }\nfunction studentActivityLogs(studentId, programId){\n  return (STATE.activityLogs[studentId]||[]).filter(l => !programId || l.programId === programId);\n}\nfunction studentMentorNotes(studentId, programId){\n  return (STATE.mentorNotes[studentId]||[]).filter(l => !programId || l.programId === programId);\n}\nfunction studentPrograms(studentId){\n  // every distinct program this student has any survey or activity data under, oldest first\n  const ids = new Set();\n  const s = STATE.surveys[studentId] || {};\n  Object.keys(s).forEach(pid => ids.add(pid));\n  (STATE.activityLogs[studentId]||[]).forEach(l => ids.add(l.programId));\n  return [...ids].filter(Boolean).map(pid => program(pid)).filter(Boolean)\n    .sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));\n}\n// Every program a student's Growth Report panel would render a block for —\n// their full history plus their currently assigned program (even if it has\n// no data yet) — used so admin-facing counts match what the detail panel shows.\nfunction studentReportPrograms(studentId){\n  const acc = STATE.accounts.find(a=>a.id===studentId);\n  const pid = acc && acc.programId;\n  const prog = pid ? program(pid) : null;\n  const history = studentPrograms(studentId);\n  return (pid && !history.some(p=>p.id===pid) && prog) ? [...history, prog] : history;\n}\n// Same list, named for its other use: which programs a student can pick\n// from when choosing \"어떤 수업\" to write a 탐구 저널 entry or take a\n// 성장 설문 for — their current class plus every past class they have any\n// record under, so journal/survey are always attributed to the right\n// program instead of assuming \"whatever I'm assigned to right now\".\nfunction studentEligiblePrograms(studentId){ return studentReportPrograms(studentId); }\n// How many of those are actually ready (data complete enough for a real\n// Growth Report) — the number admin sees as \"누적 성장 보고서\" per student.\nfunction studentReadyReportCount(studentId){\n  return studentReportPrograms(studentId).filter(p => growthReport(studentId, p.id).ready).length;\n}\n\nfunction perceptionScore(studentId, programId, phase){\n  const rec = STATE.surveys[studentId] && STATE.surveys[studentId][programId] && STATE.surveys[studentId][programId][phase];\n  if (!rec) return null;\n  const progItems = programPerceptionItems(program(programId));\n  const out = {};\n  for (const c of COMP){\n    const items = progItems[c.key];\n    const vals = items.map(it => rec[it.id]).filter(v => typeof v === 'number');\n    if (vals.length < items.length) { out[c.key] = null; continue; }\n    const avg = vals.reduce((a,b)=>a+b,0) / vals.length;\n    out[c.key] = likertToScore(avg);\n  }\n  return out;\n}\n// Per-item pre/post answers for one competency — the raw evidence behind\n// the aggregated perceptionScore, used to cite exactly which survey\n// statement moved and by how much. Text reflects THIS program's own\n// curriculum (see programPerceptionItems), not a generic form.\nfunction perceptionItemDetail(studentId, programId, key){\n  const preRec = STATE.surveys[studentId] && STATE.surveys[studentId][programId] && STATE.surveys[studentId][programId].pre;\n  const postRec = STATE.surveys[studentId] && STATE.surveys[studentId][programId] && STATE.surveys[studentId][programId].post;\n  const items = programPerceptionItems(program(programId))[key];\n  return items.map(it => ({\n    text: it.text,\n    pre: preRec ? preRec[it.id] : null,\n    post: postRec ? postRec[it.id] : null,\n  }));\n}\n// Which of the student's own 탐구 저널 entries actually matched this\n// competency's keyword list, and which words matched — the literal,\n// inspectable evidence behind the journal-derived portion of the score.\nfunction journalEvidence(studentId, programId, key){\n  return studentActivityLogs(studentId, programId)\n    .map(l => ({ sessionNo: l.sessionNo, ts: l.ts, text: l.text, matched: JOURNAL_KEYWORDS[key].filter(k => l.text.includes(k)) }))\n    .filter(e => e.matched.length > 0);\n}\n\nfunction journalKeywordHits(text, key){\n  if (!text) return 0;\n  let hits = 0;\n  JOURNAL_KEYWORDS[key].forEach(k => { if (text.includes(k)) hits++; });\n  return hits;\n}\n// Baseline 50 (student engaged but no distinct signal detected) + 25 per\n// average keyword hit per entry, capped at 100. Disclosed verbatim in the UI.\nfunction journalScore(studentId, programId){\n  const logs = studentActivityLogs(studentId, programId);\n  if (!logs.length) return null;\n  const out = {};\n  for (const c of COMP){\n    const totalHits = logs.reduce((sum,l) => sum + journalKeywordHits(l.text, c.key), 0);\n    const density = totalHits / logs.length;\n    out[c.key] = Math.min(100, Math.round(50 + density*25));\n  }\n  return out;\n}\nfunction loginDayCount(studentId){\n  const acc = STATE.accounts.find(a=>a.id===studentId);\n  if (!acc || !acc.loginLog) return 0;\n  return new Set(acc.loginLog.map(ts => ts.slice(0,10))).size;\n}\nfunction sentMessageCount(studentId){\n  let count = 0;\n  Object.values(STATE.chats).forEach(c => {\n    if (!c.participants || !c.participants.includes(studentId)) return;\n    count += (c.messages||[]).filter(m=>m.sender===studentId).length;\n  });\n  return count;\n}\nfunction initiatedChatCount(studentId){\n  return Object.values(STATE.chats).filter(c => c.requestedBy === studentId).length;\n}\nfunction usageScore(studentId){\n  return {\n    collab: Math.min(100, sentMessageCount(studentId) * 12),\n    self:   Math.min(100, loginDayCount(studentId) * 10 + initiatedChatCount(studentId) * 15),\n  };\n}\n// behaviorScore = the \"AI 자동 수집 행동 데이터\" — journal analysis for every\n// competency, usage-log signal blended in only where a usage proxy exists\n// (협업 = messages sent, 자기주도성 = login frequency + chats initiated).\nfunction behaviorScore(studentId, programId){\n  const j = journalScore(studentId, programId);\n  if (!j) return null;\n  const u = usageScore(studentId);\n  return {\n    problem: j.problem,\n    creativity: j.creativity,\n    collab: Math.round(0.7*j.collab + 0.3*u.collab),\n    self: Math.round(0.7*j.self + 0.3*u.self),\n  };\n}\n\n// Builds the detailed, evidence-cited analytical paragraph for one\n// competency — every clause names a concrete, real data point (a specific\n// survey item's before/after values, an actual journal quote and which\n// keyword in it matched, real usage counts) rather than a generic template.\nfunction competencyNarrative(c, before, after, delta, surveyItems, journalEv, usage){\n  const dirText = delta > 0 ? `${delta}점 상승했습니다` : delta < 0 ? `${Math.abs(delta)}점 하락했습니다` : '거의 변화가 없었습니다';\n  let s = `${c.label} 점수는 사전 ${before}점에서 사후(행동 데이터 반영) ${after}점으로 ${dirText}.`;\n\n  const risen = surveyItems.filter(it => typeof it.pre === 'number' && typeof it.post === 'number' && it.post > it.pre);\n  const flat = surveyItems.filter(it => typeof it.pre === 'number' && typeof it.post === 'number' && it.post === it.pre);\n  if (risen.length) {\n    const ex = risen.slice().sort((a,b)=>(b.post-b.pre)-(a.post-a.pre))[0];\n    s += ` 인식 설문에서는 \"${ex.text}\" 문항이 ${ex.pre}점→${ex.post}점으로 오르는 등 ${surveyItems.length}개 문항 중 ${risen.length}개에서 응답이 상승했습니다.`;\n  } else if (flat.length === surveyItems.length) {\n    s += ` 인식 설문 3개 문항 모두 응답에 변화가 없었습니다.`;\n  } else {\n    s += ` 인식 설문 응답에는 뚜렷한 상승이 확인되지 않았습니다.`;\n  }\n\n  if (journalEv.length) {\n    const uniqueKeywords = [...new Set(journalEv.flatMap(e => e.matched))];\n    const quote = journalEv[0].text.length > 46 ? journalEv[0].text.slice(0, 46) + '…' : journalEv[0].text;\n    s += ` 탐구 저널 ${journalEv.length}건에서 \"${uniqueKeywords.slice(0,3).join('\", \"')}\" 표현이 확인되어(예: ${journalEv[0].sessionNo}차시 — \"${quote}\") 실제 행동으로도 뒷받침됩니다.`;\n  } else {\n    s += ` 아직 탐구 저널에서는 이 역량과 관련된 표현이 확인되지 않았습니다.`;\n  }\n\n  if (usage) {\n    s += ` 여기에 플랫폼 사용 로그(로그인 ${usage.days}일, 보낸 메시지 ${usage.msgs}건${usage.initiated ? ', 직접 개설한 대화 '+usage.initiated+'건' : ''})도 30% 비중으로 반영되었습니다.`;\n  }\n  return s;\n}\n\nfunction growthReport(studentId, programId){\n  if (!programId) {\n    return { ready:false, reason:'배정된 프로그램(학교·회차)이 없습니다. 관리자가 먼저 프로그램에 등록해야 합니다.' };\n  }\n  const pre = perceptionScore(studentId, programId, 'pre');\n  const post = perceptionScore(studentId, programId, 'post');\n  const beh = behaviorScore(studentId, programId);\n  if (!pre || !post) {\n    return { ready:false, pre, post, beh,\n      reason: !pre ? '사전 설문이 아직 제출되지 않았습니다.' : '사후 설문이 아직 제출되지 않았습니다.' };\n  }\n  const usedBehavior = !!beh;\n  const days = loginDayCount(studentId), msgs = sentMessageCount(studentId), initiated = initiatedChatCount(studentId);\n  const comp = {};\n  for (const c of COMP){\n    const before = pre[c.key];\n    const after = usedBehavior && beh[c.key] != null\n      ? Math.round(0.5*post[c.key] + 0.5*beh[c.key])\n      : post[c.key];\n    const surveyItems = perceptionItemDetail(studentId, programId, c.key);\n    const jEv = journalEvidence(studentId, programId, c.key);\n    const usage = (c.key === 'collab' || c.key === 'self') ? { days, msgs, initiated } : null;\n    comp[c.key] = {\n      before, after, delta: after - before,\n      surveyItems, journalEvidence: jEv, usage,\n      narrative: competencyNarrative(c, before, after, after-before, surveyItems, jEv, usage),\n    };\n  }\n  const ranked = [...COMP].map(c=>c.key).sort((a,b)=>comp[b].delta - comp[a].delta);\n  const top1 = ranked[0], top2 = ranked[1], low = ranked[3];\n  const sessionCount = studentActivityLogs(studentId, programId).length;\n  const insight = `${compLabel(top1)} 행동과 ${compLabel(top2)} 행동이 뚜렷하게 증가했습니다` +\n    `(${compLabel(top1)} ▲${comp[top1].delta}, ${compLabel(top2)} ▲${comp[top2].delta}). ` +\n    `${BEHAVIOR_PHRASES[top1]}. 반면 ${compLabel(low)}은(는) 상대적으로 변화 폭이 작아(▲${comp[low].delta}) ` +\n    `추가적인 경험이 필요합니다.` + (usedBehavior ? '' : ' (아직 활동 기록이 없어 인식 설문 결과만 반영된 값입니다.)');\n  return { ready:true, comp, top1, top2, low, insight, usedBehavior, sessionCount };\n}\n\nfunction studentTimeline(studentId){\n  const acc = STATE.accounts.find(a=>a.id===studentId);\n  const items = [];\n  if (acc) items.push({ ts: acc.createdAt, title:'학생 계정 등록', desc: acc.name + ' · ' + (acc.grade||'') + (acc.school? ' · '+acc.school : '') });\n  const surveysByProgram = STATE.surveys[studentId] || {};\n  Object.keys(surveysByProgram).forEach(pid => {\n    const p = program(pid);\n    const label = p ? `${p.school} · ${p.name}` : pid;\n    if (surveysByProgram[pid].pre) items.push({ ts: surveysByProgram[pid].pre._submittedAt, title:'사전 설문 제출', desc: label });\n    if (surveysByProgram[pid].post) items.push({ ts: surveysByProgram[pid].post._submittedAt, title:'사후 설문 제출', desc: label });\n  });\n  // group activity-journal entries by program+session for a compact history\n  const logs = STATE.activityLogs[studentId] || [];\n  const bySession = {};\n  logs.forEach(l => {\n    const key = l.programId + '::' + l.sessionNo;\n    if (!bySession[key]) bySession[key] = { ...l, count:0 };\n    bySession[key].count++;\n    if (new Date(l.ts) > new Date(bySession[key].ts)) bySession[key].ts = l.ts;\n  });\n  Object.values(bySession).forEach(g => {\n    const p = program(g.programId);\n    items.push({ ts:g.ts, title:`${g.sessionNo}차시 탐구 저널 작성`, desc: p ? `${p.school} · ${p.name}` : '' });\n  });\n  return items.filter(i=>i.ts).sort((a,b)=> new Date(a.ts) - new Date(b.ts));\n}\nfunction fmtDate(ts){\n  if (!ts) return '';\n  const d = new Date(ts);\n  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;\n}\nfunction accountName(id){ const a = STATE.accounts.find(x=>x.id===id); return a ? a.name : '알 수 없음'; }\nfunction chatKey(a,b){ return [a,b].sort().join('::'); }\nfunction getChat(a,b){\n  return STATE.chats[chatKey(a,b)] || { status:'none', requestedBy:null, participants:[a,b], messages:[] };\n}\nfunction studentSurveyDone(studentId, phase){\n  const acc = STATE.accounts.find(a=>a.id===studentId);\n  const pid = acc && acc.programId;\n  return !!(pid && STATE.surveys[studentId] && STATE.surveys[studentId][pid] && STATE.surveys[studentId][pid][phase]);\n}\n\n/* ---------------- small UI helpers ---------------- */\nfunction toast(msg){\n  const t = document.getElementById('toast');\n  if (!t) return;\n  t.textContent = msg; t.classList.add('show');\n  clearTimeout(toast._t);\n  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);\n}\nfunction esc(s){\n  return String(s==null?'':s).replace(/[&<>\"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));\n}\nfunction barChart(pairs, {height=150}={}){\n  const max = 100;\n  let html = `<div class=\"chart\">`;\n  pairs.forEach(p=>{\n    const preH = Math.round((p.pre/max)*height);\n    const postH = Math.round((p.post/max)*height);\n    html += `<div class=\"chart-group\">\n      <div class=\"chart-bars\">\n        <div class=\"bar\" style=\"height:${preH}px;background:var(--before-fill)\" title=\"${esc(p.label)} 교육 전 ${p.pre}점\"><span class=\"bar-value\" style=\"color:var(--text-muted)\">${p.pre}</span></div>\n        <div class=\"bar\" style=\"height:${postH}px;background:var(${p.color})\" title=\"${esc(p.label)} 교육 후 ${p.post}점\"><span class=\"bar-value\">${p.post}</span></div>\n      </div>\n      <div class=\"chart-delta\">▲${p.post-p.pre}</div>\n      <div class=\"chart-label\">${esc(p.label)}</div>\n    </div>`;\n  });\n  html += `</div>`;\n  return html;\n}\nfunction legendHtml(){\n  let html = `<div class=\"legend\"><div class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:var(--before-fill)\"></span>교육 전</div>`;\n  COMP.forEach(c=>{ html += `<div class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:var(${c.color})\"></span>${c.label} · 교육 후</div>`; });\n  html += `</div>`;\n  return html;\n}\nfunction icon(name){\n  const I = {\n    grid:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.5\"/></svg>',\n    users:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"8.5\" cy=\"8\" r=\"2.6\"/><circle cx=\"16\" cy=\"9\" r=\"2.2\"/><path d=\"M3.5 19c.6-3.2 2.6-5 5-5s4.4 1.8 5 5\"/><path d=\"M13.2 14.3c1.8.2 3.3 1.8 3.8 4.4\"/></svg>',\n    user:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"8\" r=\"3.2\"/><path d=\"M5 20c1.2-4 4-6 7-6s5.8 2 7 6\"/></svg>',\n    doc:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M6 3.5h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z\"/><path d=\"M9 13l2.2 2.2L15 11\" /></svg>',\n    chat:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 5.5h16v11H9l-4 3.5v-3.5H4z\"/></svg>',\n    home:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 10.5L12 4l8 6.5\"/><path d=\"M6 9.5V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9.5\"/></svg>',\n    edit:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 12h15\"/><path d=\"M13 6l6 6-6 6\"/></svg>',\n    back:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M20 12H5\"/><path d=\"M11 6l-6 6 6 6\"/></svg>',\n    flask:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M10 3.5h4\"/><path d=\"M10.5 3.5v5.7L5.7 17.8A2 2 0 0 0 7.4 20.5h9.2a2 2 0 0 0 1.7-2.7l-4.8-8.6V3.5\"/><path d=\"M8.3 15h7.4\"/></svg>',\n    check:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"8.2\"/><path d=\"M8.5 12.3l2.3 2.3 4.7-5\"/></svg>',\n    clipboard:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"5\" y=\"4.5\" width=\"14\" height=\"16\" rx=\"1.5\"/><rect x=\"9\" y=\"3\" width=\"6\" height=\"3\" rx=\"1\"/><path d=\"M8.5 11h7M8.5 14.5h7M8.5 18h4.5\"/></svg>',\n  };\n  return I[name] || '';\n}\n\n/* ---------------- login ---------------- */\nfunction renderLogin(){\n  const root = document.getElementById('root');\n  root.innerHTML = `\n    <div class=\"login-wrap\">\n      <div class=\"login-card\">\n        <div class=\"login-brand\">\n          <div class=\"mark\"></div>\n          <div class=\"txt\"><div class=\"n\">NOVA LAB</div><div class=\"s\">GROWTH SYSTEM</div></div>\n        </div>\n        <h1>로그인</h1>\n        <div class=\"sub\">역할에 맞는 계정으로 로그인하세요.</div>\n        <div id=\"login-error-slot\"></div>\n        <div class=\"field\"><label>아이디</label><input id=\"login-id\" autocomplete=\"username\" /></div>\n        <div class=\"field\"><label>비밀번호</label><input id=\"login-pw\" type=\"password\" autocomplete=\"current-password\" /></div>\n        <button class=\"btn btn-primary btn-block\" id=\"login-btn\">로그인</button>\n        <div class=\"login-foot\">계정이 없다면 관리자에게 발급을 요청하세요.</div>\n      </div>\n    </div>`;\n  const doLogin = () => {\n    const id = document.getElementById('login-id').value.trim();\n    const pw = document.getElementById('login-pw').value;\n    const acc = STATE.accounts.find(a => a.id === id && a.pw === pw);\n    const slot = document.getElementById('login-error-slot');\n    if (!acc) { slot.innerHTML = `<div class=\"login-error\">아이디 또는 비밀번호가 올바르지 않습니다.</div>`; return; }\n    session = { accountId: acc.id };\n    persistSession();\n    resetNavState();\n    // Real, automatic usage telemetry: every login is timestamped on the\n    // shared account record — this is part of what feeds a student's\n    // auto-collected \"자기주도성\" behavior signal (see loginDayCount above).\n    saveState(d => {\n      const a = d.accounts.find(x=>x.id===acc.id);\n      if (!a.loginLog) a.loginLog = [];\n      a.loginLog.push(new Date().toISOString());\n    });\n  };\n  document.getElementById('login-btn').addEventListener('click', doLogin);\n  root.querySelectorAll('#login-id, #login-pw').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));\n}\nfunction logout(){\n  session = { accountId: null };\n  persistSession();\n  resetNavState();\n  render();\n}\n// Nav-position variables are plain module-level state, not tied to any one\n// account — clear them whenever the logged-in account changes so switching\n// users on the same device never leaves one person's view/selection (a\n// student detail, a chat thread, a survey phase) showing for the next.\nfunction resetNavState(){\n  currentView = null;\n  currentAdminStudent = null;\n  currentAdminProgram = null;\n  currentMentorStudent = null;\n  currentMentorOtherChat = null;\n  currentMentorPlanProgram = null;\n  mentorPlanDraft = null;\n  currentAdminSafetyChat = null;\n  currentCommunityPeer = null;\n  currentChatMentor = null;\n  currentJournalProgram = null;\n  currentSurveyProgram = null;\n  surveyPhase = 'pre';\n}\n\n/* ---------------- app shell / nav ---------------- */\nconst NAV_BY_ROLE = {\n  admin:  [ { id:'overview', label:'전체 현황', icon:'grid' },\n            { id:'students', label:'학생 관리', icon:'user' },\n            { id:'mentors',  label:'멘토 관리', icon:'users' },\n            { id:'programs', label:'프로그램 관리', icon:'doc' },\n            { id:'lessonplans', label:'지도안 승인', icon:'clipboard' },\n            { id:'courses',  label:'심화 교육 관리', icon:'flask' },\n            { id:'applications', label:'교육 신청 관리', icon:'check' },\n            { id:'safety',   label:'안전 모니터링', icon:'chat' } ],\n  mentor: [ { id:'mystudents', label:'담당 학생', icon:'users' },\n            { id:'lessonplan-author', label:'지도안 작성', icon:'clipboard' } ],\n  student:[ { id:'home',      label:'나의 성장', icon:'home' },\n            { id:'journal',   label:'탐구 저널', icon:'edit' },\n            { id:'survey',    label:'성장 설문', icon:'doc' },\n            { id:'mycourses', label:'심화 교육 신청', icon:'flask' },\n            { id:'chat',      label:'멘토와 대화', icon:'chat' },\n            { id:'community', label:'또래 커뮤니티', icon:'users' } ],\n};\nconst VIEW_META = {\n  overview:{ title:'전체 현황', desc:'등록된 학생과 멘토, 데이터 수집 현황을 확인합니다.' },\n  students:{ title:'학생 관리', desc:'학생 계정을 등록하고 담당 멘토·프로그램을 배정합니다.' },\n  mystudents:{ title:'담당 학생', desc:'배정된 학생의 데이터를 입력하고 확인합니다.' },\n  mentors: { title:'멘토 관리', desc:'청년 강사(멘토) 계정을 등록합니다.' },\n  programs:{ title:'프로그램 관리', desc:'학교별·회차별 수업(프로그램)을 등록합니다.' },\n  lessonplans:{ title:'지도안 승인', desc:'멘토가 작성한 수업 지도안을 검토하고 승인·반려합니다. 승인해야 정규 교육으로 반영됩니다.' },\n  'lessonplan-author':{ title:'지도안 작성', desc:'담당 수업의 실제 지도안(주제·시간·학습목표·도입-전개-정리)을 작성하고 수강 학생을 선택해 관리자 승인을 요청합니다.' },\n  courses: { title:'심화 교육 관리', desc:'학생들이 신청할 수 있는 후속 심화 STEM 교육 과정을 확인합니다.' },\n  applications:{ title:'교육 신청 관리', desc:'학생들의 심화 교육 신청을 확인하고 승인·반려합니다.' },\n  mycourses:{ title:'심화 교육 신청', desc:'관심 있는 후속 심화 STEM 교육에 신청할 수 있습니다. 신청은 관리자 승인 후 확정됩니다.' },\n  safety:  { title:'안전 모니터링', desc:'진행 중인 모든 1:1 대화를 관리자가 확인할 수 있습니다.' },\n  home:    { title:'나의 성장', desc:'나의 Growth Report와 Growth Profile을 확인합니다.' },\n  journal: { title:'탐구 저널', desc:'수업 차시마다 실제로 무엇을 시도했는지 기록합니다. 이 기록이 행동 데이터의 원천입니다.' },\n  survey:  { title:'성장 설문', desc:'교육 전·후 인식 데이터를 입력합니다.' },\n  chat:    { title:'멘토와 대화', desc:'담당 멘토뿐 아니라 원하는 멘토를 선택해 1:1 대화를 요청할 수 있습니다.' },\n  community:{ title:'또래 커뮤니티', desc:'같은 학교 친구들을 찾아보고 대화를 시작해보세요.' },\n};\nlet currentView = null;\nlet currentAdminStudent = null;\nlet currentAdminProgram = null;\nlet currentMentorStudent = null;\nlet currentMentorOtherChat = null;\nlet currentMentorPlanProgram = null;\n// In-progress lesson-plan draft (도입/전개/정리 activity rows a mentor is\n// currently editing, before submit). Deliberately NOT persisted through\n// stashNavState/sessionStorage — like any unsaved form field elsewhere in\n// this app, it only becomes durable once the mentor submits.\nlet mentorPlanDraft = null;\nlet currentAdminSafetyChat = null;\nlet currentCommunityPeer = null;\nlet currentChatMentor = null;\nlet currentJournalProgram = null;\nlet currentSurveyProgram = null;\nlet surveyPhase = 'pre';\n\n// A successful artifact.publish() reloads this view. Stash where the viewer\n// was navigated to right before publishing, and restore it once on boot, so\n// a save doesn't visibly bounce them back to the top of the app.\n(function restoreNavState(){\n  try {\n    const raw = sessionStorage.getItem('novalab_nav');\n    if (raw) {\n      const nav = JSON.parse(raw);\n      currentView = nav.currentView || null;\n      currentAdminStudent = nav.currentAdminStudent || null;\n      currentAdminProgram = nav.currentAdminProgram || null;\n      currentMentorStudent = nav.currentMentorStudent || null;\n      currentMentorOtherChat = nav.currentMentorOtherChat || null;\n      currentMentorPlanProgram = nav.currentMentorPlanProgram || null;\n      currentAdminSafetyChat = nav.currentAdminSafetyChat || null;\n      currentCommunityPeer = nav.currentCommunityPeer || null;\n      currentChatMentor = nav.currentChatMentor || null;\n      currentJournalProgram = nav.currentJournalProgram || null;\n      currentSurveyProgram = nav.currentSurveyProgram || null;\n      if (nav.surveyPhase) surveyPhase = nav.surveyPhase;\n      sessionStorage.removeItem('novalab_nav');\n    }\n  } catch(e) {}\n})();\nfunction stashNavState(){\n  try {\n    sessionStorage.setItem('novalab_nav', JSON.stringify({\n      currentView, currentAdminStudent, currentAdminProgram, currentMentorStudent, currentMentorOtherChat, currentMentorPlanProgram, currentAdminSafetyChat, currentCommunityPeer, currentChatMentor, currentJournalProgram, currentSurveyProgram,\n      surveyPhase: (typeof surveyPhase !== 'undefined' ? surveyPhase : undefined),\n    }));\n  } catch(e) {}\n}\n\nfunction render(){\n  const acc = currentAccount();\n  if (!acc) { renderLogin(); return; }\n  if (!currentView || !NAV_BY_ROLE[acc.role].some(v=>v.id===currentView)) {\n    currentView = NAV_BY_ROLE[acc.role][0].id;\n  }\n  renderShell(acc);\n}\n\nfunction renderShell(acc){\n  const root = document.getElementById('root');\n  const navs = NAV_BY_ROLE[acc.role];\n  root.innerHTML = `\n    <div class=\"app\">\n      <aside class=\"sidebar\">\n        <div class=\"brand\">\n          <div class=\"brand-mark\"></div>\n          <div class=\"brand-text\"><div class=\"name\">NOVA LAB</div><div class=\"sub\">GROWTH SYSTEM</div></div>\n        </div>\n        <ul class=\"nav\" id=\"nav-list\"></ul>\n        <div class=\"sidebar-foot\">\n          <div class=\"who\">\n            <div class=\"avatar\">${esc(acc.name[0])}</div>\n            <div class=\"meta\"><div class=\"n\">${esc(acc.name)}</div><div class=\"r\">${roleLabel(acc.role)}</div></div>\n          </div>\n          <button class=\"btn btn-ghost btn-block\" id=\"logout-btn\">로그아웃</button>\n        </div>\n      </aside>\n      <div class=\"main\">\n        <div class=\"topbar\">\n          <div><h1 id=\"view-title\"></h1><div class=\"desc\" id=\"view-desc\"></div></div>\n          <span class=\"pill\" id=\"write-status\"></span>\n        </div>\n        <div class=\"content\"><div id=\"views\"></div></div>\n      </div>\n    </div>`;\n  document.getElementById('logout-btn').addEventListener('click', logout);\n  const navList = document.getElementById('nav-list');\n  navs.forEach(v => {\n    const li = document.createElement('li');\n    li.className = 'nav-item' + (v.id===currentView ? ' active' : '');\n    li.innerHTML = icon(v.icon) + `<span>${v.label}</span>`;\n    li.addEventListener('click', () => { currentView = v.id; render(); });\n    navList.appendChild(li);\n  });\n  document.getElementById('view-title').textContent = VIEW_META[currentView].title;\n  document.getElementById('view-desc').textContent = VIEW_META[currentView].desc;\n  renderWriteStatus();\n  const viewsEl = document.getElementById('views');\n  const view = document.createElement('div'); view.className = 'view active'; viewsEl.appendChild(view);\n  if (acc.role === 'admin') renderAdminView(view, acc);\n  else if (acc.role === 'mentor') renderMentorView(view, acc);\n  else renderStudentView(view, acc);\n}\nfunction roleLabel(r){ return r==='admin' ? '관리자' : r==='mentor' ? '청년 강사' : '학생'; }\n\n/* ================= ADMIN ================= */\nfunction renderAdminView(el, acc){\n  if (currentView === 'overview') return renderAdminOverview(el);\n  if (currentView === 'students') return renderAdminStudents(el);\n  if (currentView === 'mentors') return renderAdminMentors(el);\n  if (currentView === 'programs') return renderAdminPrograms(el);\n  if (currentView === 'lessonplans') return renderAdminLessonPlans(el);\n  if (currentView === 'courses') return renderAdminCourses(el);\n  if (currentView === 'applications') return renderAdminApplications(el);\n  if (currentView === 'safety') return renderAdminSafety(el);\n}\n\nfunction renderAdminOverview(el){\n  const students = STATE.accounts.filter(a=>a.role==='student');\n  const mentors = STATE.accounts.filter(a=>a.role==='mentor');\n  const preDone = students.filter(s => studentSurveyDone(s.id,'pre')).length;\n  const postDone = students.filter(s => studentSurveyDone(s.id,'post')).length;\n  const reportReady = students.filter(s => growthReport(s.id, currentProgramId(s)).ready).length;\n  const assigned = students.filter(s => studentMentorId(s.id)).length;\n  const totalJournalLogs = Object.values(STATE.activityLogs).reduce((sum, logs) => sum + logs.length, 0);\n  const reportCounts = students.map(s => studentReadyReportCount(s.id));\n  const totalReports = reportCounts.reduce((a,b)=>a+b,0);\n  const repeatStudents = reportCounts.filter(n => n >= 2).length;\n\n  el.innerHTML = `\n    <div class=\"stat-row\">\n      <div class=\"stat-tile\"><div class=\"label\">등록 학생</div><div class=\"value\">${students.length}명</div><div class=\"sub muted\">멘토 배정 ${assigned}명</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">등록 멘토</div><div class=\"value\">${mentors.length}명</div><div class=\"sub muted\">청년 강사</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">진행 중인 프로그램</div><div class=\"value\">${STATE.programs.length}개</div><div class=\"sub muted\">학교·회차 기준</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">누적 탐구 저널</div><div class=\"value\">${totalJournalLogs}건</div><div class=\"sub muted\">학생이 직접 작성 · AI 자동 분석</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">사전 · 사후 설문 완료</div><div class=\"value\">${preDone} / ${postDone}</div><div class=\"sub muted\">학생 수 기준</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">Growth Report 생성 가능</div><div class=\"value\">${reportReady}명</div><div class=\"sub ${reportReady? '' : 'muted'}\">${reportReady? '실제 데이터 기반' : '데이터 수집 중'}</div></div>\n      <div class=\"stat-tile\"><div class=\"label\">누적 성장 보고서</div><div class=\"value\">${totalReports}건</div><div class=\"sub muted\">${repeatStudents}명이 2회 이상 참여 · 회차별 리포트 축적</div></div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">STUDENTS</span><h2>학생별 데이터 현황</h2></div><div class=\"hint\">이름을 누르면 회차별 성장 보고서와 추이를 모두 볼 수 있습니다</div></div>\n      ${students.length === 0 ? `<div class=\"empty-state\">등록된 학생이 없습니다. '학생 관리'에서 첫 학생을 등록해보세요.</div>` : `\n      <div class=\"table-wrap\"><table>\n        <thead><tr><th>학생</th><th>학년</th><th>프로그램</th><th>담당 멘토</th><th>사전 설문</th><th>탐구 저널</th><th>사후 설문</th><th>누적 리포트</th></tr></thead>\n        <tbody>\n          ${students.map(s=>{\n            const mentorId = studentMentorId(s.id);\n            const mentor = mentorId ? STATE.accounts.find(m=>m.id===mentorId) : null;\n            const pid = currentProgramId(s);\n            const prog = program(pid);\n            const pre = studentSurveyDone(s.id,'pre');\n            const post = studentSurveyDone(s.id,'post');\n            const beh = studentActivityLogs(s.id, pid).length;\n            const readyCount = studentReadyReportCount(s.id);\n            return `<tr class=\"row-link\" data-id=\"${s.id}\" style=\"cursor:pointer;\">\n              <td>${esc(s.name)}</td><td>${esc(s.grade||'-')}</td>\n              <td>${prog ? esc(prog.school+' · '+prog.name) : '<span class=\"pill pill-muted\">미배정</span>'}</td>\n              <td>${mentor ? esc(mentor.name) : '<span class=\"pill pill-muted\">미배정</span>'}</td>\n              <td>${pre ? '<span class=\"pill pill-good\">완료</span>' : '<span class=\"pill pill-muted\">대기</span>'}</td>\n              <td>${beh ? `<span class=\"pill pill-good\">${beh}건</span>` : '<span class=\"pill pill-muted\">없음</span>'}</td>\n              <td>${post ? '<span class=\"pill pill-good\">완료</span>' : '<span class=\"pill pill-muted\">대기</span>'}</td>\n              <td>${readyCount >= 2 ? `<span class=\"pill pill-good\">${readyCount}건 · 추이 가능</span>` : readyCount === 1 ? '<span class=\"pill pill-good\">1건</span>' : '<span class=\"pill pill-muted\">미생성</span>'}</td>\n            </tr>`;\n          }).join('')}\n        </tbody>\n      </table></div>`}\n    </div>`;\n  el.querySelectorAll('.row-link').forEach(row => {\n    row.addEventListener('click', () => { currentAdminStudent = row.dataset.id; currentView = 'students'; render(); });\n  });\n}\n\nfunction renderAdminStudents(el){\n  if (currentAdminStudent) return renderAdminStudentDetail(el, currentAdminStudent);\n  const students = STATE.accounts.filter(a=>a.role==='student');\n  const mentors = STATE.accounts.filter(a=>a.role==='mentor');\n  const selectStyle = 'width:100%;font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary)';\n  el.innerHTML = `\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">REGISTER</span><h2>학생 등록</h2></div></div>\n      <div id=\"admin-student-error\"></div>\n      <div class=\"inline-form\">\n        <div class=\"field\"><label>이름</label><input id=\"new-student-name\" placeholder=\"예: 김민준\" /></div>\n        <div class=\"field\"><label>학년</label><input id=\"new-student-grade\" placeholder=\"예: 초6\" /></div>\n        <div class=\"field\"><label>학교</label><input id=\"new-student-school\" placeholder=\"예: 해운초등학교\" /></div>\n        <div class=\"field\"><label>관심 분야 (쉼표로 구분)</label><input id=\"new-student-interests\" placeholder=\"예: 로봇, 환경\" /></div>\n        <div class=\"field\"><label>로그인 아이디</label><input id=\"new-student-id\" placeholder=\"예: student01\" /></div>\n        <div class=\"field\"><label>비밀번호</label><input id=\"new-student-pw\" placeholder=\"아이디와 다른 값으로\" /></div>\n        <button class=\"btn btn-primary\" id=\"add-student-btn\">등록</button>\n      </div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"panel-head\"><div><span class=\"eyebrow\">STUDENTS</span><h2>학생 목록 (${students.length}명)</h2></div></div>\n      ${students.length===0 ? `<div class=\"empty-state\">등록된 학생이 없습니다.</div>` : `\n      <div class=\"list-cards\">\n        ${students.map(s=>{\n          const mentorId = studentMentorId(s.id);\n          const mentor = mentorId ? mentors.find(m=>m.id===mentorId) : null;\n          return `<div class=\"entity-card\" data-id=\"${s.id}\">\n            <div class=\"head\"><div class=\"avatar\">${esc(s.name[0])}</div><div><div class=\"id\">${esc(s.name)}</div><div class=\"grade\">${esc(s.grade||'')}${s.school?' · '+esc(s.school):''}</div></div>\n              <button class=\"btn btn-ghost rename-btn\" data-id=\"${s.id}\" style=\"margin-left:auto;padding:4px 8px;font-size:12px;\">이름 수정</button>\n            </div>\n            <div class=\"chip-row\">${(s.interests||[]).map(i=>`<span class=\"tag\">${esc(i)}</span>`).join('')}</div>\n            <div class=\"chip-row\"><span class=\"tag\">담당 멘토: ${mentor ? esc(mentor.name) : '프로그램 미배정'}</span></div>\n            <select class=\"program-select\" data-id=\"${s.id}\" style=\"${selectStyle};margin-top:6px;\">\n              <option value=\"\">프로그램 미배정</option>\n              ${STATE.programs.map(p=>{\n                const pm = p.mentorId ? STATE.accounts.find(m=>m.id===p.mentorId) : null;\n                return `<option value=\"${p.id}\" ${s.programId===p.id?'selected':''}>${esc(p.school)} · ${esc(p.name)}${pm?' (멘토: '+esc(pm.name)+')':''}</option>`;\n              }).join('')}\n            </select>\n          </div>`;\n        }).join('')}\n      </div>`}\n    </div>`;\n  document.getElementById('add-student-btn').addEventListener('click', () => {\n    const name = document.getElementById('new-student-name').value.trim();\n    const grade = document.getElementById('new-student-grade').value.trim();\n    const school = document.getElementById('new-student-school').value.trim();\n    const interests = document.getElementById('new-student-interests').value.split(',').map(s=>s.trim()).filter(Boolean);\n    const id = document.getElementById('new-student-id').value.trim();\n    const pw = document.getElementById('new-student-pw').value;\n    const err = document.getElementById('admin-student-error');\n    if (!name || !id || !pw) { err.innerHTML = `<div class=\"login-error\">이름·아이디·비밀번호를 입력해주세요.</div>`; return; }\n    if (id === pw) { err.innerHTML = `<div class=\"login-error\">아이디와 비밀번호를 다르게 설정해주세요.</div>`; return; }\n    if (STATE.accounts.some(a=>a.id===id)) { err.innerHTML = `<div class=\"login-error\">이미 사용 중인 아이디입니다.</div>`; return; }\n    saveState(d => { d.accounts.push({ id, pw, role:'student', name, grade, school, interests, programId:null, created
