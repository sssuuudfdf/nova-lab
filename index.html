          const chat = getChat(acc.id, m.id);
          const statusPill = chat.status==='active' ? '<span class="pill pill-good">대화 중</span>'
            : chat.status==='pending' ? (chat.requestedBy===acc.id ? '<span class="pill pill-muted">요청 보냄</span>' : '<span class="pill pill-warn">대화 요청 옴</span>')
            : '';
          const relTag = m.id===myMentorId ? '<span class="tag" style="color:var(--accent);">현재 담당 멘토</span>'
            : taughtByIds.has(m.id) ? '<span class="tag">이전에 배운 멘토</span>' : '';
          return `<div class="entity-card" data-id="${m.id}" style="cursor:pointer;">
            <div class="head"><div class="avatar" style="background:var(--s-collab-soft); color:var(--s-collab);">${esc(m.name[0])}</div><div><div class="id">${esc(m.name)}</div><div class="grade">${esc(m.field||'')}</div></div>${statusPill}</div>
            ${relTag ? `<div class="chip-row">${relTag}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`}
    </div>`;
  el.querySelectorAll('.entity-card').forEach(card => card.addEventListener('click', () => { currentChatMentor = card.dataset.id; render(); }));
}
function renderStudentChatWithMentor(el, acc){
  const mentor = STATE.accounts.find(a=>a.id===currentChatMentor);
  if (!mentor) { currentChatMentor = null; return renderStudentChat(el, acc); }
  el.innerHTML = `<button class="btn btn-ghost" id="back-btn" style="margin-bottom:14px;">${icon('back')} 목록으로</button>
    <div class="panel"><div class="panel-head"><h2>${esc(mentor.name)} 멘토와의 대화</h2></div><div id="chat-slot"></div></div>`;
  document.getElementById('back-btn').addEventListener('click', () => { currentChatMentor = null; render(); });
  renderChatPanel(document.getElementById('chat-slot'), acc.id, mentor.id, { viewerId: acc.id, readOnly:false });
}
function renderStudentCommunity(el, acc){
  if (currentCommunityPeer) return renderStudentCommunityChat(el, acc);
  const peers = STATE.accounts.filter(a => a.role==='student' && a.id !== acc.id && a.school && acc.school && a.school === acc.school);
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">COMMUNITY</span><h2>${acc.school ? esc(acc.school)+'의 다른 학생들' : '같은 학교 친구들'}</h2></div><div class="hint">이름·학년·관심 분야만 공개됩니다</div></div>
      ${!acc.school ? `<div class="empty-state">학교 정보가 등록되어 있지 않아 또래를 찾을 수 없습니다. 관리자에게 학교 등록을 요청하세요.</div>` :
        peers.length===0 ? `<div class="empty-state">같은 학교에 등록된 다른 학생이 아직 없습니다.</div>` : `
      <div class="list-cards">
        ${peers.map(p=>{
          const chat = getChat(acc.id, p.id);
          const statusPill = chat.status==='active' ? '<span class="pill pill-good">대화 중</span>'
            : chat.status==='pending' ? (chat.requestedBy===acc.id ? '<span class="pill pill-muted">요청 보냄</span>' : '<span class="pill pill-warn">대화 요청 옴</span>')
            : '';
          return `<div class="entity-card" data-id="${p.id}" style="cursor:pointer;">
            <div class="head"><div class="avatar">${esc(p.name[0])}</div><div><div class="id">${esc(p.name)}</div><div class="grade">${esc(p.grade||'')}</div></div>${statusPill}</div>
            <div class="chip-row">${(p.interests||[]).map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div>
          </div>`;
        }).join('')}
      </div>`}
    </div>`;
  el.querySelectorAll('.entity-card').forEach(card => card.addEventListener('click', () => { currentCommunityPeer = card.dataset.id; render(); }));
}
function renderStudentCommunityChat(el, acc){
  const peer = STATE.accounts.find(a=>a.id===currentCommunityPeer);
  if (!peer) { currentCommunityPeer = null; return renderStudentCommunity(el, acc); }
  el.innerHTML = `<button class="btn btn-ghost" id="back-btn" style="margin-bottom:14px;">${icon('back')} 목록으로</button>
    <div class="panel"><div class="panel-head"><h2>${esc(peer.name)}님과의 대화</h2></div><div id="chat-slot"></div></div>`;
  document.getElementById('back-btn').addEventListener('click', () => { currentCommunityPeer = null; render(); });
  renderChatPanel(document.getElementById('chat-slot'), acc.id, peer.id, { viewerId: acc.id, readOnly:false });
}
function renderStudentSurvey(el, acc){
  const programs = studentEligiblePrograms(acc.id);
  if (!programs.length){
    el.innerHTML = `<div class="panel"><div class="panel-head"><div><span class="eyebrow">SURVEY</span><h2>성장 설문</h2></div></div>
      <div class="empty-state">아직 배정된 프로그램(학교·회차)이 없어 설문을 진행할 수 없습니다. 관리자가 프로그램을 배정하면 설문이 열립니다.</div></div>`;
    return;
  }
  if (!currentSurveyProgram || !programs.some(p => p.id === currentSurveyProgram)){
    currentSurveyProgram = (acc.programId && programs.some(p => p.id === acc.programId)) ? acc.programId : programs[programs.length-1].id;
  }
  const pid = currentSurveyProgram;
  const prog = program(pid);
  const surveys = (STATE.surveys[acc.id] && STATE.surveys[acc.id][pid]) || {};
  const preDone = !!surveys.pre, postDone = !!surveys.post;
  const items = programPerceptionItems(prog);
  const approvedActs = programApprovedActivities(pid);
  const hasCustomItems = approvedActs.length > 0;
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">SURVEY</span><h2>설문 선택</h2></div></div>
      <div class="field" style="max-width:420px;"><label>어떤 수업의 설문인가요?</label>
        <select id="survey-program-select" style="${selectFieldStyle}">
          ${programs.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.school)} · ${esc(p.name)}${p.id===acc.programId?' (현재 수강 중)':''}</option>`).join('')}
        </select>
      </div>
      <div class="chip-row" style="margin-top:12px;">
        <span class="pill ${preDone?'pill-good':'pill-muted'}">사전 설문 ${preDone?'완료':'대기'}</span>
        <span class="pill ${postDone?'pill-good':'pill-muted'}">사후 설문 ${postDone?'완료':'대기'}</span>
      </div>
      <div class="form-actions">
        <button class="btn ${surveyPhase==='pre'?'btn-primary':'btn-ghost'}" id="tab-pre">사전 설문 ${preDone?'다시 작성':'작성'}</button>
        <button class="btn ${surveyPhase==='post'?'btn-primary':'btn-ghost'}" id="tab-post">사후 설문 ${postDone?'다시 작성':'작성'}</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">${surveyPhase==='pre'?'PRE':'POST'}</span><h2>${surveyPhase==='pre'?'교육 전':'교육 후'} 인식 설문</h2></div><div class="hint">1(전혀 아니다) ~ 5(매우 그렇다)</div></div>
      ${hasCustomItems ? `<div class="insight-box" style="margin-bottom:14px;">이 문항들은 "${esc(prog.name)}" 수업의 실제 활동(${approvedActs.map(a=>esc(a)).join(', ')}) — 담당 멘토가 작성하고 관리자가 승인한 지도안 — 을 바탕으로 만들어졌습니다.</div>` : ''}
      <form id="survey-form">
        ${COMP.map(c => `
          <div class="survey-q"><div class="qtext" style="color:var(--accent-strong); font-weight:800; margin-bottom:2px;">${c.label}</div>
            ${items[c.key].map(item => `
              <div class="survey-q" style="padding:10px 0;">
                <div class="qtext">${esc(item.text)}</div>
                <div class="likert">
                  ${[1,2,3,4,5].map(v=>`<label><input type="radio" name="${item.id}" value="${v}" ${(surveys[surveyPhase]&&surveys[surveyPhase][item.id]===v)?'checked':(v===3&&!surveys[surveyPhase]?'checked':'')}/>${v}</label>`).join('')}
                </div>
              </div>`).join('')}
          </div>`).join('')}
        <button type="submit" class="btn btn-primary">${surveyPhase==='pre'?'사전':'사후'} 설문 제출</button>
      </form>
    </div>`;
  document.getElementById('survey-program-select').addEventListener('change', e => { currentSurveyProgram = e.target.value; render(); });
  document.getElementById('tab-pre').addEventListener('click', () => { surveyPhase='pre'; render(); });
  document.getElementById('tab-post').addEventListener('click', () => { surveyPhase='post'; render(); });
  document.getElementById('survey-form').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const rec = { _submittedAt: new Date().toISOString() };
    let allAnswered = true;
    COMP.forEach(c => items[c.key].forEach(item => {
      const v = fd.get(item.id);
      if (!v) allAnswered = false; else rec[item.id] = Number(v);
    }));
    if (!allAnswered) { toast('모든 문항에 답해주세요.'); return; }
    saveState(d => {
      if (!d.surveys[acc.id]) d.surveys[acc.id] = {};
      if (!d.surveys[acc.id][pid]) d.surveys[acc.id][pid] = {};
      d.surveys[acc.id][pid][surveyPhase] = rec;
    });
    toast(`${prog.name} ${surveyPhase==='pre'?'사전':'사후'} 설문이 제출되었습니다.`);
  });
}

/* ================= boot ================= */
render();

</script>
